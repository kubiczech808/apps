[project]
name = "agent-m"
version = "0.1.0"
description = "Medium auto-poster for btc-dca.com — generates Bitcoin DCA articles via Gemini and publishes to Medium"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-telegram-bot[job-queue]>=22.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["agent_m*"]

[project.scripts]
agent-m = "agent_m.__main__:main"
