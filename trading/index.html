<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading - Hello world</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(680px, calc(100vw - 32px));
      padding: 40px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #4b5563;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello world</h1>
    <p>Trading index page is live.</p>
  </main>
</body>
</html>
