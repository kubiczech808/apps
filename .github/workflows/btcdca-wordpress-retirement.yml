name: Retire BTC-DCA WordPress

on:
  push:
    branches:
      - codex/btcdca-wordpress-retirement-release
    paths:
      - '.github/workflows/btcdca-wordpress-retirement.yml'
      - 'btcdca-static/**'
      - 'scripts/audit_btcdca_learn_links.py'
      - 'scripts/stage_btcdca_static_guides.py'
  workflow_dispatch:
    inputs:
      operation:
        description: "stage uploads guides; snapshot archives recovery; isolate is reversible; rollback restores WordPress; purge deletes confirmed isolated data"
        required: true
        default: stage
        type: choice
        options:
          - stage
          - snapshot
          - isolate
          - rollback
          - purge
      backup_run_id:
        description: "Required for isolate or purge: run ID of the validated WordPress snapshot"
        required: false
        type: string
      isolation_run_id:
        description: "Required for purge: successful isolation run ID that you have validated"
        required: false
        type: string
      confirmation:
        description: "For purge, enter exactly PURGE_WORDPRESS"
        required: false
        type: string

concurrency:
  group: btcdca-wordpress-retirement
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  retire-wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
      BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
      BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
      BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
      BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          for name in BTCDCA_FTP_LOGIN BTCDCA_FTP_PASSWORD BTCDCA_DB BTCDCA_DB_USER BTCDCA_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is required."
              exit 1
            fi
          done

      - name: Validate the committed static homepage
        run: |
          set -euo pipefail
          test -f btcdca-static/homepage/index.html
          ! grep -Eqi '<\?php|learn center|latest from the blog|wp-content|wordpress' btcdca-static/homepage/index.html
          grep -Fq 'BTC DCA static homepage' btcdca-static/homepage/index.html

      - name: Audit existing account and application links
        run: |
          set -euo pipefail
          python3 scripts/audit_btcdca_learn_links.py
          cat .github/inspection/btcdca-learn-link-audit.md

      - name: Stage and verify the preserved static guides
        run: |
          set -euo pipefail
          python3 scripts/stage_btcdca_static_guides.py

      - name: Upload stage and link-audit reports
        uses: actions/upload-artifact@v4
        with:
          name: btcdca-static-stage-${{ github.run_id }}
          path: |
            .github/inspection/btcdca-static-stage-report.md
            .github/inspection/btcdca-learn-link-audit.md
          if-no-files-found: error
          retention-days: 90

      - name: Require explicit purge confirmation
        if: inputs.operation == 'purge'
        run: |
          set -euo pipefail
          test '${{ inputs.confirmation }}' = 'PURGE_WORDPRESS'
          test -n '${{ inputs.backup_run_id }}'
          test -n '${{ inputs.isolation_run_id }}'

      - name: Require a validated recovery snapshot before isolation
        if: inputs.operation == 'isolate'
        run: |
          set -euo pipefail
          test -n '${{ inputs.backup_run_id }}'

      - name: Require a clean Learn Center link audit before snapshot, isolation, or purge
        if: inputs.operation == 'snapshot' || inputs.operation == 'isolate' || inputs.operation == 'purge'
        run: |
          set -euo pipefail
          grep -Fq 'No Learn Center references found' .github/inspection/btcdca-learn-link-audit.md

      - name: Install FTP client for isolation, rollback, or purge
        if: inputs.operation == 'isolate' || inputs.operation == 'rollback' || inputs.operation == 'purge'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare WordPress recovery workspace
        if: inputs.operation == 'snapshot'
        run: |
          set -euo pipefail
          mkdir -p backup

      - name: Generate and upload temporary database backup endpoint
        if: inputs.operation == 'snapshot' || inputs.operation == 'isolate' || inputs.operation == 'rollback' || inputs.operation == 'purge'
        run: |
          set -euo pipefail
          export BTCDCA_DB_HELPER_TOKEN="$(openssl rand -hex 32)"
          echo "BTCDCA_DB_HELPER_TOKEN=$BTCDCA_DB_HELPER_TOKEN" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          config = {
              'token': os.environ['BTCDCA_DB_HELPER_TOKEN'],
              'db_name': os.environ['BTCDCA_DB'],
              'db_user': os.environ['BTCDCA_DB_USER'],
              'db_password': os.environ['BTCDCA_DB_PASSWORD'],
          }
          template = Path('scripts/btcdca_wordpress_database_helper.php.template').read_text(encoding='utf-8')
          encoded = base64.b64encode(json.dumps(config).encode('utf-8')).decode('ascii')
          Path('temporary-wordpress-database-helper.php').write_text(
              template.replace('__CONFIG_BASE64__', encoded), encoding='utf-8'
          )
          PY
          php -l temporary-wordpress-database-helper.php
          BTCDCA_TEMP_FILE_MODE=upload \
          BTCDCA_TEMP_FILE_LOCAL=temporary-wordpress-database-helper.php \
          BTCDCA_TEMP_FILE_REMOTE=www/btcdca-wordpress-database-helper.php \
          python3 scripts/manage_btcdca_temporary_file.py

      - name: Generate and upload temporary WordPress archive endpoint
        if: inputs.operation == 'snapshot'
        run: |
          set -euo pipefail
          export BTCDCA_ARCHIVE_HELPER_TOKEN="$(openssl rand -hex 32)"
          echo "BTCDCA_ARCHIVE_HELPER_TOKEN=$BTCDCA_ARCHIVE_HELPER_TOKEN" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          config = {'token': os.environ['BTCDCA_ARCHIVE_HELPER_TOKEN']}
          template = Path('scripts/btcdca_wordpress_archive_helper.php.template').read_text(encoding='utf-8')
          encoded = base64.b64encode(json.dumps(config).encode('utf-8')).decode('ascii')
          Path('temporary-wordpress-archive-helper.php').write_text(
              template.replace('__CONFIG_BASE64__', encoded), encoding='utf-8'
          )
          PY
          php -l temporary-wordpress-archive-helper.php
          BTCDCA_TEMP_FILE_MODE=upload \
          BTCDCA_TEMP_FILE_LOCAL=temporary-wordpress-archive-helper.php \
          BTCDCA_TEMP_FILE_REMOTE=www/btcdca-wordpress-archive-helper.php \
          python3 scripts/manage_btcdca_temporary_file.py

      - name: Export and validate WordPress database before the file backup
        if: inputs.operation == 'snapshot'
        run: |
          set -euo pipefail
          status=0
          curl --fail-with-body --show-error --silent --retry 0 \
            -H "X-BTCDCA-Token: ${BTCDCA_DB_HELPER_TOKEN}" \
            "https://www.btc-dca.com/btcdca-wordpress-database-helper.php?action=export" \
          --output backup/btcdca-wordpress.sql.gz || status=$?
          if [ "$status" -ne 0 ]; then
            echo "Database export endpoint returned an error:"
            if [ -f backup/btcdca-wordpress.sql.gz ]; then
              LC_ALL=C tr -cd '\11\12\15\40-\176' < backup/btcdca-wordpress.sql.gz | head -c 4096
              printf '\n'
            fi
            exit "$status"
          fi
          gzip -t backup/btcdca-wordpress.sql.gz
          test "$(gzip -dc backup/btcdca-wordpress.sql.gz | grep -c '^CREATE TABLE `wp_dca_')" -gt 0

      - name: Archive and download WordPress files after database export succeeds
        if: inputs.operation == 'snapshot'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 0 \
            -H "X-BTCDCA-Token: ${BTCDCA_ARCHIVE_HELPER_TOKEN}" \
            "https://www.btc-dca.com/btcdca-wordpress-archive-helper.php?action=create" \
            --output backup/btcdca-wordpress-files.manifest.json
          curl --fail --show-error --silent --retry 0 \
            -H "X-BTCDCA-Token: ${BTCDCA_ARCHIVE_HELPER_TOKEN}" \
            "https://www.btc-dca.com/btcdca-wordpress-archive-helper.php?action=download" \
            --output backup/btcdca-wordpress-files.zip
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          manifest = json.loads(Path('backup/btcdca-wordpress-files.manifest.json').read_text())
          assert manifest['files'] > 0 and manifest['bytes'] > 0 and manifest['sha256']
          digest = hashlib.sha256()
          with Path('backup/btcdca-wordpress-files.zip').open('rb') as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b''):
                  digest.update(chunk)
          assert digest.hexdigest() == manifest['sha256']
          with ZipFile('backup/btcdca-wordpress-files.zip') as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              assert 'wordpress-root/wp-config.php' in names
              assert 'wordpress-root/index.php' in names
              for directory in ('wp-admin/', 'wp-includes/', 'wp-content/'):
                  assert any(name.startswith('wordpress-files/' + directory) for name in names)
          PY

      - name: Upload WordPress recovery backup
        if: inputs.operation == 'snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: btcdca-wordpress-recovery-${{ github.run_id }}
          path: backup
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Download the validated WordPress recovery backup
        if: inputs.operation == 'isolate' || inputs.operation == 'purge'
        uses: actions/download-artifact@v4
        with:
          name: btcdca-wordpress-recovery-${{ inputs.backup_run_id }}
          path: backup
          run-id: ${{ inputs.backup_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Validate the recovery artifact before isolation or purge
        if: inputs.operation == 'snapshot' || inputs.operation == 'isolate' || inputs.operation == 'purge'
        run: |
          set -euo pipefail
          test -f backup/btcdca-wordpress-files.zip
          test -f backup/btcdca-wordpress.sql.gz
          gzip -t backup/btcdca-wordpress.sql.gz
          python3 - <<'PY'
          import gzip
          import re
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile('backup/btcdca-wordpress-files.zip') as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              assert 'wordpress-root/wp-config.php' in names
              assert 'wordpress-root/index.php' in names
              for directory in ('wp-admin/', 'wp-includes/', 'wp-content/'):
                  assert any(name.startswith('wordpress-files/' + directory) for name in names)
          sql = gzip.decompress(Path('backup/btcdca-wordpress.sql.gz').read_bytes()).decode('utf-8')
          assert sql.startswith('-- BTC-DCA WordPress backup\n')
          tables = re.findall(r'(?:DROP TABLE IF EXISTS|CREATE TABLE|INSERT INTO)\s+`([^`]+)`', sql, re.I)
          assert tables and all(re.fullmatch(r'wp_dca_[A-Za-z0-9_]+', table) for table in tables)
          print(f'Validated {len(set(tables))} WordPress tables and {len(tables)} SQL operations.')
          PY

      - name: Download the successful isolation proof
        if: inputs.operation == 'purge'
        uses: actions/download-artifact@v4
        with:
          name: btcdca-wordpress-isolation-${{ inputs.isolation_run_id }}
          path: isolation-proof
          run-id: ${{ inputs.isolation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Require isolation proof to match the recovery snapshot
        if: inputs.operation == 'purge'
        run: |
          set -euo pipefail
          test -f isolation-proof/isolation-proof.txt
          grep -Fxq 'snapshot_run_id=${{ inputs.backup_run_id }}' isolation-proof/isolation-proof.txt

      - name: Move WordPress files into the reversible isolation directory
        if: inputs.operation == 'isolate'
        run: |
          set -euo pipefail
          BTCDCA_WORDPRESS_FILE_MODE=isolate python3 scripts/isolate_btcdca_wordpress_files.py
          echo 'BTCDCA_WORDPRESS_FILES_ISOLATED=1' >> "$GITHUB_ENV"

      - name: Rename only WordPress database tables to the isolation prefix
        if: inputs.operation == 'isolate'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 0 \
            -H "X-BTCDCA-Token: ${BTCDCA_DB_HELPER_TOKEN}" \
            "https://www.btc-dca.com/btcdca-wordpress-database-helper.php?action=isolate&confirm=ISOLATE_WORDPRESS" \
            --output isolated-wordpress-tables.json
          grep -Fq 'btcdca_isolated_wp_' isolated-wordpress-tables.json
          echo 'BTCDCA_WORDPRESS_DATABASE_ISOLATED=1' >> "$GITHUB_ENV"

      - name: Activate static homepage and static SEO files
        if: inputs.operation == 'isolate'
        run: |
          set -euo pipefail
          python3 scripts/activate_btcdca_static_homepage.py

      - name: Verify public static site and isolated Learn Center
        if: inputs.operation == 'isolate' || inputs.operation == 'purge'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent https://www.btc-dca.com/ | grep -Fq 'BTC DCA static homepage'
          for slug in btc-dca-binance-how-to-set-up-api-key btc-dca-coinmate-how-to-set-up-api-key btc-dca-okx-how-to-set-up-api-key; do
            curl --fail --show-error --silent "https://www.btc-dca.com/${slug}/" | grep -Fq '/assets/img/guides/guide.css'
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.btc-dca.com/learn-center/)" = '410'
          curl --fail --show-error --silent https://www.btc-dca.com/app/ | grep -Eqi '<html|<!doctype'

      - name: Automatically roll back an incomplete isolation
        if: failure() && inputs.operation == 'isolate'
        run: |
          set -uo pipefail
          status=0
          if [ "${BTCDCA_WORDPRESS_DATABASE_ISOLATED:-}" = '1' ]; then
            curl --fail --show-error --silent --retry 0 \
              -H "X-BTCDCA-Token: ${BTCDCA_DB_HELPER_TOKEN}" \
              "https://www.btc-dca.com/btcdca-wordpress-database-helper.php?action=rollback&confirm=ROLLBACK_WORDPRESS" \
              --output rollback-wordpress-tables.json || status=1
          fi
          if [ "${BTCDCA_WORDPRESS_FILES_ISOLATED:-}" = '1' ]; then
            BTCDCA_WORDPRESS_FILE_MODE=rollback python3 scripts/isolate_btcdca_wordpress_files.py || status=1
          fi
          exit "$status"

      - name: Publish verified isolation proof
        if: inputs.operation == 'isolate'
        run: |
          set -euo pipefail
          printf 'snapshot_run_id=%s\nisolation_run_id=%s\n' '${{ inputs.backup_run_id }}' '${{ github.run_id }}' > isolation-proof.txt

      - name: Upload verified isolation proof
        if: inputs.operation == 'isolate'
        uses: actions/upload-artifact@v4
        with:
          name: btcdca-wordpress-isolation-${{ github.run_id }}
          path: isolation-proof.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Restore isolated WordPress database tables
        if: inputs.operation == 'rollback'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 0 \
            -H "X-BTCDCA-Token: ${BTCDCA_DB_HELPER_TOKEN}" \
            "https://www.btc-dca.com/btcdca-wordpress-database-helper.php?action=rollback&confirm=ROLLBACK_WORDPRESS" \
            --output restored-wordpress-tables.json
          grep -Fq 'wp_dca_' restored-wordpress-tables.json

      - name: Restore WordPress files from the isolation directory
        if: inputs.operation == 'rollback'
        run: |
          set -euo pipefail
          BTCDCA_WORDPRESS_FILE_MODE=rollback python3 scripts/isolate_btcdca_wordpress_files.py

      - name: Verify restored WordPress site
        if: inputs.operation == 'rollback'
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.btc-dca.com/wp-login.php)" != '404'
          curl --fail --show-error --silent https://www.btc-dca.com/ | grep -Eqi '<html|<!doctype'

      - name: Purge only isolated WordPress database tables
        if: inputs.operation == 'purge'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 2 \
            -H "X-BTCDCA-Token: ${BTCDCA_DB_HELPER_TOKEN}" \
            "https://www.btc-dca.com/btcdca-wordpress-database-helper.php?action=purge&confirm=PURGE_WORDPRESS" \
            --output purged-wordpress-tables.json
          grep -Fq 'btcdca_isolated_wp_' purged-wordpress-tables.json

      - name: Purge only the confirmed WordPress isolation directory
        if: inputs.operation == 'purge'
        run: |
          set -euo pipefail
          lftp -u "$BTCDCA_FTP_LOGIN","$BTCDCA_FTP_PASSWORD" "ftp://ftp.btc-dca.com" <<'LFTP'
          set cmd:fail-exit true
          set ftp:ssl-allow false
          set ftp:ssl-force false
          rm -r /www/.btcdca-wordpress-isolation
          bye
          LFTP

      - name: Remove temporary database endpoint
        if: always() && (inputs.operation == 'snapshot' || inputs.operation == 'isolate' || inputs.operation == 'rollback' || inputs.operation == 'purge')
        run: |
          BTCDCA_TEMP_FILE_MODE=delete \
          BTCDCA_TEMP_FILE_REMOTE=www/btcdca-wordpress-database-helper.php \
          python3 scripts/manage_btcdca_temporary_file.py

      - name: Remove temporary WordPress archive endpoint and archive
        if: always() && inputs.operation == 'snapshot'
        run: |
          set -euo pipefail
          if [ -n "${BTCDCA_ARCHIVE_HELPER_TOKEN:-}" ]; then
            curl --fail --show-error --silent --retry 1 \
              -H "X-BTCDCA-Token: ${BTCDCA_ARCHIVE_HELPER_TOKEN}" \
              "https://www.btc-dca.com/btcdca-wordpress-archive-helper.php?action=delete" \
              --output /dev/null || true
          fi
          BTCDCA_TEMP_FILE_MODE=delete \
          BTCDCA_TEMP_FILE_REMOTE=www/btcdca-wordpress-archive-helper.php \
          python3 scripts/manage_btcdca_temporary_file.py
