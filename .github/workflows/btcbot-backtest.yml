name: BTC bot — backtest

# Measures the shipped strategy against real candles and prints the result in
# full, wins and losses alike. Run it before changing a setting, and after.

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Which strategy to measure'
        required: false
        default: 'price-action'
        type: choice
        options:
          - price-action
          - momentum
      compare:
        description: 'Run the one-change-at-a-time variant table instead'
        required: false
        default: false
        type: boolean
      source:
        description: 'Candle source (bybit, kraken, coinbase). Empty tries each in turn.'
        required: false
        default: ''
      limit:
        description: 'Hourly candles to fetch. Momentum needs years, not weeks — 15000 is about 20 months.'
        required: false
        default: '6000'
      risk:
        description: 'Risk per trade in % of equity'
        required: false
        default: '1'
      minRR:
        description: 'Minimum reward/risk, measured in sats'
        required: false
        default: '2'
  schedule:
    # Weekly, so a strategy that stops working shows up in the log rather than
    # only in the account.
    - cron: '17 5 * * 1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: btc-bot

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backtest
        run: |
          args=(--strategy "${{ inputs.strategy || 'price-action' }}" --limit "${{ inputs.limit || '6000' }}" --risk "${{ inputs.risk || '1' }}")
          if [ -n "${{ inputs.minRR }}" ]; then args+=(--min-rr "${{ inputs.minRR }}"); fi
          if [ -n "${{ inputs.source }}" ]; then args+=(--source "${{ inputs.source }}"); fi
          if [ "${{ inputs.compare }}" = "true" ]; then
            args+=(--compare true)
          else
            args+=(--json report.json)
          fi
          node tools/backtest.mjs "${args[@]}" | tee report.txt
          {
            echo '### Backtest'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          # --compare prints a table and writes no JSON, so the report file is
          # legitimately absent in that mode.
          if-no-files-found: ignore
          name: btcbot-backtest-${{ inputs.strategy || 'price-action' }}
          path: |
            btc-bot/report.json
            btc-bot/report.txt
          retention-days: 30
