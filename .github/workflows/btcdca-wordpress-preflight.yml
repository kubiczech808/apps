name: BTC-DCA WordPress Retirement Preflight

on:
  push:
    branches:
      - codex/btcdca-wordpress-retirement
    paths:
      - 'scripts/btcdca_wordpress_preflight.py'
      - '.github/workflows/btcdca-wordpress-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Build read-only migration inventory
        env:
          BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
          BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
          BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
        run: python3 scripts/btcdca_wordpress_preflight.py

      - name: Commit sanitized preflight report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspection/btcdca-wordpress-preflight.md
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Update BTC-DCA WordPress retirement preflight"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
