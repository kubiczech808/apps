name: Audit BTC-DCA Retention Dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btcdca-retention-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
      BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate audit prerequisites
        run: |
          set -euo pipefail
          for name in BTCDCA_FTP_LOGIN BTCDCA_FTP_PASSWORD; do
            test -n "${!name}" || { echo "$name is required."; exit 1; }
          done

      - name: Download application source without modifying hosting
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path, PurePosixPath

          ftp = ftplib.FTP('ftp.btc-dca.com', timeout=30)
          ftp.login(os.environ['BTCDCA_FTP_LOGIN'], os.environ['BTCDCA_FTP_PASSWORD'])
          allowed = {'.php', '.js', '.sql'}
          skipped = {'assets', 'vendor', 'node_modules', '.git'}

          def download(remote, local):
              local.parent.mkdir(parents=True, exist_ok=True)
              with local.open('wb') as output:
                  ftp.retrbinary(f'RETR {remote}', output.write)

          def mirror_source(remote, local):
              for name, facts in ftp.mlsd(remote):
                  if name in {'.', '..'}:
                      continue
                  source = str(PurePosixPath(remote) / name)
                  destination = local / name
                  if facts.get('type') == 'dir':
                      if name not in skipped:
                          mirror_source(source, destination)
                  elif Path(name).suffix.lower() in allowed:
                      download(source, destination)

          try:
              mirror_source('www/app', Path('runtime-source/app'))
              download('www/dca-calculator.php', Path('runtime-source/dca-calculator.php'))
              download('www/php/getTicker.php', Path('runtime-source/getTicker.php'))
          finally:
              ftp.quit()
          PY

      - name: Analyze retention and calculator dependencies
        run: python3 scripts/audit_retention_dependencies.py

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: btcdca-retention-dependency-audit-${{ github.run_id }}
          path: btcdca-retention-dependency-audit.md
          retention-days: 90
          if-no-files-found: error
