name: Trading Dip Shortlist Diagnosis

# READ-ONLY, manual only. Public GETs against the published state. No secrets, no writes.
#
# Reported: the dip portfolio shows "0 ready" beside its own caption counting "169 dip(s)
# recorded", with an active opportunity visible on the exchange. This counts every stage
# between a recorded dip and a ready candidate and names the one that empties it.
on:
  workflow_dispatch:
    inputs:
      portfolio:
        description: "Paper portfolio name or id"
        required: false
        default: "dip"
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Count every stage from recorded dip to ready candidate
        working-directory: trading
        env:
          TRADING_HOST: https://osobnizkusenosti.cz/trading
          PROBE_PORTFOLIO: ${{ inputs.portfolio || 'dip' }}
        run: node tools/dip-shortlist-probe.mjs
