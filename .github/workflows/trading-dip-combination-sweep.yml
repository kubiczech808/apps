name: Trading Dip Combination Sweep

# Read-only diagnostic, manual only. Downloads the published per-tag backtest cache over
# HTTPS and regroups it. Places no orders, writes nothing, publishes nothing, uses no
# secrets, and touches neither Polymarket nor the application's database.
#
# Asked for: a dip combination that both fires often enough to be a portfolio and ends in
# profit. The published report sweeps the entry level against a fixed 70-99% opening band
# and never reports how often a combination would have fired, so it cannot answer either
# half of that on its own.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated Polymarket tags whose backtest cache to read"
        required: false
        default: "sports,esports,counter-strike-2,soccer,tennis,atp"
        type: string
      min_trades:
        description: "Fewest opportunities a cell may have and still be printed"
        required: false
        default: "100"
        type: string
      min_buy_floor:
        description: "Lowest buy-band floor to show, e.g. 0.45 for 45-50 and up"
        required: false
        default: "0.45"
        type: string
      sample_tag:
        description: "Optional: print the raw markets behind one cell, for one of the tags above"
        required: false
        default: ""
        type: string
      sample_open_floor:
        description: "Open floor for the sample, e.g. 0.9 for the 90+ row"
        required: false
        default: ""
        type: string
      sample_buy_min:
        description: "Buy-band floor for the sample, e.g. 0.45"
        required: false
        default: ""
        type: string
      sample_buy_max:
        description: "Buy-band ceiling for the sample, e.g. 0.5"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sweep the opening and buy bands together
        working-directory: trading
        env:
          DIP_SWEEP_TAGS: ${{ inputs.tags }}
          DIP_SWEEP_MIN_TRADES: ${{ inputs.min_trades }}
          DIP_SWEEP_MIN_BUY_FLOOR: ${{ inputs.min_buy_floor }}
          DIP_SWEEP_SAMPLE_TAG: ${{ inputs.sample_tag }}
          DIP_SWEEP_SAMPLE_OPEN_FLOOR: ${{ inputs.sample_open_floor }}
          DIP_SWEEP_SAMPLE_BUY_MIN: ${{ inputs.sample_buy_min }}
          DIP_SWEEP_SAMPLE_BUY_MAX: ${{ inputs.sample_buy_max }}
        run: node tools/dip-combination-sweep.mjs
