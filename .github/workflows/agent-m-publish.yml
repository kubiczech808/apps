name: Agent M — Publish Article

on:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - .github/workflows/agent-m-publish.yml
  schedule:
    # Daily at 10:58 UTC (12:58 CET)
    - cron: '58 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish mode'
        required: true
        default: 'draft'
        type: choice
        options:
          - post
          - draft
          - preview
      slug:
        description: 'Topic slug (optional — leave empty for next in plan)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/multi-platform-auto-poster-p3uBn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: medium-poster
        run: pip install .

      - name: Create .env
        working-directory: medium-poster
        run: |
          printf '%s\n' \
            "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY_M }}" \
            "TELEGRAM_BOT_TOKEN=${{ secrets.M_TELEGRAM_TOKEN }}" \
            "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.M_TELEGRAM_CHAT_ID }}" \
            "GITHUB_PAT=${{ secrets.PAT_GITHUB_MEDIUM }}" \
            "DEVTO_API_KEY=${{ secrets.DEVTO_API_KEY }}" \
            "HASHNODE_TOKEN=" \
            "HASHNODE_PUBLICATION_ID=" \
            "MEDIUM_PLAYWRIGHT=false" \
            "MEDIUM_TOKEN=" \
            "IMGUR_CLIENT_ID=" \
            "GITHUB_PAGES_REPO=kubiczech808/apps" \
            "GITHUB_PAGES_BRANCH=gh-pages" \
            "SITE_URL=https://btc-dca.com" \
            "SITE_NAME=btc-dca.com" \
            "PUBLISH_HOUR=9" \
            "PUBLISH_MINUTE=0" \
            "LOG_LEVEL=INFO" > .env
          echo ".env created ($(wc -l < .env) lines)"

      # Default mode for push trigger: draft
      - name: Run pipeline
        working-directory: medium-poster
        run: |
          MODE="${{ github.event.inputs.mode || 'draft' }}"
          SLUG="${{ github.event.inputs.slug }}"
          echo "Mode: $MODE, Slug: $SLUG"
          if [ -n "$SLUG" ]; then
            python -m agent_m.cli "$MODE" --slug "$SLUG"
          else
            python -m agent_m.cli "$MODE"
          fi
