name: Trading Gamma Tag Count Probe

# Read-only measurement, dispatch only. Asks whether Polymarket can report a per-category
# event count fast enough for a select box before any UI is built on the idea.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probe Gamma for per-tag counts
        working-directory: trading
        run: node tools/gamma-tag-count-probe.mjs
