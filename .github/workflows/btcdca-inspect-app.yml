name: Inspect BTC-DCA App Files

on:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - '.github/workflows/btcdca-inspect-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect order page markup over FTP
        env:
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import re
          from pathlib import Path

          hosts = ["ftp.btc-dca.com", "neuron.blueboard.cz"]
          login = os.environ["BTCDCA_FTP_LOGIN"]
          password = os.environ["BTCDCA_FTP_PASSWORD"]
          text_ext = (".php", ".js", ".css", ".html", ".htm", ".inc")
          terms = re.compile(
              r"(BTC\s+Sell|Sell\s+Orders|Create\s+Sell|Withdrawal|withdrawal|mainTableBody|mobile-card|bg-white|order|Activate|Delete)",
              re.I,
          )
          secretish = re.compile(
              r"(?i)(password|passwd|secret|token|api[_-]?key|client[_-]?secret|db_password)\s*([=:]|\=\>)\s*['\"]?[^,'\"\s)]+"
          )

          ftp = None
          last_error = None
          for host in hosts:
              try:
                  ftp = ftplib.FTP(host, timeout=30)
                  ftp.login(login, password)
                  print(f"Connected to {host}")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Connect failed for {host}: {exc}")
          if ftp is None:
              raise SystemExit(f"Could not connect to FTP: {last_error}")

          def list_files(path, depth=0):
              if depth > 4:
                  return
              try:
                  names = ftp.nlst(path)
              except Exception:
                  return
              for name in names:
                  base = name.rsplit("/", 1)[-1]
                  if base in {".", ".."}:
                      continue
                  if "." not in base:
                      yield from list_files(name, depth + 1)
                      continue
                  if name.lower().endswith(text_ext):
                      yield name

          report = []
          report.append("# BTC-DCA order markup inspection")
          report.append("")
          report.append("Sanitized snippets from production FTP. Generated by GitHub Actions.")
          report.append("")

          total_hits = 0
          for remote in sorted(set(list_files("www/app")) | {"www/assets/css/custom.css", "www/assets/css/style.css"}):
              try:
                  chunks = []
                  ftp.retrbinary(f"RETR {remote}", chunks.append)
                  data = b"".join(chunks)
              except Exception:
                  continue
              if len(data) > 800_000:
                  continue
              text = data.decode("utf-8", "replace")
              lines = text.splitlines()
              hit_lines = [index for index, line in enumerate(lines, 1) if terms.search(line)]
              if not hit_lines:
                  continue
              total_hits += len(hit_lines)
              report.append(f"## {remote}")
              report.append("")
              seen = set()
              for hit in hit_lines[:120]:
                  start = max(1, hit - 4)
                  end = min(len(lines), hit + 10)
                  key = (start, end)
                  if key in seen:
                      continue
                  seen.add(key)
                  report.append(f"### lines {start}-{end}")
                  report.append("```")
                  for line_no in range(start, end + 1):
                      raw = lines[line_no - 1].strip()
                      safe = secretish.sub(r"\1\2***", raw)
                      report.append(f"{line_no}: {safe[:500]}")
                  report.append("```")
                  report.append("")

          ftp.quit()
          report.append(f"Total hit lines: {total_hits}")
          Path(".github/inspection").mkdir(parents=True, exist_ok=True)
          Path(".github/inspection/btcdca-orders-report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          PY

      - name: Commit inspection report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspection/btcdca-orders-report.md
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Update BTC-DCA order markup inspection"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
