name: Archive Untraded Trading Observations

# MySQL is the fast operational working set, not the permanent catalogue. This job keeps the
# newest three days for current scans and retains every older observation only when its token
# is present in trading_trades. All other rows move to verified, restorable gzip archives.

on:
  schedule:
    # Runs between the resolved archive (:00/:30) and other maintenance work. One writer at a
    # time keeps shared hosting CPU and disk use predictable.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      batches:
        description: "How many verified archive batches to run"
        required: false
        default: "8"
      limit:
        description: "Rows per batch"
        required: false
        default: "2000"
      keep_days:
        description: "Keep this many recent days in the operational working set (minimum 3)"
        required: false
        default: "3"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: trading-archive-untraded-observations
      cancel-in-progress: false
    steps:
      - name: Archive only observations without a real trade token
        env:
          TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
          BATCHES: ${{ github.event.inputs.batches || '8' }}
          LIMIT: ${{ github.event.inputs.limit || '2000' }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days || '3' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ["TRADING_TRIGGER_KEY"]
          url = "https://www.osobnizkusenosti.cz/trading/api.php?action=storage-admin"
          batches = max(1, min(40, int(os.environ.get("BATCHES") or 8)))
          limit = max(50, min(20000, int(os.environ.get("LIMIT") or 2000)))
          keep_days = max(3, min(90, int(os.environ.get("KEEP_DAYS") or 3)))

          def call(payload, timeout=900):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={"Content-Type": "application/json", "X-Trading-Trigger-Key": key},
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      body = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"HTTP {error.code} from {payload.get('operation')}: "
                      f"{error.read().decode('utf-8', 'replace')[:600]}"
                  ) from error
              if not body.get("ok"):
                  raise SystemExit(str(body.get("error") or f"{payload.get('operation')} failed"))
              return body

          def footprint():
              status = call({"operation": "status"}, timeout=180)
              storage = status.get("storage") or {}
              tables = storage.get("tradingTables") or {}
              observation = tables.get("trading_observations") or {}
              return {
                  "databaseMB": round((storage.get("databaseSizeBytes") or 0) / 1048576, 1),
                  "observationsMB": round(
                      ((observation.get("dataBytes") or 0) + (observation.get("indexBytes") or 0)) / 1048576, 1
                  ),
              }

          before_plan = call({"operation": "traded-observation-retention-plan", "keepDays": keep_days})
          print("Plan:", json.dumps(before_plan.get("plan") or {}))
          before = footprint()
          print("Before:", json.dumps(before))
          plan = before_plan.get("plan") or {}
          if not int(plan.get("tradeTokens") or 0):
              raise SystemExit("STOP: trade mirror has no token identities; refusing archival.")

          archived = verified = deleted = terminal_reconciled = 0
          done = False
          for index in range(batches):
              response = call({
                  "operation": "archive-untraded-observations",
                  "limit": limit,
                  "keepDays": keep_days,
              })
              batch = response.get("batch") or {}
              batch_archived = int(batch.get("archived") or 0)
              batch_verified = int(batch.get("verified") or 0)
              batch_deleted = int(batch.get("deleted") or 0)
              archived += batch_archived
              verified += batch_verified
              deleted += batch_deleted
              terminal_reconciled += int(batch.get("terminalReconciled") or 0)
              print(
                  f"batch {index + 1}: archived {batch_archived}, verified {batch_verified}, "
                  f"deleted {batch_deleted}, remaining {batch.get('remaining')}, "
                  f"protected {batch.get('protectedRows')}, terminal repaired "
                  f"{batch.get('terminalReconciled')}, "
                  f"{(batch.get('bytes') or 0) / 1048576:.1f} MB -> {batch.get('file')}"
              )
              if batch_deleted != batch_verified or batch_archived != batch_verified:
                  raise SystemExit("STOP: a non-traded archive batch was not verified one-for-one before deletion.")
              if batch.get("done"):
                  done = True
                  break

          after = footprint()
          after_plan = call({"operation": "traded-observation-retention-plan", "keepDays": keep_days})
          print(
              f"archived {archived}, verified {verified}, deleted {deleted}, "
              f"terminal repaired {terminal_reconciled}, done={done}"
          )
          print("After:", json.dumps(after))
          print("After plan:", json.dumps(after_plan.get("plan") or {}))
          PY
