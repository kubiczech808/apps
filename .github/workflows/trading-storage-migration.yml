name: Trading Storage Migration

# Moves the trading data structure from the JSON files into MySQL, and switches reads over
# once that is verified. Manual only, one operation per dispatch, and the destructive-looking
# one is behind its own confirmation.
#
# Why this exists at all: the database is configured, reachable and holds the schema, but its
# JSON migration had never been run and the runner mirror was gated behind a flag nothing
# ever set, so nothing had written to it for ten days. Turning the mirror on restarted the
# writes; this does the one-off import and the switch.
#
#   status     read-only. What the database holds, whether the import ran, when it was last
#              written to, and whether reads currently come from it.
#   migrate    the one-off JSON import, phase by phase, paging the observation phases until
#              they report done. Safe to re-run: every write is an upsert keyed by content.
#   activate   switches READS to the database. Refused by the API unless the import has
#              finished, and refused here unless the confirmation matches -- it is the step
#              that changes where the dashboard's data comes from.
#   deactivate switches reads back to the JSON files. The escape hatch, deliberately as easy
#              to run as the switch itself.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "status (read-only), migrate, activate, deactivate"
        required: true
        default: status
        type: choice
        options: [status, migrate, slim-events, archive-events, archive-list, rebuild-event-table, activate, deactivate]
      confirm:
        description: "Type ACTIVATE to allow the activate operation. Ignored otherwise."
        required: false
        default: ""
        type: string
      phase:
        description: "Resume from this phase (blank = start at the beginning)"
        required: false
        default: ""
        type: choice
        options: ["", documents, scraped, resolved, events, finalize]
      start_offset:
        description: "Resume the first phase from this offset"
        required: false
        default: "0"
        type: string
      page_limit:
        description: "Rows per request. Lower is gentler on the live host."
        required: false
        default: "100"
        type: string
      pause_seconds:
        description: "Seconds between requests. This is what leaves room for live execution."
        required: false
        default: "2"
        type: string
      budget_minutes:
        description: "Stop after this long and report where to resume."
        required: false
        default: "35"
        type: string
      growth_cap_mb:
        description: "Stop if the trading tables grow by more than this. The hosting quota is the real limit."
        required: false
        default: "100"
        type: string
      slim_cursor:
        description: "Resume slim-events from this cursor (blank = from the start)"
        required: false
        default: ""
        type: string
      archive_days:
        description: "Keep this many days of run log in the database; archive anything older."
        required: false
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: trading-storage-migration
  cancel-in-progress: false

jobs:
  storage:
    runs-on: ubuntu-latest
    # The tool stops itself at budget_minutes; this only catches a hang.
    timeout-minutes: 50
    env:
      STORAGE_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=storage-admin
      STATUS_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=storage-status
      TRADE_ROWS_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=trade-rows-summary
      TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM: ${{ inputs.confirm }}
      MIGRATE_PHASE: ${{ inputs.phase }}
      MIGRATE_START_OFFSET: ${{ inputs.start_offset || '0' }}
      MIGRATE_PAGE_LIMIT: ${{ inputs.page_limit || '100' }}
      MIGRATE_PAUSE_SECONDS: ${{ inputs.pause_seconds || '2' }}
      MIGRATE_BUDGET_MINUTES: ${{ inputs.budget_minutes || '35' }}
      MIGRATE_GROWTH_CAP_MB: ${{ inputs.growth_cap_mb || '100' }}
      SLIM_CURSOR: ${{ inputs.slim_cursor }}
      ARCHIVE_DAYS: ${{ inputs.archive_days || '7' }}
    steps:
      - uses: actions/checkout@v4

      - name: Report the current state
        run: |
          echo "== storage-status before ${OPERATION} (public, read-only)"
          curl -sS "$STATUS_URL" | python3 trading/tools/storage-status-brief.py || true
          echo "== trade rows"
          curl -sS "$TRADE_ROWS_URL" | python3 trading/tools/storage-status-brief.py --trades || true

      - name: Run the JSON migration
        if: inputs.operation == 'migrate'
        run: python3 trading/tools/storage-migrate.py

      - name: Rewrite the fat run-log events
        if: inputs.operation == 'slim-events'
        run: python3 trading/tools/storage-migrate.py --operation slim-events

      - name: Archive run-log events older than the retention window
        if: inputs.operation == 'archive-events'
        run: python3 trading/tools/storage-migrate.py --operation archive-events

      - name: List what is in the archive
        if: inputs.operation == 'archive-list'
        run: |
          curl -sS -X POST "$STORAGE_URL" \
            -H "Content-Type: application/json" \
            -H "X-Trading-Trigger-Key: ${TRADING_TRIGGER_KEY}" \
            -d '{"operation":"archive-list"}' \
            | python3 -m json.tool

      - name: Reclaim the freed pages on disk
        if: inputs.operation == 'rebuild-event-table'
        run: |
          # MySQL keeps the pages a rewrite frees inside the table file. OPTIMIZE TABLE is
          # what actually hands them back, and on InnoDB it rebuilds the table -- so it is
          # its own operation rather than something bolted onto the end of the rewrite.
          curl -sS -X POST "$STORAGE_URL" \
            -H "Content-Type: application/json" \
            -H "X-Trading-Trigger-Key: ${TRADING_TRIGGER_KEY}" \
            -d '{"operation":"rebuild-table","table":"trading_event_log"}' \
            | python3 -m json.tool

      - name: Activate database reads
        if: inputs.operation == 'activate'
        run: |
          if [ "$CONFIRM" != "ACTIVATE" ]; then
            echo "Refused: activation switches where every read comes from."
            echo "Re-dispatch with confirm=ACTIVATE once the migration above reports done."
            exit 1
          fi
          python3 trading/tools/storage-migrate.py --operation activate

      - name: Switch reads back to the JSON files
        if: inputs.operation == 'deactivate'
        run: python3 trading/tools/storage-migrate.py --operation deactivate

      - name: Report the state afterwards
        if: always() && inputs.operation != 'status'
        run: |
          echo "== storage-status after ${OPERATION}"
          curl -sS "$STATUS_URL" | python3 trading/tools/storage-status-brief.py || true
          echo "== trade rows"
          curl -sS "$TRADE_ROWS_URL" | python3 trading/tools/storage-status-brief.py --trades || true
