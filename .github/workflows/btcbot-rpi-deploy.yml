name: Deploy BTC bot runner to Raspberry Pi

on:
  workflow_dispatch:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
      - main
    paths:
      - 'btc-bot/src/**'
      - 'btc-bot/tools/**'
      - 'btc-bot/package.json'
      - 'btc-bot/systemd/**'
      - '.github/workflows/btcbot-rpi-deploy.yml'

permissions:
  contents: read

concurrency:
  group: btcbot-rpi-deploy
  cancel-in-progress: false

jobs:
  deploy-rpi:
    runs-on: [self-hosted, Linux, ARM64, trader]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: btc-bot

    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"

      - name: Audit existing BTC bot installation
        shell: bash
        run: |
          set -euxo pipefail
          id
          getent passwd openclaw2
          sudo -n true
          sudo test -f /home/openclaw2/.config/btc-bot.env
          sudo ls -ld /home/openclaw2/.local/lib/btc-bot /home/openclaw2/.config/btc-bot.env

      - name: Copy versioned runtime
        shell: bash
        run: |
          set -euxo pipefail
          target=/home/openclaw2/.local/lib/btc-bot
          sudo install -d -o openclaw2 -g openclaw2 -m 0755 "$target/src" "$target/tools"
          sudo cp -a src/. "$target/src/"
          sudo cp -a tools/. "$target/tools/"
          sudo install -o openclaw2 -g openclaw2 -m 0644 package.json "$target/package.json"
          sudo chown -R openclaw2:openclaw2 "$target/src" "$target/tools"

      - name: Install systemd units
        shell: bash
        run: |
          set -euxo pipefail
          sudo install -d -o openclaw2 -g openclaw2 -m 0755 /home/openclaw2/.config/systemd/user
          sudo install -o openclaw2 -g openclaw2 -m 0644 \
            systemd/btc-bot.service /home/openclaw2/.config/systemd/user/btc-bot.service
          sudo install -o openclaw2 -g openclaw2 -m 0644 \
            systemd/btc-bot.timer /home/openclaw2/.config/systemd/user/btc-bot.timer

      - name: Raise candle history without replacing credentials
        shell: bash
        run: |
          set -euxo pipefail
          config=/home/openclaw2/.config/btc-bot.env
          # Keep every existing credential and operator value. Only this data
          # requirement changed: 1D price action now reads 400 calendar days.
          sudo env CONFIG_PATH="$config" python3 - <<'PY'
          import os
          import pwd
          from pathlib import Path

          path = Path(os.environ["CONFIG_PATH"])
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          found = False
          found_minimum = False
          for line in lines:
              if line.startswith("BOT_CANDLE_LIMIT="):
                  updated.append("BOT_CANDLE_LIMIT=10000")
                  found = True
              elif line.startswith("BOT_MIN_CANDLE_HISTORY="):
                  updated.append("BOT_MIN_CANDLE_HISTORY=9648")
                  found_minimum = True
              else:
                  updated.append(line)
          if not found:
              updated.append("BOT_CANDLE_LIMIT=10000")
          if not found_minimum:
              updated.append("BOT_MIN_CANDLE_HISTORY=9648")
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          account = pwd.getpwnam("openclaw2")
          os.chown(path, account.pw_uid, account.pw_gid)
          os.chmod(path, 0o600)
          PY

      - name: Point the primary runner at the canonical dashboard host
        shell: bash
        run: |
          set -euxo pipefail
          config=/home/openclaw2/.config/btc-bot.env
          # The paper dashboard intentionally exposes this read/write key. Keep
          # the runner on the same public paper document that the browser reads.
          sudo env CONFIG_PATH="$config" python3 - <<'PY'
          import os
          import pwd
          from pathlib import Path

          path = Path(os.environ["CONFIG_PATH"])
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          found_url = False
          found_runner = False
          for line in lines:
              if line.startswith("BOT_API_URL="):
                  updated.append("BOT_API_URL=https://btc-dca.com/bot/api.php")
                  found_url = True
              elif line.startswith("BOT_API_KEY="):
                  updated.append("BOT_API_KEY=ahoj1234567890")
              elif line.startswith("BOT_RUNNER="):
                  updated.append("BOT_RUNNER=rpi-primary-v2")
                  found_runner = True
              else:
                  updated.append(line)
          if not found_url:
              updated.append("BOT_API_URL=https://btc-dca.com/bot/api.php")
          if not any(line.startswith("BOT_API_KEY=") for line in updated):
              updated.append("BOT_API_KEY=ahoj1234567890")
          if not found_runner:
              updated.append("BOT_RUNNER=rpi-primary-v2")
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          account = pwd.getpwnam("openclaw2")
          os.chown(path, account.pw_uid, account.pw_gid)
          os.chmod(path, 0o600)
          PY

      - name: Bridge Twelve Data key to the primary runner
        # Keep an existing local key when the repository secret has not been
        # added yet. This prevents an unrelated deploy from disabling FX
        # reference trends after an operator configured them once.
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          config=/home/openclaw2/.config/btc-bot.env
          sudo env CONFIG_PATH="$config" TWELVE_DATA_API_KEY="$TWELVE_DATA_API_KEY" python3 - <<'PY'
          import os
          import pwd
          from pathlib import Path

          key = os.environ.get("TWELVE_DATA_API_KEY", "").strip()
          if not key:
              print("TWELVE_DATA_API_KEY is not set; keeping current runner configuration.")
              raise SystemExit(0)

          path = Path(os.environ["CONFIG_PATH"])
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = [line for line in lines if not line.startswith("TWELVE_DATA_API_KEY=")]
          updated.append(f"TWELVE_DATA_API_KEY={key}")
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          account = pwd.getpwnam("openclaw2")
          os.chown(path, account.pw_uid, account.pw_gid)
          os.chmod(path, 0o600)
          print("Twelve Data key configured for the primary runner.")
          PY

      - name: Restart timer and run one verified pass
        shell: bash
        run: |
          set -euo pipefail
          # The self-hosted Actions session is non-interactive. Linger keeps
          # openclaw2's user systemd manager and D-Bus available after reboot.
          sudo loginctl enable-linger openclaw2
          uid="$(id -u openclaw2)"
          user_systemctl=(sudo -u openclaw2 -H env \
            XDG_RUNTIME_DIR="/run/user/$uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            systemctl --user)

          "${user_systemctl[@]}" daemon-reload
          # reset-failed may return 1 when there was no failed state to clear;
          # the actual service start and the hosted heartbeat checks below are
          # the authoritative health checks.
          "${user_systemctl[@]}" reset-failed btc-bot.service || true
          "${user_systemctl[@]}" enable --now btc-bot.timer
          if ! "${user_systemctl[@]}" restart btc-bot.service; then
            echo "systemd oneshot failed; running one foreground verification pass so the new build can publish its state."
            sudo -u openclaw2 -H bash -lc '
              set -a
              . "$HOME/.config/btc-bot.env"
              set +a
              cd "$HOME/.local/lib/btc-bot"
              node tools/run-bot.mjs
            '
          fi
          "${user_systemctl[@]}" --no-pager --full status btc-bot.timer
          "${user_systemctl[@]}" list-timers --all btc-bot.timer

          sudo -u openclaw2 -H node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import { PRICE_ACTION_MATRIX_SCHEMA } from '/home/openclaw2/.local/lib/btc-bot/src/strategy-price-action-structure.mjs'
          const path = '/home/openclaw2/.local/state/btc-bot/bot-state.json'
          const state = JSON.parse(fs.readFileSync(path, 'utf8'))
          const btcDaily = state.priceActionMatrix?.assets
            ?.find((asset) => asset.symbol === 'BTCUSD')
            ?.trends?.['1d']
          const externalPivotSummary = (symbol, timeframeId) => {
            const reference = state.priceActionMatrix?.assets
              ?.find((asset) => asset.symbol === symbol)
              ?.trends?.[timeframeId]
              ?.externalPivots
            return reference
              ? {
                  count: reference.pivots?.length ?? 0,
                  source: reference.source,
                  method: reference.method,
                  timeframe: reference.timeframeId,
                }
              : null
          }
          const summary = {
            updatedAt: state.updatedAt,
            status: state.status,
            savedBy: state.savedBy,
            strategyId: state.settings?.strategyId,
            portfolioName: state.settings?.portfolioName,
            riskPct: state.settings?.risk?.riskPct,
            priceActionRefresh: state.settings?.priceActionStructure?.refreshMinutes,
            lastAction: state.runs?.[0]?.action,
            lastError: state.runs?.[0]?.error,
            priceActionSchema: state.priceActionMatrix?.schemaVersion,
            btcDailyCandles: btcDaily?.candles,
            btcDailyHistoryDays: btcDaily?.structure?.historyDays,
            btcDailyPivotLookback: btcDaily?.structure?.lookback,
            eurUsdFourHourExternalPivots: externalPivotSummary('EURUSD', '4h'),
            btcUsdFourHourExternalPivots: externalPivotSummary('BTCUSD', '4h'),
            externalTrendFailures: state.priceActionMatrix?.externalTrends?.failures ?? [],
          }
          console.log(summary)
          if (summary.strategyId !== 'price-action-structure-v1') throw new Error('PA-1 was not activated')
          if (summary.riskPct !== 1 || summary.priceActionRefresh !== 15) throw new Error('PA-1 settings are not active')
          if (summary.status === 'error' || summary.lastError) throw new Error(`first pass failed: ${summary.lastError}`)
          if (summary.priceActionSchema !== PRICE_ACTION_MATRIX_SCHEMA) throw new Error('price-action matrix was not rebuilt')
          if (summary.btcDailyHistoryDays !== 400 || summary.btcDailyPivotLookback !== 30) {
            throw new Error('BTCUSD 1D does not use the scaled structure profile')
          }
          if (!(summary.btcDailyCandles >= 160)) throw new Error('BTCUSD 1D history is too short')
          NODE

          # A fresh local cache is not enough: the dashboard reads the hosted
          # document. Verify this pass published there, then verify that the
          # timer produces a second heartbeat on its own one minute later.
          sudo -u openclaw2 -H node - <<'NODE'
          const fs = require('node:fs')

          const env = Object.fromEntries(
            fs.readFileSync('/home/openclaw2/.config/btc-bot.env', 'utf8')
              .split(/\r?\n/)
              .filter((line) => line && !line.startsWith('#'))
              .map((line) => {
                const separator = line.indexOf('=')
                return [line.slice(0, separator), line.slice(separator + 1)]
              })
          )
          const apiUrl = env.BOT_API_URL
          const apiKey = env.BOT_API_KEY
          if (!apiUrl || !apiKey) throw new Error('Runner API credentials are missing')

          const hostedHeartbeat = async ({ after = 0, requireFresh = true } = {}) => {
            const response = await fetch(`${apiUrl}?action=state`, {
              headers: { Accept: 'application/json', 'X-Bot-Key': apiKey },
            })
            if (!response.ok) throw new Error(`Hosted state returned HTTP ${response.status}`)
            const payload = await response.json()
            const updatedAt = Date.parse(payload.state?.updatedAt)
            const ageMs = Date.now() - updatedAt
            const savedBy = payload.state?.savedBy
            console.log({ hostedUpdatedAt: payload.state?.updatedAt, savedBy, ageSeconds: Math.round(ageMs / 1000) })
            if (!Number.isFinite(updatedAt) || (requireFresh && ageMs > 120_000)) {
              throw new Error('Hosted dashboard state was not refreshed by the Pi')
            }
            if (savedBy !== 'rpi-primary-v2') throw new Error(`Expected primary Pi heartbeat, got ${savedBy ?? 'none'}`)
            if (updatedAt <= after) throw new Error('Timer did not produce a newer hosted heartbeat')
            return updatedAt
          }

          ;(async () => {
            const first = await hostedHeartbeat()
            // A matrix rebuild can take longer than the nominal one-minute
            // timer cadence. Poll for three minutes instead of sampling once
            // at a race-prone point immediately after a scheduled trigger.
            const deadline = Date.now() + 180_000
            let lastError = null
            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10_000))
              try {
                await hostedHeartbeat({ after: first, requireFresh: false })
                return
              } catch (error) {
                lastError = error
                if (!String(error.message).includes('Timer did not produce a newer hosted heartbeat')) throw error
              }
            }
            throw lastError ?? new Error('Timer did not produce a newer hosted heartbeat')
          })().catch((error) => {
            console.error(error.stack ?? error.message)
            process.exitCode = 1
          })
          NODE
