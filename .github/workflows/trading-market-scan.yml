name: Trading Market Scan

on:
  # The complete scrape/execution cycle writes the shared portfolio state twice: once for
  # the scan and once for its downstream execution pass. Five-minute ticks therefore
  # accumulated behind the shared lock and GitHub retained only a fraction of them. These
  # ten-minute slots leave time for one whole cycle to publish before the next starts.
  # Broad scans advance the persisted category cursor; sports and esports keep their
  # short-dated, liquid markets fresh between those broader passes.
  schedule:
    # One entry, and it is a watchdog rather than the clock. Measured over 24 hours:
    # this workflow asked for 144 scheduled runs and was delivered 6, in bursts hours
    # apart -- three inside fourteen minutes, then nothing for eight. Asking six times
    # an hour bought no more runs than asking once, so the extra entries were noise.
    # trading-pacer.yml is what actually paces the scan now, by dispatch.
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      market_scan_tag:
        description: "Optional Polymarket tag"
        required: false
        default: ""
        type: string
      market_scan_liquidity_min:
        description: "Minimum event liquidity in USDC"
        required: false
        default: "0"
        type: string
      market_scan_max_days:
        description: "Maximum days until event end; -1 means no end-date filter"
        required: false
        default: "-1"
        type: string
      run_source:
        # Every paced scan arrives as a dispatch, so "was this a dispatch" stopped being
        # the same question as "did a person ask for this". Without saying so, the whole
        # scraping log would read MANUAL and the flag would mean nothing. A person
        # dispatching by hand gets the default and is still recorded as manual.
        description: "MANUAL for a person, AUTO for the pacer"
        required: false
        default: "MANUAL"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-paper-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # One request batch is persisted with a keyset cursor. The next run
    # continues the same API scope instead of reloading every result at once.
    timeout-minutes: 15
    env:
      PAPER_STATE_PATH: data/paper-state.json
      PAPER_SCAN_HISTORY_ENTRY_PATH: data/market-scan-history-entry.ndjson
      PAPER_SCAN_ERROR_PATH: data/market-scan-error.txt
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=refresh
      PAPER_STATIC_STATE_URL: https://osobnizkusenosti.cz/trading/data/paper-state.json
      NODE_OPTIONS: --max-old-space-size=6144
      PAPER_PORTFOLIO_USDC: "100"
      PAPER_MAX_FRACTION: "0.05"
      PAPER_MAX_HISTORY: "5000"
      PAPER_CLOSED_TRADE_HISTORY_LIMIT: "300"
      PAPER_PORTFOLIO_RUN_LOG_LIMIT: "24"
      PAPER_EVALUATION_RUN_LOG_LIMIT: "24"
      PAPER_CALCULATION_REPORT_HISTORY_LIMIT: "6"
      PAPER_MARKET_SCAN_PAGE_SIZE: "500"
      PAPER_MARKET_SCAN_EVENT_BATCH_LIMIT: "500"
      # These were throttled to keep one monolithic state file small. The catalogue
      # is now published as separate segment files, so they are sized by what a
      # response can carry: measured at 5000 active + 3000 resolved, the heaviest
      # endpoint (scraped) peaks at 66 MB, inside a 128 MB limit.
      PAPER_MARKET_OBSERVATION_RETAIN_LIMIT: "5000"
      PAPER_MARKET_SCAN_AUDIT_ROW_LIMIT: "750"
      PAPER_MARKET_SCAN_HISTORY_LIMIT: "20"
      PAPER_MARKET_SCAN_AUDIT_HISTORY_LIMIT: "3"
      PAPER_MARKET_SCAN_DIVERSITY_LIQUIDITY_USDC: "40000"
      # The scope comes from the dispatch. It used to be selected by matching
      # github.event.schedule against a cron literal, one entry per scope, which decided
      # what got scanned by which entry GitHub happened to deliver -- and it delivers about
      # one in twenty. trading-pacer.yml rotates the three scopes on its tick counter and
      # sends the tag with the liquidity floor and horizon that belong to it, so a slot can
      # no longer scan sports over the broad window.
      #
      # These defaults are what a heartbeat run gets: the seven-day unfiltered catalogue,
      # which is the pass that advances the persisted category cursor.
      PAPER_MARKET_SCAN_TAG: ${{ inputs.market_scan_tag || '' }}
      PAPER_MARKET_SCAN_LIQUIDITY_MIN: ${{ inputs.market_scan_liquidity_min || '0' }}
      PAPER_MARKET_SCAN_MAX_DAYS: ${{ inputs.market_scan_max_days || '7' }}
      # Only a dispatch is manual. The scraping log flags them, so a scheduled pass must
      # not claim to be one.
      PAPER_MARKET_SCAN_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_source == 'AUTO' && 'AUTO' || 'MANUAL') || 'AUTO' }}
      PAPER_MAX_RESOLUTION_DAYS: "7"
      PAPER_SCAN_ONLY: "true"
      PAPER_REQUIRE_GEMINI: "false"
      PAPER_PRIMARY_AI_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify trading target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-market-scan.yml trading; then
            echo "Trading market scan must not target email-campaign."
            exit 1
          fi

      - name: Run tagged market scan
        working-directory: trading
        run: npm run paper:bot

      - name: Upload paper state
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          PAPER_STATE_FILE: trading/data/paper-state.json
          PAPER_UPLOAD_SUFFIX: scan-uploading
        # Publishes the core state and every segment its manifest names. Uploading
        # the core alone would leave the hosting advertising the previous run's
        # catalogue. See trading/tools/publish-paper-state.py.
        run: python3 trading/tools/publish-paper-state.py

      - name: Mirror paper state to Trading MySQL
        if: success()
        env:
          TRADING_STORAGE_INGEST_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=storage-ingest
          TRADING_TRIGGER_KEY: ${{ secrets.TRADING_TRIGGER_KEY }}
          TRADING_STORAGE_INGEST_TARGET: paper
          TRADING_STORAGE_STATE_FILE: trading/data/paper-state.json
          TRADING_STORAGE_INGEST_REQUIRED: "false"
        run: python3 trading/tools/ingest-trading-state.py

      - name: Append compact scraping history entry
        if: success()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          PAPER_SCAN_HISTORY_ENTRY_PATH: trading/data/market-scan-history-entry.ndjson
        run: |
          python3 - <<'PY'
          import ftplib
          import json
          import os
          import re
          from pathlib import Path

          entry = Path(os.environ["PAPER_SCAN_HISTORY_ENTRY_PATH"])
          if not entry.exists() or not entry.read_text(encoding="utf-8").strip():
              print("No new scraping history entry to append")
              raise SystemExit(0)

          record = json.loads(entry.read_text(encoding="utf-8").splitlines()[0])
          run_at = str(record.get("runAt") or "")
          month = run_at[:7] if re.fullmatch(r"\d{4}-\d{2}", run_at[:7]) else "unknown"

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(os.environ["HOSTING_FTP_SERVER"], timeout=30) as ftp:
              ftp.login(os.environ["HOSTING_FTP_USERNAME"], os.environ["HOSTING_FTP_PASSWORD"])
              enter_dir(ftp, os.environ["TRADING_FTP_DIR"].strip("/").split("/") + ["market-scan-history"])
              with entry.open("rb") as handle:
                  ftp.storbinary(f"APPE {month}.ndjson", handle)
          print(f"Appended compact scan history entry to {month}.ndjson")
          PY

      # Runs after the state and the history row are published, so the failed run is
      # already visible in the dashboard's scraping log, and before the downstream
      # dispatch, so a scan that fetched nothing does not kick off an evaluation pass.
      # This step is why the run goes red: the bot itself must exit 0 to get this far.
      - name: Fail when the scan did not complete
        if: success()
        run: |
          if [ -s trading/data/market-scan-error.txt ]; then
            echo "::error::Market scan failed: $(cat trading/data/market-scan-error.txt)"
            exit 1
          fi
          echo "Market scan completed without errors."

      # After every scan, scheduled ones included -- "execute after each scraping" is a
      # portfolio setting, and a scan someone happened to press is not the only scraping
      # there is. This was briefly restricted to dispatches out of a worry about the one
      # self-hosted runner the live executors share; the worry does not hold. Each live
      # workflow has its own concurrency group, so a dispatch arriving while one runs and
      # one is queued replaces the queued one rather than stacking behind it: the rate is
      # bounded by how long a run takes (about a minute each), not by how often we ask.
      # This scan itself runs on a GitHub runner and never touches the Pi.
      #
      # The dispatcher wakes active paper portfolios with either trigger. The paper
      # worker still enforces each cron portfolio's saved cadence, while
      # after_scrape portfolios run straight away on the new catalogue.
      - name: Dispatch post-scrape execution
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.POLY_TRADING_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node trading/tools/dispatch-after-scan.mjs
