name: Deploy Trading

on:
  workflow_dispatch:
  push:
    paths:
      - 'trading/**'
      - '.github/workflows/trading-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-deploy.yml trading; then
            echo "Trading deploy must not target email-campaign."
            exit 1
          fi

      - name: Build trading server config
        env:
          POLY_TRADING_GITHUB_TOKEN: ${{ secrets.POLY_TRADING_GITHUB_TOKEN }}
          TRADING_GITHUB_TOKEN: ${{ secrets.TRADING_GITHUB_TOKEN }}
          # A separate trigger secret is optional. The database password is the
          # private service-to-service key during the MySQL migration.
          TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
          # The database runs next to the PHP application on the hosting. Keep the
          # address and default port in the workflow; GitHub secrets hold credentials
          # only and are never printed or copied into the repository.
          TRADING_DB_HOST: localhost
          TRADING_DB_PORT: "3306"
          TRADING_DB_NAME: ${{ secrets.POLYTRADING_DB_NAME }}
          TRADING_DB_USER: ${{ secrets.POLYTRADING_DB_USER }}
          TRADING_DB_PASSWORD: ${{ secrets.POLYTRADING_DB_PASSWORD }}
          TRADING_GITHUB_REPO: kubiczech808/apps
          TRADING_GITHUB_REF: claude/energy-consumption-app-Nf7bh
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def php_string(value):
              return "'" + str(value).replace("\\", "\\\\").replace("'", "\\'") + "'"

          config = {
              "github_token": os.environ.get("POLY_TRADING_GITHUB_TOKEN") or os.environ.get("TRADING_GITHUB_TOKEN", ""),
              "trigger_key": os.environ.get("TRADING_TRIGGER_KEY", ""),
              "db_host": os.environ.get("TRADING_DB_HOST", ""),
              "db_port": os.environ.get("TRADING_DB_PORT", "3306"),
              "db_name": os.environ.get("TRADING_DB_NAME", ""),
              "db_user": os.environ.get("TRADING_DB_USER", ""),
              "db_password": os.environ.get("TRADING_DB_PASSWORD", ""),
              "repo": os.environ.get("TRADING_GITHUB_REPO", "kubiczech808/apps"),
              "ref": os.environ.get("TRADING_GITHUB_REF", "claude/energy-consumption-app-Nf7bh"),
          }
          body = "<?php\n\nreturn [\n"
          for key, value in config.items():
              body += f"    {php_string(key)} => {php_string(value)},\n"
          body += "];\n"
          Path("trading/config.php").write_text(body, encoding="utf-8")
          PY

      - name: Stamp asset cache-busting versions
        # index.html referenced assets/app.js?v=<hand-written tag>. Forgetting to bump
        # that tag ships the new file but leaves every browser on the cached old one,
        # which looks exactly like the change not working. Stamping the commit SHA here
        # makes the query string change whenever the asset does, so it can no longer be
        # forgotten. Applied to the uploaded copy only; the file in git keeps its tag.
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = (os.environ.get("ASSET_VERSION") or "")[:12] or "dev"
          page = Path("trading/index.html")
          html = page.read_text(encoding="utf-8")
          stamped, count = re.subn(
              r'(href|src)="(assets/[^"?]+)(?:\?v=[^"]*)?"',
              lambda m: f'{m.group(1)}="{m.group(2)}?v={version}"',
              html,
          )
          if count == 0:
              raise SystemExit("No asset references found in trading/index.html; refusing to deploy an unstamped page.")
          page.write_text(stamped, encoding="utf-8")
          print(f"Stamped {count} asset reference(s) with v={version}")
          for line in stamped.splitlines():
              if "assets/" in line and "?v=" in line:
                  print(f"  {line.strip()}")
          PY

      - name: Upload to hosting
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading
          TRADING_LOCAL_DIR: trading
        run: |
          python3 - <<'PY'
          import ftplib
          import importlib.util
          import os
          import pathlib
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          local_dir = Path(os.environ["TRADING_LOCAL_DIR"])

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      try:
                          ftp.mkd(part)
                      except ftplib.error_perm:
                          pass
                      ftp.cwd(part)

          # Loaded from the repository rather than restated inline, so the test and the
          # deploy run the same decision.
          _cleanup_spec = importlib.util.spec_from_file_location(
              "deploy_cleanup", pathlib.Path("trading/tools/deploy-cleanup.py"))
          _cleanup = importlib.util.module_from_spec(_cleanup_spec)
          _cleanup_spec.loader.exec_module(_cleanup)
          stale_entries = _cleanup.stale_entries

          def list_names(ftp):
              try:
                  return [name for name, _facts in ftp.mlsd() if name not in {".", ".."}]
              except ftplib.all_errors:
                  try:
                      return [name for name in ftp.nlst() if name not in {".", ".."}]
                  except ftplib.all_errors:
                      return []

          def remove_tree(ftp, name):
              current = ftp.pwd()
              try:
                  ftp.delete(name)
                  return
              except ftplib.all_errors:
                  pass
              try:
                  ftp.cwd(name)
              except ftplib.all_errors:
                  return
              for child in list_names(ftp):
                  remove_tree(ftp, child)
              ftp.cwd(current)
              try:
                  ftp.rmd(name)
              except ftplib.all_errors:
                  pass

          def is_runtime_data(name):
              """Runtime state the bots own. Deploying the site must never delete it.

              The paper state is published as a core file plus sibling segment files
              named paper-state.<segment>.json. Listing only the core here deleted
              every segment on the next deploy, which left the hosting with a manifest
              pointing at files that no longer existed. The prefix rule covers any
              segment the bot adds later, so that cannot happen again.

              An execution state file is a portfolio's entire run-log history, and the
              same naming mistake cost the 5050 portfolio all of its. Every run
              published live-5050-execution-state.json successfully, and the next
              deploy deleted it, because this list was written when only one live
              portfolio existed and nobody added the second. Every symptom followed:
              the hosted path answered 404 with no temp file beside it, the run after
              restored an empty history over that 404 and published a single row, and
              the dashboard showed one run however many had happened.

              So this matches the shape rather than the name, and a portfolio added
              later cannot be forgotten the way 5050 was.
              """
              keep = {
                  "live-state.json",
                  "portfolio-config.json",
                  # Human-readable history of saved portfolio rule changes. It is
                  # runtime data, not a build artifact, so deployment cleanup must
                  # leave it beside the portfolio configuration.
                  "portfolio-config-history.ndjson",
                  "scrape-scan-preferences.json",
                  "redeem-alert-ledger.json",
                  "market-scan-history",
                  # Observation snapshots previously moved out of MySQL. Keep them until
                  # the one-time recovery has restored every row into the database.
                  "observation-archive",
                  # Run-log archives predate the observation-retention mistake and are
                  # also runtime history rather than deploy artifacts.
                  "event-archive",
                  # Every portfolio's archived run-log history, one directory per
                  # portfolio. It was missing here, so each deploy of the site deleted
                  # the whole tree -- the same mistake this list has now made three
                  # times (the state segments, then 5050's execution state). Only the
                  # newest entries live in the state file, so what a deploy destroyed
                  # was every run older than that cap, for every portfolio at once.
                  "portfolio-run-log",
                  # The dips the RPi worker recorded, and the fourth time this list has
                  # destroyed the state it was written to protect. The worker sees a
                  # collapsed favourite within a second and records it here; the paper bot
                  # reads it on the hour. Every deploy in between emptied the file, so three
                  # dip portfolios watched 26 markets each, recorded real dips at 03:40, and
                  # had nothing to open at 04:07. Reported as "two of my dip portfolios
                  # cannot catch any trade".
                  "dip-entry-hits.json",
                  # Why a live position was sold, keyed by token. The dashboard's closed
                  # positions read it to say a stop loss fired -- which is exactly the thing
                  # that was once reported missing, and this is why it would go missing
                  # again: every deploy deleted the record.
                  "live-exit-records.json",
                  # What the executor has already claimed, so two runs cannot enter the same
                  # market twice. Deleting it does not lose history, it removes a guard.
                  "live-entry-claims.json",
                  # Why a run never started. A deploy that deletes the evidence of dispatch
                  # failures makes them unreportable after the fact.
                  "dispatch-failures",
                  # The transient sync request flag. Nothing here is a build artifact.
                  ".live-sync-request.json",
              }
              if name in keep:
                  return True
              if name.startswith("live-") and name.endswith("execution-state.json"):
                  return True
              return name == "paper-state.json" or (
                  name.startswith("paper-state.") and name.endswith(".json")
              )

          def clean_data_dir(ftp):
              current = ftp.pwd()
              try:
                  ftp.cwd("data")
              except ftplib.all_errors:
                  return
              for child in list_names(ftp):
                  if is_runtime_data(child):
                      continue
                  remove_tree(ftp, child)
              ftp.cwd(current)

          def is_deploy_file(relative):
              return relative in {"index.html", "api.php", "storage.php", "config.php", ".htaccess"} or relative.startswith("assets/")

          deploy_files = [
              path
              for path in sorted(local_dir.rglob("*"))
              if path.is_file() and is_deploy_file(path.relative_to(local_dir).as_posix())
          ]
          deploy_roots = {"data"}
          for path in deploy_files:
              relative_parts = path.relative_to(local_dir).as_posix().split("/")
              deploy_roots.add(relative_parts[0])

          with ftplib.FTP(server, timeout=120) as ftp:
              ftp.login(username, password)
              target_parts = target.split("/")
              enter_dir(ftp, target_parts)

              # Upload first, clean second. If hosting rejects STOR because of
              # quota, the currently deployed app remains intact.
              #
              # And every file goes up under a TEMPORARY name, is checked for length, and is
              # only then renamed over the live one.
              #
              # STOR straight onto the live path is what took the whole site down on
              # 2026-09-18. A transfer that stalls -- 30 second timeout, shared host, files
              # that grow every day -- leaves the live PHP truncated, and it STAYS truncated
              # until someone deploys again. The site answered
              # "syntax error, unexpected string content, expecting ]" at storage.php:283
              # on every request, for a storage.php that is valid in git and passes php -l.
              #
              # It was visible hours earlier and I read it as a race: one probe caught
              # "Unclosed '{' on line 949" mid-deploy and recovered, so I recorded it as a
              # few seconds of exposure. It was not a window. It was a file left broken.
              #
              # Rename is the fix rather than a longer timeout, because a longer timeout
              # makes truncation rarer without making it impossible. A rename is a directory
              # operation: a request sees the old complete file or the new complete one.
              # The size check is what turns a short transfer into a failed deploy instead
              # of a corrupted site -- the guarantee is not "usually fine", it is that a file
              # nobody verified never becomes the live one.
              for path in deploy_files:
                  relative = path.relative_to(local_dir).as_posix()
                  remote_parts = target_parts + relative.split("/")[:-1]
                  enter_dir(ftp, remote_parts)
                  expected = path.stat().st_size
                  staged = f".deploy-{path.name}"
                  with path.open("rb") as handle:
                      ftp.storbinary(f"STOR {staged}", handle)
                  try:
                      uploaded = ftp.size(staged)
                  except ftplib.all_errors:
                      uploaded = None
                  if uploaded is not None and uploaded != expected:
                      try:
                          ftp.delete(staged)
                      except ftplib.all_errors:
                          pass
                      raise SystemExit(
                          f"{relative}: uploaded {uploaded} bytes of {expected}. "
                          "Refusing to publish a truncated file; the live copy is untouched."
                      )
                  try:
                      ftp.rename(staged, path.name)
                  except ftplib.all_errors:
                      # Some servers refuse RNTO onto an existing path. Deleting first leaves
                      # a sub-second window where the file is absent, which serves a 404 --
                      # recoverable, and far better than serving a half-parsed PHP file.
                      try:
                          ftp.delete(path.name)
                      except ftplib.all_errors:
                          pass
                      ftp.rename(staged, path.name)

              enter_dir(ftp, target_parts)
              published = list_names(ftp)
              if "data" in published:
                  clean_data_dir(ftp)
              # The removal decision lives in trading/tools/deploy-cleanup.py so it can be
              # executed by a test. It used to sit here as an `if` at the loop's own
              # indentation -- outside the loop -- so it ran exactly once, against whichever
              # name the server listed last: every other stale directory was never cleaned,
              # the one that was deleted was chosen by directory order, and an empty listing
              # left the name unbound and killed the deploy with a NameError.
              verdict = stale_entries(published, deploy_roots)
              if verdict["refuse"]:
                  print(f"::warning title=Deploy cleanup refused::{verdict['refuse']}")
              for name in verdict["remove"]:
                  print(f"removing stale published entry: {name}")
                  remove_tree(ftp, name)
              for name in verdict.get("skipped") or []:
                  print(f"left alone, not a plain entry: {name!r}")
          PY

      - name: Check dedicated Trading MySQL storage
        env:
          TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          key = os.environ.get("TRADING_TRIGGER_KEY", "")
          if not key:
              print("::warning::TRADING_TRIGGER_KEY is not configured; database diagnostics skipped.")
              raise SystemExit(0)
          request = urllib.request.Request(
              "https://www.osobnizkusenosti.cz/trading/api.php?action=storage-diagnostics",
              data=b"{}",
              method="POST",
              headers={"Content-Type": "application/json", "X-Trading-Trigger-Key": key},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              print(f"::warning::Trading database diagnostics could not run: {exc}")
              raise SystemExit(0)
          storage = payload.get("storage") or {}
          print("Trading storage diagnostics (credentials withheld):")
          for key in ("pdoAvailable", "pdoMysqlAvailable", "configured", "connected", "schemaReady", "serverVersion", "databaseSizeBytes", "maxConnections"):
              print(f"  {key}: {storage.get(key)}")
          if not storage.get("pdoMysqlAvailable"):
              raise SystemExit("pdo_mysql is unavailable on the hosting; MySQL migration cannot run there.")
          if not storage.get("configured"):
              raise SystemExit("Trading DB credentials are incomplete. Set POLYTRADING_DB_NAME, POLYTRADING_DB_USER and POLYTRADING_DB_PASSWORD.")
          if not storage.get("connected"):
              raise SystemExit("Trading DB credentials are present but localhost:3306 could not connect. Check the database/user grants on the hosting.")
          PY

      - name: Bootstrap compact Trading MySQL storage
        # This intentionally creates or compacts only the empty schema. JSON remains
        # the active reader and neither deploys nor workers may import historical data
        # until the resulting database footprint has been checked.
        continue-on-error: true
        env:
          TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ["TRADING_TRIGGER_KEY"]
          url = "https://www.osobnizkusenosti.cz/trading/api.php?action=storage-admin"

          def call(operation):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"operation": operation}).encode("utf-8"),
                  method="POST",
                  headers={"Content-Type": "application/json", "X-Trading-Trigger-Key": key},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.loads(error.read().decode("utf-8"))
                  except Exception:
                      payload = {}
                  message = str(payload.get("error") or f"HTTP {error.code}")
                  tables = payload.get("tables") or {}
                  if isinstance(tables, dict):
                      summary = ", ".join(
                          f"{name}: rows={int((stats or {}).get('rows') or 0)}, bytes={int((stats or {}).get('dataBytes') or 0) + int((stats or {}).get('indexBytes') or 0)}"
                          for name, stats in sorted(tables.items())
                          if isinstance(stats, dict)
                      )
                      if summary:
                          message = f"{message} [{summary}]"
                  raise RuntimeError(message) from error
              if not payload.get("ok"):
                  raise SystemExit(f"Trading storage {operation} failed")
              return payload

          try:
              call("bootstrap")
              previewed = call("compact-preview")
              storage = previewed.get("storage") or {}
              database_size = int(storage.get("databaseSizeBytes") or 0)
              trading_size = int(storage.get("tradingSizeBytes") or 0)
              preview = previewed.get("preview") or {}
              estimate = "; ".join(
                  f"{name}: {int((stats or {}).get('currentBytes') or 0)} -> {int((stats or {}).get('compressedBytes') or 0)} bytes across {int((stats or {}).get('sampleRows') or 0)} sampled rows"
                  for name, stats in sorted(preview.items())
                  if isinstance(stats, dict)
              )
              has_rows = any(int((stats or {}).get("rows") or 0) > 0 for stats in (storage.get("tradingTables") or {}).values())
              if has_rows:
                  print(f"::notice title=Trading MySQL storage preview::Current footprint: {database_size} bytes total, {trading_size} bytes in Trading tables. Existing rows were preserved; no compaction or import ran. Compression preview: {estimate}")
              else:
                  compacted = call("compact-empty")
                  storage = compacted.get("storage") or {}
                  database_size = int(storage.get("databaseSizeBytes") or 0)
                  trading_size = int(storage.get("tradingSizeBytes") or 0)
                  print(f"::notice title=Trading MySQL compact schema::Database footprint after empty-table compaction: {database_size} bytes total, {trading_size} bytes in Trading tables. Historical import and worker mirroring remain disabled.")
              if not storage.get("schemaReady"):
                  raise SystemExit("Trading storage schema did not become ready")
          except Exception as error:
              print(f"::error title=Trading MySQL bootstrap::{str(error)[:300]}")
              raise
          PY

  # The one-time recovery that used to run here has been removed, and removing it was
  # required before settled observations could be archived on purpose.
  #
  # It existed for a retention job that deleted historical rows before the read path was
  # ready, and it restored them from data/observation-archive. Its "already done" flag is
  # only written when the walk actually finishes -- an EMPTY archive directory returns
  # done without recording anything. The directory on the host is empty, so the flag was
  # never set, and the moment Archive Resolved Observations wrote its first file this job
  # would have read it back into MySQL on the next deploy. The reduction would have undone
  # itself, on a schedule, with both copies reporting success.
  #
  # The restore itself is still there and still works: storage-admin's
  # restore-observation-archives, run deliberately. That is the way back, and it should not
  # also be something a deploy does on its own.

