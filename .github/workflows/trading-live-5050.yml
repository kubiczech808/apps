name: Trading Live 5050

# The "5050" live portfolio. Where the main live portfolio buys the single best
# candidate at the current market price, this one rests a bid at a fixed point on
# the 0..1 scale across every candidate that clears its probability bar. Most never
# fill -- that is the design. The ones that do were bought far below what the market
# thought they were worth.
#
# It shares the Polymarket wallet with the main live portfolio, so its own decisions
# are kept in a separate execution state file and attributed by the orders it placed.
on:
  workflow_dispatch:
    inputs:
      live_confirm:
        description: Place real orders (unchecked is a dry run)
        required: false
        default: false
        type: boolean
      entry_price:
        description: Override the saved order price for this run only (0..1); blank uses the portfolio setting
        required: false
        default: ""
        type: string
      min_probability:
        description: Override the saved probability bar for this run only; blank uses the portfolio setting
        required: false
        default: ""
        type: string
      stake_per_order_usdc:
        description: Target stake per bid; blank uses the exchange minimum
        required: false
        default: ""
        type: string
      live_run_source:
        description: Who asked for this run. MANUAL overrides the portfolio's own switches; the post-scrape dispatcher sends AUTO so it does not.
        required: false
        default: "MANUAL"
        type: string
  schedule:
    # The portfolio decides whether a scheduled run does anything: the executor
    # skips it when automation is off, and honours its own cadence when set. Away
    # from the top of the hour so it does not queue behind every other job.
    - cron: '7,37 * * * *'

# Serialized against itself only. It shares the wallet with the main live portfolio
# but not the state file, and the exchange is the authority on collateral.
concurrency:
  group: trading-live-5050-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-5050:
    runs-on: [self-hosted, Linux, ARM64]
    env:
      POLYMARKET_HOST: https://clob.polymarket.com
      POLYMARKET_CHAIN_ID: "137"
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '3' }}
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper
      PAPER_SCRAPED_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=execution
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_EXECUTION_STATE_PATH: data/live-5050-execution-state.json
      LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-5050-execution

      LIVE_STRATEGY: fixed_entry
      LIVE_FIXED_ENTRY_PRICE: ${{ github.event.inputs.entry_price || '0.50' }}
      LIVE_FIXED_ENTRY_STAKE_USDC: ${{ github.event.inputs.stake_per_order_usdc || '' }}
      LIVE_MIN_PROBABILITY: ${{ github.event.inputs.min_probability || '0.90' }}

      # Resting far below the market is the whole strategy, so a post-only bid is
      # correct and can never cross. Rotation is off: this portfolio does not
      # replace holdings, it accumulates cheap fills.
      USE_LIMIT_ORDERS: "true"
      POLYMARKET_POST_ONLY: "true"
      LIVE_AUTO_ROTATE: "false"
      # A scheduled run must be able to be switched off. A dispatch is a person unless
      # it says otherwise, and the post-scrape dispatcher says otherwise -- that run is
      # the portfolio's own schedule doing its job, not someone pressing a button, so it
      # must obey the automation switch and be logged as automatic.
      LIVE_RUN_SOURCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live_run_source || 'MANUAL') || 'AUTO' }}
      # Set from the saved trigger below. A cron tick for a portfolio that trades after
      # each scrape is not its turn, and the executor stops on this rather than trading.
      LIVE_SKIP_SCHEDULED_EXECUTION: "false"
      # A wide scan is the point: many candidates, one bid each -- but only across the
      # tags the portfolio is allowed to trade. Overwritten by the saved setting below;
      # this is the fallback when the config cannot be read.
      LIVE_FIXED_ENTRY_ALLOWED_TAGS: "sports,esports"
      LIVE_CANDIDATE_SCAN_LIMIT: "300"
      LIVE_MAX_RESOLUTION_DAYS: "30"
      LIVE_MIN_ANNUAL_RETURN: "0"
      LIVE_MIN_NET_YIELD: "0"
      # How long the pass may spend resting bids. Measured on this runner the steps
      # around the executor cost about 20s (checkout, install, two account snapshots,
      # upload), so 40s here keeps the job inside a minute. Bids go best-first, so a
      # pass that runs out defers the weakest of the batch and the next run, half an
      # hour later, opens with them.
      LIVE_FIXED_ENTRY_BUDGET_MS: "40000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live order target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-live-5050.yml trading; then
            echo "Trading live 5050 must not target email-campaign."
            exit 1
          fi

      - name: Load 5050 portfolio config
        # The saved portfolio settings are the authority; a dispatch input only
        # overrides them for a one-off run. Without this the entry price shown in
        # the dashboard and the one actually bid could differ.
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config"
          try:
              payload = json.loads(urllib.request.urlopen(url, timeout=30).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable, keeping workflow defaults: {exc}")
              raise SystemExit(0)
          cfg = (payload.get("config") or {}).get("live5050") or {}

          overrides = {
              "LIVE_FIXED_ENTRY_PRICE": cfg.get("fixedEntryPrice"),
              "LIVE_FIXED_ENTRY_STAKE_USDC": cfg.get("stakePerOrderUsdc"),
              "LIVE_MIN_PROBABILITY": cfg.get("minProbability"),
              "LIVE_MAX_RESOLUTION_DAYS": cfg.get("maxResolutionDays"),
              "LIVE_CONFIG_MIN_LIQUIDITY_USDC": cfg.get("minLiquidityUsdc"),
              # Which Polymarket tags this portfolio may bid on. A saved empty list means
              # every tag, and has to reach the executor as an empty string rather than
              # being dropped as "unset" -- otherwise the restriction could never be
              # lifted once it had been set.
              "LIVE_FIXED_ENTRY_ALLOWED_TAGS": ",".join(
                  str(tag) for tag in (cfg.get("allowedMarketTags") or []) if str(tag).strip()
              ) if isinstance(cfg.get("allowedMarketTags"), list) else None,
              # The portfolio's own cadence, so a scheduled run honours the interval
              # set in its parameters rather than firing on every poll.
              "LIVE_EXECUTION_CRON_MINUTES": cfg.get("executionCronMinutes"),
              # Whole tags this portfolio refuses, the mirror image of the allow-list above
              # and a setting every portfolio has. Empty excludes nothing, which is what an
              # unset variable means too, so the loop skipping it clears the setting -- no
              # always-write case, unlike the allow-list where empty means every tag.
              "LIVE_EXCLUDED_MARKET_TAGS": ",".join(
                  str(tag).strip() for tag in (cfg.get("excludedMarketTags") or []) if str(tag).strip()
              ),
              # What starts a run: the cron below, or the scan finishing. Recorded in the
              # run log, and read one line down to decide whether this run is due.
              "LIVE_EXECUTION_TRIGGER": cfg.get("executionTrigger"),
              # Automation off means automatic runs do nothing; a manual dispatch still
              # runs, and the executor makes that exception itself off LIVE_RUN_SOURCE.
              # So the switch is written as saved whatever the event: keying it on the
              # event name, as it used to be, would let a post-scrape dispatch trade for
              # a portfolio whose automation is off. Absent means on, matching the saved
              # default, so a portfolio that never stored the field keeps trading rather
              # than silently stopping.
              "LIVE_AUTOMATION_ENABLED": str(bool(cfg.get("automationEnabled", True))).lower(),
          }
          # An explicit dispatch input wins over the saved value for this run only.
          for key, dispatched in [
              ("LIVE_FIXED_ENTRY_PRICE", "${{ github.event.inputs.entry_price }}"),
              ("LIVE_FIXED_ENTRY_STAKE_USDC", "${{ github.event.inputs.stake_per_order_usdc }}"),
              ("LIVE_MIN_PROBABILITY", "${{ github.event.inputs.min_probability }}"),
          ]:
              if str(dispatched).strip():
                  overrides[key] = dispatched

          # A portfolio that trades after each scrape is dispatched by the scan; its cron
          # ticks are just polling and must not trade, or it would run on both.
          if cfg.get("executionTrigger") == "after_scrape" and os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              overrides["LIVE_SKIP_SCHEDULED_EXECUTION"] = "true"

          # An empty allow-list is a real setting -- every tag -- so it is written even
          # though it is empty, unlike a value the config simply did not carry.
          always_write = {"LIVE_FIXED_ENTRY_ALLOWED_TAGS"}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in overrides.items():
                  if value is None or (value == "" and key not in always_write):
                      continue
                  print(f"{key}={value}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Show effective settings
        run: |
          echo "Entry price:      ${LIVE_FIXED_ENTRY_PRICE}"
          echo "Min probability:  ${LIVE_MIN_PROBABILITY}"
          echo "Stake per order:  ${LIVE_FIXED_ENTRY_STAKE_USDC:-exchange minimum}"
          echo "Trigger:          ${LIVE_EXECUTION_TRIGGER:-cron} (this run: ${LIVE_RUN_SOURCE}, skip=${LIVE_SKIP_SCHEDULED_EXECUTION})"
          echo "Automation:       ${LIVE_AUTOMATION_ENABLED}"

      - name: Generate fresh live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Restore 5050 run history
        working-directory: trading
        env:
          LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-5050-execution
          LIVE_EXECUTION_STATE_PATH: data/live-5050-execution-state.json
          LIVE_RUN_LOG_RECOVER: "false"
        # No `|| echo` here. The tool already treats a genuine first-run 404 as an empty
        # log and exits 0; every other failure it raises means the history exists but
        # could not be read, and swallowing that let the run continue with nothing and
        # publish a single row over the whole log. A red run is the cheaper outcome.
        run: node tools/restore-live-execution-history.mjs

      - name: Rest the fixed-entry bids
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_confirm)) && 'false' || 'true' }}
          LIVE_STATE_URL: data/live-state.json
          LIVE_EXECUTION_STATE_URL: data/live-5050-execution-state.json
        run: npm run live:execute -- --confirm-live

      - name: Refresh live account snapshot
        if: always()
        working-directory: trading
        run: npm run live:account

      # What this pass learned about each candidate goes back into the catalogue: a
      # market Gamma no longer lists is closed out, a moved price is updated. Without it
      # a candidate this run rejected stays READY and is re-fetched and re-rejected by
      # every pass after it -- three candidates, one order, two still waiting.
      - name: Persist current 5050 market verification into evaluation state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_EXECUTION_STATE_FILE: trading/data/live-5050-execution-state.json
        run: python3 trading/tools/persist-live-revalidation.py

      # The upload replaces the hosted file outright, so a run that started from a
      # partial local log would publish that shorter log over the real history -- which
      # is what left this portfolio with a single row. This makes the file about to be
      # uploaded a superset of the one it replaces. The main live portfolio has had this
      # since its own log emptied; 5050 was created without it.
      - name: Merge published run-log history before upload
        if: always()
        working-directory: trading
        env:
          # Read the hosted state, not the local copy the executor just wrote.
          LIVE_EXECUTION_PUBLISHED_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-5050-execution
          LIVE_EXECUTION_STATE_PATH: data/live-5050-execution-state.json
        run: node tools/merge-live-execution-history.mjs

      # The same hardened publisher the main live portfolio uses. 5050 was created with a
      # simpler copy -- one attempt, no timeout, no retry, no restore on a failed swap --
      # and this file is its entire run-log history, so a publish that quietly did not
      # land read downstream as "this portfolio has run once".
      - name: Upload 5050 state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          # Read back over the web what was just uploaded. An FTP upload can report
          # success while the file lands where nothing serves it, which is how this
          # portfolio's run log stayed missing for days with every step passing.
          PUBLISH_VERIFY_BASE_URL: https://osobnizkusenosti.cz/trading/data
          PUBLISH_FILES: trading/data/live-5050-execution-state.json>live-5050-execution-state.json
          # A file the publisher cannot find locally is skipped, and without this the step
          # then exits clean. That is the last way left for this upload to do nothing and
          # still report success -- and the hosted path answers 404 with no temp or backup
          # file beside it, which is what "nothing was ever transferred" looks like.
          # Producing this state is what a 5050 run is for, so its absence is a failed run.
          PUBLISH_REQUIRED: live-5050-execution-state.json
        run: python3 trading/tools/publish-execution-state.py

      - name: Run digest
        if: always()
        continue-on-error: true
        env:
          EXECUTION_STATE_FILE: trading/data/live-5050-execution-state.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path(os.environ["EXECUTION_STATE_FILE"])
          if not path.exists():
              print("RUN DIGEST: no 5050 execution state was produced by this run.")
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding="utf-8"))

          def dashboard_time(value):
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except ValueError:
                  return "-"
              return parsed.astimezone(ZoneInfo("Europe/Prague")).strftime("%d. %m. %Y %H:%M")

          print("=== RUN DIGEST ===")
          print(f"generatedAt : {state.get('generatedAt')} (dashboard {dashboard_time(state.get('generatedAt'))})")
          print(f"action      : {state.get('action')}")
          print(f"reason      : {state.get('reason')}")
          fixed = state.get("fixedEntry") or {}
          if fixed:
              print("fixed entry : " + ", ".join(f"{k}={v}" for k, v in fixed.items()))
          for attempt in (state.get("attempts") or [])[:60]:
              print(f"  {attempt.get('action')}: {str(attempt.get('question'))[:52]!r} "
                    f"{attempt.get('orderSize')} @ {attempt.get('orderPrice')} "
                    f"{attempt.get('responseError') or ''}")
          for entry in ((state.get("batchLog") or {}).get("topRejected") or [])[:12]:
              print(f"  skipped: {str(entry.get('question'))[:52]!r} -> {'; '.join(entry.get('rejectReasons') or [])[:120]}")
          print("=== END RUN DIGEST ===")
          PY
