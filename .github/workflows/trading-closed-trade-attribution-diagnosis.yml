name: Trading Closed Trade Attribution Diagnosis

# Read-only diagnostic, manual only. Reads the portfolio config, the live account snapshot
# and the published execution states over HTTPS. Places no orders, writes nothing,
# publishes nothing, uses no secrets.
#
# Reported: closed positions disappear from a live portfolio's Closed list over time and the
# portfolio's statistics stop adding up.
#
# Live rows carry no portfolio of their own -- ownership is re-derived on every render from
# the execution run log, which is a rolling window. This measures whether rows are falling
# out of that window, how much realized P/L moves when they do, and whether the tokens were
# ever logged at all.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Attribute every closed row to the portfolio that placed it
        working-directory: trading
        run: node tools/closed-trade-attribution-diagnosis.mjs
