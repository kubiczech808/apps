name: Configure Trading RPi Live Exit Worker

on:
  push:
    paths:
      - '.github/workflows/trading-rpi-live-exit-worker.yml'
      - 'trading/tools/rpi-live-exit-worker.mjs'
      - 'trading/systemd/**'
      - 'trading/package.json'
      - 'trading/package-lock.json'
  workflow_dispatch:
    inputs:
      # `keep` is the default on purpose, and it is the whole point of these three.
      #
      # They used to default to shadow/false/false, so dispatching this workflow to ship a
      # code fix DISARMED the live stop loss -- which is exactly what happened: a redeploy
      # with no inputs turned an armed worker into 147 SHADOW_STOP_TRIGGERED events, stops
      # reached and nothing sold, and it was noticed only because the event tally looked
      # wrong. The push path had always preserved the armed mode and said why; the dispatch
      # path, the one a person actually uses, overwrote it with a default.
      #
      # Arming and disarming are now things you have to ask for by name.
      live_exit_mode:
        description: keep leaves the armed mode alone. shadow logs only; live permits protective sells.
        required: false
        default: keep
        type: choice
        options: [keep, shadow, live]
      protect_all:
        description: keep leaves it alone. Protect all recognized open positions, or only local allowlisted tokens.
        required: false
        default: keep
        type: choice
        options: [keep, "true", "false"]
      confirm_live:
        description: keep leaves it alone. Required alongside live mode before a SELL may be submitted.
        required: false
        default: keep
        type: choice
        options: [keep, "true", "false"]
      # Same `keep` default and the same reason: a redeploy must not arm or disarm the dip
      # rule as a side effect. `off` does not even fetch the watch list; `shadow` follows the
      # markets and records what it would buy; `live` also needs live_exit_mode=live and
      # confirm_live=true, so buying is a deliberate act in three places.
      dip_entry_mode:
        description: keep leaves it alone. off watches nothing; shadow logs the entries it would take; live permits real dip buys.
        required: false
        default: keep
        type: choice
        options: [keep, "off", shadow, live]

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, Linux, ARM64]
    env:
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '3' }}
      TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
      LIVE_EXIT_MODE: ${{ inputs.live_exit_mode }}
      LIVE_EXIT_PROTECT_ALL: ${{ inputs.protect_all }}
      LIVE_EXIT_CONFIRM_LIVE: ${{ inputs.confirm_live }}
      LIVE_DIP_ENTRY_MODE: ${{ inputs.dip_entry_mode }}
      LIVE_EXIT_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify trading-only worker target
        run: |
          if grep -R -n -E '/www/email[-]campaign|email[-]campaign' .github/workflows/trading-rpi-live-exit-worker.yml trading/systemd trading/tools/rpi-live-exit-worker.mjs; then
            echo "Legacy deployment path detected."
            exit 1
          fi

      - name: Install isolated RPi worker
        working-directory: trading
        run: |
          set -euo pipefail
          target="$HOME/.local/lib/trading-live-exit-worker"
          stage="${target}.next"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp package.json package-lock.json "$stage/"
          cp -R tools "$stage/"
          npm ci --omit=dev --prefix "$stage"
          rm -rf "$target"
          mv "$stage" "$target"

      - name: Install protected worker configuration
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.config" "$HOME/.local/state/trading"
          existing_env="$HOME/.config/trading-live-exit-worker.env"
          read_existing() {
            if [ -f "$existing_env" ]; then
              sed -n "s/^$1=//p" "$existing_env" | tail -n 1
            fi
          }
          # A code update must not silently disarm a worker that the account owner already
          # armed. That was true of the push path and NOT of the dispatch path, which
          # defaulted the three switches to shadow/false/false -- so a redeploy shipping a
          # fix disarmed the live stop loss and logged 147 reached stops it did not sell.
          #
          # Every switch now falls back to what the EnvironmentFile already says, and only
          # an explicit value other than `keep` changes it. A first install still has
          # nothing to preserve, so it remains shadow-only.
          keep_or_existing() {
            case "${2:-keep}" in
              keep|"") read_existing "$1" ;;
              *) printf '%s' "$2" ;;
            esac
          }
          exit_mode="$(keep_or_existing LIVE_EXIT_MODE "${LIVE_EXIT_MODE:-}")"
          protect_all="$(keep_or_existing LIVE_EXIT_PROTECT_ALL "${LIVE_EXIT_PROTECT_ALL:-}")"
          confirm_live="$(keep_or_existing LIVE_EXIT_CONFIRM_LIVE "${LIVE_EXIT_CONFIRM_LIVE:-}")"
          dip_entry_mode="$(keep_or_existing LIVE_DIP_ENTRY_MODE "${LIVE_DIP_ENTRY_MODE:-}")"
          exit_mode="${exit_mode:-shadow}"
          protect_all="${protect_all:-false}"
          confirm_live="${confirm_live:-false}"
          dip_entry_mode="${dip_entry_mode:-off}"
          case "$dip_entry_mode" in off|shadow|live) ;; *) dip_entry_mode=off ;; esac
          echo "mode=${exit_mode} confirm_live=${confirm_live} protect_all=${protect_all} dip_entry=${dip_entry_mode}"
          if [ "$dip_entry_mode" = "live" ] && [ "$exit_mode" = "live" ] && [ "$confirm_live" = "true" ]; then
            echo "-> DIP ENTRY ARMED: a collapsed favourite in the buy band may be BOUGHT."
          elif [ "$dip_entry_mode" = "off" ]; then
            echo "-> DIP ENTRY OFF: the watch list is not even fetched."
          else
            echo "-> DIP ENTRY SHADOW: entries are logged and NOTHING is bought."
          fi
          if [ "$exit_mode" = "live" ] && [ "$confirm_live" = "true" ]; then
            echo "-> ARMED: a reached stop may be submitted as a protective SELL."
          else
            echo "-> SHADOW: a reached stop is logged and NOTHING is sold."
          fi
          case "$exit_mode" in shadow|live) ;; *) exit_mode=shadow ;; esac
          cat > "$HOME/.config/trading-live-exit-worker.env" <<EOF
          POLYMARKET_PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY}
          POLYMARKET_FUNDER_ADDRESS=${POLYMARKET_FUNDER_ADDRESS}
          POLYMARKET_SIGNATURE_TYPE=${POLYMARKET_SIGNATURE_TYPE}
          TRADING_TRIGGER_KEY=${TRADING_TRIGGER_KEY}
          LIVE_ENTRY_CLAIM_URL=https://osobnizkusenosti.cz/trading/api.php?action=live-entry-claim
          LIVE_EXIT_MODE=${exit_mode}
          LIVE_EXIT_CONFIRM_LIVE=${confirm_live}
          LIVE_EXIT_PROTECT_ALL=${protect_all}
          # The dip-entry rule. It rides this worker rather than the hourly executor because
          # the trough it buys lasts minutes, and this loop is already round every second
          # with the signing key and the entry claim. Everything slow -- size, tick,
          # diversification, cash -- is decided by api.php's dip-entry-watch before the price
          # ever reaches the band.
          LIVE_DIP_ENTRY_MODE=${dip_entry_mode}
          LIVE_DIP_ENTRY_WATCH_URL=https://osobnizkusenosti.cz/trading/api.php?action=dip-entry-watch
          # A collapsed favourite LEAVES the catalogue -- above 50% it is a row, at 35% it is
          # not -- so a watch entry has to outlive the very collapse it waits for.
          LIVE_DIP_ENTRY_TTL_MS=14400000
          LIVE_DIP_ENTRY_MAX_SLIPPAGE=0.02
          # How fast the loop goes round IS the stop's reaction time. Measured on a stopped
          # position: under a minute from healthy to through the floor. One pass is one
          # batched /books request regardless of how many positions are held, so a one-second
          # loop costs one request a second no matter how large the account gets.
          LIVE_EXIT_POLL_INTERVAL_MS=1000
          # How far below its own level a stop will still sell, as a fraction OF THE STOP.
          # One global value on the owner's instruction, written here rather than left to the
          # code default so a status read shows the number actually in force.
          #
          # 0.5, widened from 0.1: a stop at 0.524963 saw the price go from above its trigger
          # to a 0.45 bid between two one-second passes -- 14% under, so it declined, and the
          # position then resolved at zero for the whole stake instead of a capped 2.20. 50%
          # still refuses the liquidations the band exists for, where the bid sits at a tenth
          # of the stop.
          LIVE_EXIT_STOP_GAP_TOLERANCE=0.5
          LIVE_EXIT_RETRY_INTERVAL_MS=20000
          # How long an order the exchange QUEUED (`delayed`) is left to settle before another
          # is sent for the same position. Written here so a status read shows the number in
          # force: three orders went out for one position inside 90 seconds -- 04:59:26,
          # 05:00:12, 05:00:53 -- because a queued order was recorded as a rejection and the
          # retry timer started on it. The first had filled.
          LIVE_EXIT_PENDING_MATCH_MS=120000
          # And how often the exchange is asked what became of it. Not every pass: the pass is
          # one second, and each question is an authenticated round trip.
          LIVE_EXIT_PENDING_POLL_MS=5000
          LIVE_EXIT_STATE_REFRESH_MS=30000
          LIVE_EXIT_POLICY_URL=https://osobnizkusenosti.cz/trading/api.php?action=live-exit-policy
          LIVE_EXIT_STATE_PATH=$HOME/.local/state/trading/live-exit-worker-state.json
          LIVE_EXIT_WATCHLIST_PATH=$HOME/.config/trading-live-exit-watchlist.json
          LIVE_EXIT_POST_FILL_SYNC_COMMAND=gh workflow run trading-live-account.yml --repo kubiczech808/apps --ref ${LIVE_EXIT_REF}
          EOF
          chmod 600 "$HOME/.config/trading-live-exit-worker.env"
          if [ ! -f "$HOME/.config/trading-live-exit-watchlist.json" ]; then
            printf '{\n  "positions": []\n}\n' > "$HOME/.config/trading-live-exit-watchlist.json"
            chmod 600 "$HOME/.config/trading-live-exit-watchlist.json"
          fi

      - name: Enable persistent exit worker
        run: |
          set -euo pipefail
          runtime_dir="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          mkdir -p "$HOME/.config/systemd/user"
          install -m 644 trading/systemd/trading-live-exit-worker.service "$HOME/.config/systemd/user/trading-live-exit-worker.service"
          systemctl --user daemon-reload
          systemctl --user enable trading-live-exit-worker.service
          # RESTART, not `enable --now`. `--now` starts a stopped unit and does nothing to a
          # running one, so every install since the worker last came up published new code
          # and a new EnvironmentFile that the live process never read. Measured: after a
          # dispatch setting live mode, the worker's own state file still reported
          # mode=shadow while cycling normally -- the file on disk said live and the process
          # kept the environment it had started with hours earlier. The same silence hid two
          # code fixes. A worker whose configuration cannot reach it is not configurable.
          # Noted before restarting, so the check below can tell a state file the restarted
          # worker wrote from the one its predecessor left behind. Reading the old file was
          # the first version of this check, and it reported the previous mode with complete
          # confidence -- the same mistake it exists to catch, one level up.
          restarted_at="$(date +%s)"
          systemctl --user restart trading-live-exit-worker.service
          systemctl --user --no-pager --full status trading-live-exit-worker.service

          # The state file is written by the worker itself, so it is the one place the ARMED
          # mode can be read rather than the intended one.
          state="$HOME/.local/state/trading/live-exit-worker-state.json"
          expected="$(sed -n 's/^LIVE_EXIT_MODE=//p' "$HOME/.config/trading-live-exit-worker.env" | tail -n 1)"
          expected="${expected:-shadow}"
          running=""
          for _attempt in $(seq 1 20); do
            if [ -f "$state" ] && [ "$(stat -c %Y "$state")" -ge "$restarted_at" ]; then
              running="$(sed -n 's/.*"mode": *"\([a-z]*\)".*/\1/p' "$state" | head -n 1)"
              [ -n "$running" ] && break
            fi
            sleep 3
          done
          echo ""
          echo "configured mode: ${expected}"
          echo "worker reports:  ${running:-(no cycle written since the restart)}"
          if [ -z "$running" ]; then
            echo "   The worker has not completed a cycle yet, so its mode is unverified."
            exit 0
          fi
          if [ "$running" != "$expected" ]; then
            echo "   The worker is still running in ${running} after being configured for ${expected}."
            exit 1
          fi
          echo "   Confirmed: the running process is in ${running}."
