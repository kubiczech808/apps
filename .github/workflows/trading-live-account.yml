name: Trading Live Account

on:
  push:
    paths:
      - 'trading/tools/live-account-sync.mjs'
      - 'trading/package.json'
      - '.github/workflows/trading-live-account.yml'
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

concurrency:
  group: trading-live-account-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-account:
    runs-on: ubuntu-latest
    env:
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_ACTIVITY_LIMIT: "80"
      POLYMARKET_ADDRESS: ${{ secrets.POLYMARKET_ADDRESS || secrets.POLYMARKET_FUNDER_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live account target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-live-account.yml trading; then
            echo "Trading live account sync must not target email-campaign."
            exit 1
          fi

      - name: Generate live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Upload live state
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_STATE_FILE: trading/data/live-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          state_file = Path(os.environ["LIVE_STATE_FILE"])

          if not state_file.exists():
              raise SystemExit("live-state.json was not generated")

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(server, timeout=30) as ftp:
              ftp.login(username, password)
              enter_dir(ftp, target.split("/"))
              tmp_name = "live-state.json.uploading"
              with state_file.open("rb") as handle:
                  ftp.storbinary(f"STOR {tmp_name}", handle)
              try:
                  ftp.rename(tmp_name, "live-state.json")
              except ftplib.all_errors:
                  ftp.delete("live-state.json")
                  ftp.rename(tmp_name, "live-state.json")
          PY

      - name: Send redeem alert emails
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request

          request = urllib.request.Request(
              "https://osobnizkusenosti.cz/trading/api.php?action=send-redeem-alerts",
              data=b"",
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          if not payload.get("ok") or int(payload.get("failedCount") or 0) > 0:
              sys.exit("Redeem alert email sending failed")
          PY
