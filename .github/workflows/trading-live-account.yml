name: Trading Live Account

on:
  push:
    paths:
      - 'trading/tools/live-account-sync.mjs'
      - 'trading/tools/restore-live-execution-history.mjs'
      - 'trading/package.json'
      - '.github/workflows/trading-live-account.yml'
  workflow_dispatch:
  schedule:
    # Widened for delivery: an entry is dropped if it is still delayed when the same
    # entry comes due again, so a fifteen-minute spacing tolerates only fifteen minutes
    # of backlog. The dashboard also requests a sync on demand.
    - cron: '5,35 * * * *'

concurrency:
  group: trading-live-account-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to dispatch Trading Live Execution when an open order releases its capital.
  # workflow_dispatch is one of the two events GITHUB_TOKEN is still allowed to start a
  # workflow run with, so no personal access token is required for this.
  actions: write

jobs:
  live-account:
    runs-on: ubuntu-latest
    env:
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_PORTFOLIO_CONFIG_URL: https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config
      LIVE_ACTIVITY_LIMIT: "80"
      POLYMARKET_ADDRESS: ${{ secrets.POLYMARKET_ADDRESS || secrets.POLYMARKET_FUNDER_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '1' }}
      # The deposited baseline is an external fact, not something to infer from P/L.
      # The saved Live portfolio config is primary. GitHub variables remain a fallback
      # for headless recovery or a temporary top-up before the UI value is updated.
      LIVE_ORIGINAL_VALUE_USDC: ${{ vars.LIVE_ORIGINAL_VALUE_USDC }}
      LIVE_ADDITIONAL_DEPOSIT_USDC: ${{ vars.LIVE_ADDITIONAL_DEPOSIT_USDC }}
      LIVE_ADDITIONAL_DEPOSIT_ID: ${{ vars.LIVE_ADDITIONAL_DEPOSIT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live account target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-live-account.yml trading; then
            echo "Trading live account sync must not target email-campaign."
            exit 1
          fi

      - name: Generate live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Restore lost live run log history
        working-directory: trading
        env:
          LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
          LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
          LIVE_RUN_LOG_RECOVER: "true"
          LIVE_EXECUTION_WORKFLOW_FILE: polymarket-live-limit-order-test.yml
          # User-confirmed one-time browser execution that was overwritten
          # before persistent run-log storage was added.
          LIVE_CONFIRMED_MANUAL_RUN_IDS: "30846520601,30885038395"
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/restore-live-execution-history.mjs

      - name: Upload live state
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_STATE_FILE: trading/data/live-state.json
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          state_file = Path(os.environ["LIVE_STATE_FILE"])
          execution_file = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])

          if not state_file.exists():
              raise SystemExit("live-state.json was not generated")
          if not execution_file.exists():
              raise SystemExit("live-execution-state.json was not restored")

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def upload_atomic(ftp, local_path, remote_name):
              tmp_name = f"{remote_name}.uploading"
              with local_path.open("rb") as handle:
                  ftp.storbinary(f"STOR {tmp_name}", handle)
              try:
                  ftp.rename(tmp_name, remote_name)
              except ftplib.all_errors:
                  ftp.delete(remote_name)
                  ftp.rename(tmp_name, remote_name)

          with ftplib.FTP(server, timeout=30) as ftp:
              ftp.login(username, password)
              enter_dir(ftp, target.split("/"))
              upload_atomic(ftp, execution_file, "live-execution-state.json")
              upload_atomic(ftp, state_file, "live-state.json")
          PY

      - name: Mirror live account state to Trading MySQL
        if: success()
        env:
          TRADING_STORAGE_INGEST_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=storage-ingest
          TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
          TRADING_STORAGE_INGEST_REQUIRED: "false"
        run: |
          TRADING_STORAGE_INGEST_TARGET=live TRADING_STORAGE_STATE_FILE=trading/data/live-state.json python3 trading/tools/ingest-trading-state.py
          TRADING_STORAGE_INGEST_TARGET=live-execution TRADING_STORAGE_STATE_FILE=trading/data/live-execution-state.json python3 trading/tools/ingest-trading-state.py
      # Runs after the upload on purpose: by now the published state no longer lists the
      # vanished order, so the next sync cannot detect it a second time and dispatch a
      # duplicate run. live_confirm is true because this stands in for the scheduled run
      # that would otherwise redeploy this capital hours later -- and a scheduled run
      # places real orders too.
      - name: Dispatch execution run when an open order released its capital
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_STATE_FILE: trading/data/live-state.json
          LIVE_EXECUTION_WORKFLOW_FILE: polymarket-live-limit-order-test.yml
          DISPATCH_REF: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          state = json.loads(Path(os.environ["LIVE_STATE_FILE"]).read_text(encoding="utf-8"))
          released = state.get("releasedOrderCapital") or {}
          vanished = released.get("vanished") or []

          if released.get("ordersUnavailable"):
              print("Open orders could not be read this run, so no disappearance is trustworthy; not dispatching.")
              raise SystemExit(0)
          if not vanished:
              print(f"No open order left the book ({released.get('checked', 0)} checked); nothing to dispatch.")
              raise SystemExit(0)

          for order in vanished:
              print(f"released: {order.get('question') or order.get('tokenId')} "
                    f"({order.get('outcome') or '-'}) ~{order.get('releasedCapitalUsdc')} USDC")
          print(f"total freed: {released.get('freedCapitalUsdc')} USDC")

          repository = os.environ["GITHUB_REPOSITORY"]
          workflow = os.environ["LIVE_EXECUTION_WORKFLOW_FILE"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/{workflow}/dispatches",
              data=json.dumps({
                  "ref": os.environ["DISPATCH_REF"],
                  "inputs": {
                      "live_confirm": True,
                      "live_run_source": "AUTO",
                      "live_execution_trigger": "open_order_released",
                  },
              }).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Dispatched {workflow}: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              # A failed dispatch must not fail the sync: the snapshot is already
              # published and the next scheduled execution run still picks the capital up.
              print(f"::warning::Could not dispatch {workflow}: HTTP {exc.code} {body}")
          PY
