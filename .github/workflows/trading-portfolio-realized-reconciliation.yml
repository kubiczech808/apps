name: Trading Portfolio Realized Reconciliation

# Read-only diagnostic, manual only. Reported: the Realized figure on 80+ esports did not
# match the P/L of its own closed positions, and the others were to be checked too. This
# runs the dashboard's own attribution chain, extracted from the served app.js, and prints
# per portfolio what the tile showed against the sum of that portfolio's own closed rows --
# plus whether every closed row belongs to exactly one portfolio, which matters more than
# the tile.
# Writes nothing, publishes nothing, no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconcile each portfolio's realized P/L
        working-directory: trading
        run: node tools/portfolio-realized-reconciliation.mjs
