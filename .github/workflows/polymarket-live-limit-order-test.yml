name: Trading Live Execution

on:
  push:
    paths:
      - '.github/workflows/polymarket-live-limit-order-test.yml'
      - 'trading/tools/polymarket-order-poc.mjs'
      - 'trading/tools/live-order-executor.mjs'
      - 'trading/package.json'
  workflow_dispatch:
    inputs:
      live_confirm:
        description: Set true only for a real live order
        required: true
        default: false
        type: boolean
      live_min_probability:
        description: Minimum configured probability required for live execution, as decimal 0-1
        required: false
        default: "0.95"
        type: string
      live_max_order_fraction:
        description: Maximum stake per trade as fraction of total live portfolio value, decimal 0.01-0.50
        required: false
        default: "0.05"
        type: string
      live_max_resolution_days:
        description: Optional hard max resolution days
        required: false
        default: ""
        type: string
      live_selection_order:
        description: Candidate priority order
        required: false
        default: ""
        type: string
      live_min_liquidity_usdc:
        description: Minimum 24h volume or liquidity in USDC
        required: false
        default: ""
        type: string
      live_trade_cadence_hours:
        description: Minimum hours between new live orders
        required: false
        default: ""
        type: string
      live_use_limit_orders:
        description: Use limit orders instead of market orders
        required: false
        default: ""
        type: string
      cross_live_portfolio_risk_diversification:
        description: Block correlated exposure across live portfolios
        required: false
        default: "true"
        type: string
      live_ignore_trade_cadence:
        description: Manual Run once request; bypasses new-trade cadence only
        required: false
        default: "false"
        type: string
  schedule:
    # GitHub Actions schedules can be delayed or dropped. Poll every ten minutes
    # away from the top of the hour; the executor itself keeps the configured
    # new-trade cadence and records only real decision runs.
    - cron: '3,13,23,33,43,53 * * * *'

concurrency:
  group: trading-live-execution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-limit-order-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[live-limit-order-test]')
    runs-on: [self-hosted, Linux, ARM64]
    env:
      POLYMARKET_HOST: https://clob.polymarket.com
      POLYMARKET_CHAIN_ID: "137"
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '1' }}
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
      LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
      MAX_ORDER_FRACTION: ${{ github.event.inputs.live_max_order_fraction || '0.05' }}
      MAX_ORDER_NOTIONAL_USDC: "50"
      LIVE_IDLE_CASH_MAX_USDC: "5"
      LIVE_IDLE_CASH_GRACE_HOURS: "24"
      LIVE_ONE_TRADE_PER_DAY: "true"
      LIVE_TRADE_CADENCE_HOURS: ${{ github.event.inputs.live_trade_cadence_hours || '24' }}
      LIVE_IGNORE_TRADE_CADENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.live_ignore_trade_cadence == 'true' && 'true' || 'false' }}
      LIVE_SCHEDULED_CADENCE_POLL: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_ignore_trade_cadence != 'true')) && 'true' || 'false' }}
      USE_LIMIT_ORDERS: ${{ github.event.inputs.live_use_limit_orders || 'true' }}
      LIVE_CROSS_PORTFOLIO_RISK_DIVERSIFICATION: ${{ github.event.inputs.cross_live_portfolio_risk_diversification || 'true' }}
      POLYMARKET_POST_ONLY: "true"
      LIVE_ORDER_SIZE_MODE: stake_fraction
      LIVE_MIN_PROBABILITY: ${{ github.event.inputs.live_min_probability || '0.95' }}
      LIVE_PROBABILITY_SOURCE: "ai"
      LIVE_MIN_ANNUAL_RETURN: "0.05"
      LIVE_OPPORTUNITY_MIN_PROBABILITY: "0.60"
      LIVE_OPPORTUNITY_MIN_EDGE: "0.04"
      LIVE_OPPORTUNITY_MIN_ANNUAL_RETURN: "0.30"
      LIVE_MAX_SPREAD: "0.08"
      LIVE_MIN_VOLUME_24H: "100"
      LIVE_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.live_max_resolution_days || '' }}
      LIVE_SELECTION_ORDER: ${{ github.event.inputs.live_selection_order || '' }}
      LIVE_CONFIG_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.live_min_liquidity_usdc || '' }}
      LIVE_CANDIDATE_SCAN_LIMIT: "120"
      LIVE_AUTO_ROTATE: "true"
      LIVE_EXECUTION_SOURCE: rpi-self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live order target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/polymarket-live-limit-order-test.yml trading; then
            echo "Trading live order test must not target email-campaign."
            exit 1
          fi

      - name: Load portfolio config
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              payload = json.loads(urllib.request.urlopen("https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config", timeout=20).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable: {exc}")
              raise SystemExit(0)
          live = (payload.get("config") or {}).get("live") or {}
          system = (payload.get("config") or {}).get("system") or {}
          mapping = {
              "LIVE_MIN_PROBABILITY": live.get("minProbability"),
              "LIVE_PROBABILITY_SOURCE": live.get("probabilitySource"),
              "MAX_ORDER_FRACTION": live.get("maxOrderFraction"),
              "LIVE_MAX_RESOLUTION_DAYS": live.get("maxResolutionDays"),
              "LIVE_SELECTION_ORDER": live.get("selectionOrder"),
              "LIVE_CONFIG_MIN_LIQUIDITY_USDC": live.get("minLiquidityUsdc"),
              "LIVE_TRADE_CADENCE_HOURS": live.get("tradeCadenceHours"),
              "USE_LIMIT_ORDERS": str(bool(live.get("useLimitOrders", True))).lower(),
              "LIVE_CROSS_PORTFOLIO_RISK_DIVERSIFICATION": str(bool(system.get("crossLivePortfolioRiskDiversification", True))).lower(),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in mapping.items():
                  if value is None or value == "":
                      continue
                  print(f"{key}={value}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Generate fresh live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Revalidate and maybe submit live order
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
        run: |
          npm run live:execute -- --confirm-live

      - name: Refresh live account snapshot after execution
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Complete filled rotation immediately
        if: always()
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
          LIVE_STATE_URL: data/live-state.json
          LIVE_EXECUTION_STATE_URL: data/live-execution-state.json
        run: |
          if node -e 'const fs = require("fs"); const path = "data/live-execution-state.json"; const state = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : {}; process.exit(state.action === "ROTATION_EXIT_SUBMITTED" ? 0 : 1)'; then
            echo "Rotation exit accepted. Revalidating the synced account for an immediate replacement order."
            npm run live:execute -- --confirm-live
          else
            echo "No accepted live rotation exit in this run; immediate replacement is not needed."
          fi

      - name: Refresh live account snapshot after rotation check
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Persist current live revalidation into evaluation state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import io
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          execution_path = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])
          if not execution_path.exists():
              print("No live execution state was generated; no evaluation update to persist.")
              raise SystemExit(0)

          execution = json.loads(execution_path.read_text(encoding="utf-8"))
          updates = [item for item in execution.get("revalidationUpdates", []) if item.get("tokenId")]
          if not updates:
              print("No candidates were revalidated; paper evaluation state is unchanged.")
              raise SystemExit(0)

          target = os.environ["TRADING_FTP_DIR"].strip("/")
          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  ftp.cwd(part)

          with ftplib.FTP(os.environ["HOSTING_FTP_SERVER"], timeout=30) as ftp:
              ftp.login(os.environ["HOSTING_FTP_USERNAME"], os.environ["HOSTING_FTP_PASSWORD"])
              enter_dir(ftp, target.split("/"))
              remote = io.BytesIO()
              ftp.retrbinary("RETR paper-state.json", remote.write)
              state = json.loads(remote.getvalue().decode("utf-8"))
              evaluations = state.get("evaluations")
              if not isinstance(evaluations, list):
                  raise SystemExit("Remote paper-state.json has no evaluations array")

              by_token = {str(item.get("tokenId")): item for item in evaluations if isinstance(item, dict) and item.get("tokenId")}
              merged = 0
              for update in updates:
                  item = by_token.get(str(update["tokenId"]))
                  if not item:
                      continue
                  existing = item.get("executionRevalidation") if isinstance(item.get("executionRevalidation"), dict) else {}
                  if existing.get("checkedAt", "") > update.get("checkedAt", ""):
                      continue
                  item["executionRevalidation"] = update
                  # Current book economics are useful in the audit log, but never overwrite the AI thesis.
                  for field in ("marketPrice", "annualizedReturn", "expectedValueUsdc", "daysToResolution", "liquidity", "netGainIfWinUsdc", "totalCostUsdc", "orderPrice", "orderSize", "orderNotionalUsdc", "minOrderSize", "spread", "feeRate"):
                      if field in update:
                          item[field] = update[field]
                  item["updatedAt"] = update["checkedAt"]
                  merged += 1

              if not merged:
                  print("Revalidated tokens were no longer present in remote paper-state.json.")
                  raise SystemExit(0)

              payload = (json.dumps(state, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
              temporary = "paper-state.json.live-revalidation-uploading"
              ftp.storbinary(f"STOR {temporary}", io.BytesIO(payload))
              try:
                  ftp.rename(temporary, "paper-state.json")
              except ftplib.all_errors:
                  ftp.delete("paper-state.json")
                  ftp.rename(temporary, "paper-state.json")
              print(f"Persisted {merged} live revalidation updates into paper-state.json at {datetime.now(timezone.utc).isoformat()}")
          PY

      - name: Upload live state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_STATE_FILE: trading/data/live-state.json
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          state_file = Path(os.environ["LIVE_STATE_FILE"])
          execution_file = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])

          if not state_file.exists():
              raise SystemExit("live-state.json was not generated")

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(server, timeout=30) as ftp:
              ftp.login(username, password)
              enter_dir(ftp, target.split("/"))
              def upload_atomic(local_path, remote_name):
                  tmp_name = f"{remote_name}.uploading"
                  with local_path.open("rb") as handle:
                      ftp.storbinary(f"STOR {tmp_name}", handle)
                  try:
                      ftp.rename(tmp_name, remote_name)
                  except ftplib.all_errors:
                      ftp.delete(remote_name)
                      ftp.rename(tmp_name, remote_name)

              upload_atomic(state_file, "live-state.json")
              if execution_file.exists():
                  upload_atomic(execution_file, "live-execution-state.json")
          PY

      - name: Send redeem alert emails
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request

          request = urllib.request.Request(
              "https://osobnizkusenosti.cz/trading/api.php?action=send-redeem-alerts",
              data=b"",
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          if not payload.get("ok") or int(payload.get("failedCount") or 0) > 0:
              sys.exit("Redeem alert email sending failed")
          PY
