name: Trading Live Execution

on:
  push:
    paths:
      - '.github/workflows/polymarket-live-limit-order-test.yml'
      - 'trading/tools/polymarket-order-poc.mjs'
      - 'trading/tools/live-order-executor.mjs'
      - 'trading/package.json'
  workflow_dispatch:
    inputs:
      live_confirm:
        description: Set true only for a real live order
        required: true
        default: false
        type: boolean
      live_min_probability:
        description: Minimum configured probability required for live execution, as decimal 0-1
        required: false
        default: "0.95"
        type: string
      live_max_order_fraction:
        description: Maximum stake per trade as fraction of total live portfolio value, decimal 0.01-0.50
        required: false
        default: "0.05"
        type: string
      live_max_resolution_days:
        description: Optional hard max resolution days
        required: false
        default: ""
        type: string
      live_selection_order:
        description: Candidate priority order
        required: false
        default: ""
        type: string
      live_min_liquidity_usdc:
        description: Minimum 24h volume or liquidity in USDC
        required: false
        default: ""
        type: string
      live_min_net_yield:
        description: Minimum net profit after fees, decimal fraction
        required: false
        default: ""
        type: string
      live_use_limit_orders:
        description: Use limit orders instead of market orders
        required: false
        default: ""
        type: string
      cross_live_portfolio_risk_diversification:
        description: Block correlated exposure across live portfolios
        required: false
        default: "true"
        type: string
      live_run_source:
        description: Source of this live execution run
        required: false
        default: "AUTO"
        type: string
      live_execution_trigger:
        description: Execution trigger source
        required: false
        default: "cron"
        type: string
      live_execution_candidate_token_ids:
        description: Ordered token IDs from the browser's current live execution shortlist
        required: false
        default: ""
        type: string
      live_execution_probability_source:
        description: Probability source used to prepare the browser's shortlist
        required: false
        default: ""
        type: string
  schedule:
    # GitHub Actions schedules can be delayed or dropped. Poll every ten minutes
    # away from the top of the hour; every run may place a new eligible order.
    - cron: '3,13,23,33,43,53 * * * *'

concurrency:
  group: trading-live-execution-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  live-limit-order-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[live-limit-order-test]')
    runs-on: [self-hosted, Linux, ARM64]
    env:
      POLYMARKET_HOST: https://clob.polymarket.com
      POLYMARKET_CHAIN_ID: "137"
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      # Gmail/social-login accounts use a Polymarket deposit wallet. The sync
      # also verifies the discovered proxy address, but type 3 is the safe
      # default whenever no explicit account override is configured.
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '3' }}
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper
      PAPER_SCRAPED_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=scraped
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
      LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
      MAX_ORDER_FRACTION: ${{ github.event.inputs.live_max_order_fraction || '0.05' }}
      MAX_ORDER_NOTIONAL_USDC: "50"
      LIVE_IDLE_CASH_MAX_USDC: "5"
      LIVE_IDLE_CASH_GRACE_HOURS: "24"
      LIVE_RUN_SOURCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live_run_source || 'AUTO') || 'AUTO' }}
      LIVE_EXECUTION_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.live_execution_trigger || 'cron' }}
      LIVE_EXECUTION_CANDIDATE_TOKEN_IDS: ${{ github.event.inputs.live_execution_candidate_token_ids || '' }}
      LIVE_EXECUTION_SHORTLIST_PROBABILITY_SOURCE: ${{ github.event.inputs.live_execution_probability_source || '' }}
      LIVE_SKIP_SCHEDULED_EXECUTION: "false"
      USE_LIMIT_ORDERS: ${{ github.event.inputs.live_use_limit_orders || 'true' }}
      LIVE_CROSS_PORTFOLIO_RISK_DIVERSIFICATION: ${{ github.event.inputs.cross_live_portfolio_risk_diversification || 'true' }}
      POLYMARKET_POST_ONLY: "true"
      LIVE_ORDER_SIZE_MODE: stake_fraction
      LIVE_MIN_PROBABILITY: ${{ github.event.inputs.live_min_probability || '0.95' }}
      LIVE_PROBABILITY_SOURCE: "ai"
      LIVE_MIN_ANNUAL_RETURN: "0.05"
      LIVE_OPPORTUNITY_MIN_PROBABILITY: "0.60"
      LIVE_OPPORTUNITY_MIN_EDGE: "0.04"
      LIVE_OPPORTUNITY_MIN_ANNUAL_RETURN: "0.30"
      LIVE_MAX_SPREAD: "0.08"
      LIVE_MIN_VOLUME_24H: "100"
      LIVE_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.live_max_resolution_days || '' }}
      LIVE_SELECTION_ORDER: ${{ github.event.inputs.live_selection_order || '' }}
      LIVE_CONFIG_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.live_min_liquidity_usdc || '' }}
      LIVE_MIN_NET_YIELD: ${{ github.event.inputs.live_min_net_yield || '' }}
      LIVE_CANDIDATE_SCAN_LIMIT: "120"
      LIVE_AUTO_ROTATE: "true"
      LIVE_EXECUTION_SOURCE: rpi-self-hosted
      # The deposited baseline is an external fact, not something to infer from P/L.
      # Set LIVE_ORIGINAL_VALUE_USDC to the amount actually paid into the Polymarket
      # account. To record a later top-up, set LIVE_ADDITIONAL_DEPOSIT_USDC together
      # with a unique LIVE_ADDITIONAL_DEPOSIT_ID; it is added once and remembered.
      LIVE_ORIGINAL_VALUE_USDC: ${{ vars.LIVE_ORIGINAL_VALUE_USDC }}
      LIVE_ADDITIONAL_DEPOSIT_USDC: ${{ vars.LIVE_ADDITIONAL_DEPOSIT_USDC }}
      LIVE_ADDITIONAL_DEPOSIT_ID: ${{ vars.LIVE_ADDITIONAL_DEPOSIT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live order target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/polymarket-live-limit-order-test.yml trading; then
            echo "Trading live order test must not target email-campaign."
            exit 1
          fi

      - name: Load portfolio config
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              request = urllib.request.Request(
                  "https://www.osobnizkusenosti.cz/trading/api.php?action=portfolio-config",
                  headers={"User-Agent": "trading-live-execution/1.0"},
              )
              payload = json.loads(urllib.request.urlopen(request, timeout=20).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable: {exc}")
              raise SystemExit(1)
          live = (payload.get("config") or {}).get("live") or {}
          system = (payload.get("config") or {}).get("system") or {}
          mapping = {
              "LIVE_MIN_PROBABILITY": live.get("minProbability"),
              "LIVE_PROBABILITY_SOURCE": live.get("probabilitySource"),
              "MAX_ORDER_FRACTION": live.get("maxOrderFraction"),
              "LIVE_MAX_RESOLUTION_DAYS": live.get("maxResolutionDays"),
              "LIVE_SELECTION_ORDER": live.get("selectionOrder"),
              "LIVE_CONFIG_MIN_LIQUIDITY_USDC": live.get("minLiquidityUsdc"),
              "LIVE_MIN_NET_YIELD": live.get("minNetYield"),
              "LIVE_EXECUTION_TRIGGER": live.get("executionTrigger"),
              "LIVE_EXCLUDED_CANDIDATE_TOKEN_IDS": ",".join(str(token) for token in (live.get("excludedCandidateTokenIds") or []) if str(token).isdigit()),
              "USE_LIMIT_ORDERS": str(bool(live.get("useLimitOrders", True))).lower(),
              "LIVE_CROSS_PORTFOLIO_RISK_DIVERSIFICATION": str(bool(system.get("crossLivePortfolioRiskDiversification", True))).lower(),
          }
          if live.get("executionTrigger") == "after_scrape":
              if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
                  mapping["LIVE_SKIP_SCHEDULED_EXECUTION"] = "true"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in mapping.items():
                  if value is None or value == "":
                      continue
                  print(f"{key}={value}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Show effective live execution settings
        run: |
          echo "Live probability source: ${LIVE_PROBABILITY_SOURCE}"
          echo "Live execution trigger: ${LIVE_EXECUTION_TRIGGER}"
          echo "Live selection order: ${LIVE_SELECTION_ORDER}"

      - name: Generate fresh live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Restore live execution run history
        working-directory: trading
        env:
          # The runner starts from a clean checkout. Restore the hosted log
          # before the executor appends this decision, otherwise each run
          # would replace the full history with a single row.
          LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
          LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
          LIVE_RUN_LOG_RECOVER: "false"
          LIVE_CONFIRMED_MANUAL_RUN_IDS: "30846520601,30885038395"
        run: node tools/restore-live-execution-history.mjs

      - name: Verify current market and maybe submit live order
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
          # The preceding sync has just fetched the CLOB balance and open
          # orders. Execute against that local snapshot, not a potentially
          # older copy that is still being served from the hosting.
          LIVE_STATE_URL: data/live-state.json
          LIVE_EXECUTION_STATE_URL: data/live-execution-state.json
        run: |
          npm run live:execute -- --confirm-live

      - name: Refresh live account snapshot after execution
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Complete filled rotation immediately
        if: always()
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
          LIVE_STATE_URL: data/live-state.json
          LIVE_EXECUTION_STATE_URL: data/live-execution-state.json
        run: |
          if node -e 'const fs = require("fs"); const path = "data/live-execution-state.json"; const state = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : {}; process.exit(state.action === "ROTATION_EXIT_SUBMITTED" ? 0 : 1)'; then
            echo "Rotation exit accepted. Revalidating the synced account for an immediate replacement order."
            npm run live:execute -- --confirm-live
          else
            echo "No accepted live rotation exit in this run; immediate replacement is not needed."
          fi

      - name: Refresh live account snapshot after rotation check
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Persist current live market verification into evaluation state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import io
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          execution_path = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])
          if not execution_path.exists():
              print("No live execution state was generated; no evaluation update to persist.")
              raise SystemExit(0)

          execution = json.loads(execution_path.read_text(encoding="utf-8"))
          updates = [item for item in execution.get("revalidationUpdates", []) if item.get("tokenId")]
          if not updates:
              print("No candidates were revalidated; paper evaluation state is unchanged.")
              raise SystemExit(0)

          target = os.environ["TRADING_FTP_DIR"].strip("/")
          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  ftp.cwd(part)

          with ftplib.FTP(os.environ["HOSTING_FTP_SERVER"], timeout=30) as ftp:
              ftp.login(os.environ["HOSTING_FTP_USERNAME"], os.environ["HOSTING_FTP_PASSWORD"])
              enter_dir(ftp, target.split("/"))
              remote = io.BytesIO()
              ftp.retrbinary("RETR paper-state.json", remote.write)
              state = json.loads(remote.getvalue().decode("utf-8"))
              closed_out = []
              def merge_revalidation(rows, label):
                  if not isinstance(rows, list):
                      return 0
                  by_token = {str(item.get("tokenId")): item for item in rows if isinstance(item, dict) and item.get("tokenId")}
                  merged = 0
                  for update in updates:
                      item = by_token.get(str(update["tokenId"]))
                      if not item:
                          continue
                      existing = item.get("executionRevalidation") if isinstance(item.get("executionRevalidation"), dict) else {}
                      if existing.get("checkedAt", "") > update.get("checkedAt", ""):
                          continue
                      item["executionRevalidation"] = update
                      # The source record stays scraped/evaluated; this is the current
                      # execution verdict for the portfolio shortlist.
                      for field in ("marketPrice", "marketProbability", "annualizedReturn", "expectedValueUsdc", "daysToResolution", "liquidity", "netGainIfWinUsdc", "totalCostUsdc", "orderPrice", "orderSize", "orderNotionalUsdc", "minOrderSize", "spread", "feeRate"):
                          if field in update:
                              item[field] = update[field]
                      # A market Gamma no longer lists, or one that stopped accepting
                      # orders, cannot come back. Closing the stored row out is what
                      # removes it from the candidate list for good; otherwise the
                      # prefilter keeps shortlisting it and every run pays for a live
                      # fetch just to reject it again.
                      if update.get("marketGone"):
                          item["status"] = "CLOSED"
                          item["selectionStatus"] = "CLOSED"
                          item["marketClosed"] = True
                          item["acceptingOrders"] = False
                          closed_out.append(str(update["tokenId"]))
                      item["updatedAt"] = update["checkedAt"]
                      merged += 1
                  print(f"Merged {merged} live revalidation updates into {label}.")
                  return merged

              merged_evaluations = merge_revalidation(state.get("evaluations"), "evaluations")
              merged_observations = merge_revalidation(state.get("marketObservations"), "market observations")
              merged = merged_evaluations + merged_observations
              if closed_out:
                  print(f"Closed out {len(set(closed_out))} rows whose market no longer exists: {sorted(set(closed_out))}")
              if not merged:
                  print("Revalidated tokens were no longer present in remote evaluation or scraped market state.")
                  raise SystemExit(0)

              payload = (json.dumps(state, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
              temporary = "paper-state.json.live-revalidation-uploading"
              ftp.storbinary(f"STOR {temporary}", io.BytesIO(payload))
              try:
                  ftp.rename(temporary, "paper-state.json")
              except ftplib.all_errors:
                  ftp.delete("paper-state.json")
                  ftp.rename(temporary, "paper-state.json")
              print(f"Persisted {merged} live revalidation updates into paper-state.json at {datetime.now(timezone.utc).isoformat()}")
          PY

      - name: Merge published run-log history before upload
        if: always()
        working-directory: trading
        env:
          # Read the hosted state, not the local copy the executor just wrote.
          LIVE_EXECUTION_PUBLISHED_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
          LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
        # The upload replaces the hosted file outright, so a run that started from an
        # empty local log would publish that empty log over the real history. This makes
        # the file about to be uploaded a superset of the one it replaces.
        run: node tools/merge-live-execution-history.mjs

      - name: Upload live state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_STATE_FILE: trading/data/live-state.json
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import time
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          state_file = Path(os.environ["LIVE_STATE_FILE"])
          execution_file = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def swap_into_place(ftp, tmp_name, remote_name):
              """Replace remote_name with tmp_name without ever leaving nothing behind.

              The previous version deleted remote_name and then renamed. If that rename
              failed, the hosted file was simply gone -- and for live-execution-state.json
              that is the entire run-log history. The existing file is now moved aside to
              a backup first, so a failure at any point still leaves a recoverable copy,
              and the backup is only removed once the new file is confirmed in place.
              """
              try:
                  ftp.rename(tmp_name, remote_name)
                  return
              except ftplib.all_errors:
                  pass
              backup_name = f"{remote_name}.previous"
              try:
                  ftp.delete(backup_name)
              except ftplib.all_errors:
                  pass
              moved_aside = False
              try:
                  ftp.rename(remote_name, backup_name)
                  moved_aside = True
              except ftplib.all_errors:
                  pass
              try:
                  ftp.rename(tmp_name, remote_name)
              except ftplib.all_errors:
                  if moved_aside:
                      # Put the original back rather than leaving the path empty.
                      try:
                          ftp.rename(backup_name, remote_name)
                      except ftplib.all_errors:
                          pass
                  raise
              if moved_aside:
                  try:
                      ftp.delete(backup_name)
                  except ftplib.all_errors:
                      pass

          def upload_atomic(local_path, remote_name):
              failures = []
              for attempt in range(1, 4):
                  tmp_name = f"{remote_name}.uploading-{attempt}"
                  try:
                      with ftplib.FTP(server, timeout=30) as ftp:
                          ftp.login(username, password)
                          enter_dir(ftp, target.split("/"))
                          with local_path.open("rb") as handle:
                              ftp.storbinary(f"STOR {tmp_name}", handle)
                          swap_into_place(ftp, tmp_name, remote_name)
                      print(f"Uploaded {remote_name} on attempt {attempt}")
                      return
                  except ftplib.all_errors as error:
                      failures.append(str(error))
                      time.sleep(attempt)
              raise RuntimeError(f"Could not upload {remote_name} after 3 attempts: {' | '.join(failures)}")

          # Preserve the execution log even if the larger account-state upload fails.
          if execution_file.exists():
              upload_atomic(execution_file, "live-execution-state.json")
          if not state_file.exists():
              raise SystemExit("live-state.json was not generated")
          upload_atomic(state_file, "live-state.json")
          PY

      # The decision is printed at the START of the execution step, so on a long run it
      # falls outside the window a log reader can fetch and the run becomes unexplainable
      # from the outside. Reprinting a compact digest as the LAST thing the job does means
      # a run can always be explained from its timestamp alone, without opening the UI.
      - name: Run digest
        if: always()
        continue-on-error: true
        env:
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])
          if not path.exists():
              print("RUN DIGEST: no live execution state was produced by this run.")
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding="utf-8"))
          batch = state.get("batchLog") or {}

          def money(value):
              try:
                  return f"{float(value):.4f}"
              except (TypeError, ValueError):
                  return "-"

          print("=== RUN DIGEST ===")
          print(f"generatedAt : {state.get('generatedAt')}")
          print(f"action      : {state.get('action')}")
          print(f"reason      : {state.get('reason')}")

          capital = batch.get("capital") or {}
          if capital:
              print("capital     : "
                    f"available {money(capital.get('availableUsdc'))} / "
                    f"required {money(capital.get('requiredStakeUsdc'))} / "
                    f"insufficient={capital.get('insufficientCapital')}")

          counts = batch.get("counts") or {}
          if counts:
              print("counts      : " + ", ".join(f"{k}={v}" for k, v in counts.items()))

          # The per-position rotation reasons are the part that is otherwise invisible:
          # the outer verdict alone never says why each position was kept.
          review = state.get("rotationReview") or batch.get("rotationReview") or {}
          if review:
              print(f"rotation    : {review.get('action')} - {review.get('reason')}")
              for entry in (review.get("reviews") or [])[:8]:
                  position = entry.get("position") or {}
                  candidate = entry.get("candidate") or {}
                  print(f"  - {str(position.get('question'))[:58]!r} [{position.get('outcome')}]")
                  print(f"      {entry.get('action')}: {str(entry.get('reason'))[:200]}")
                  if candidate:
                      print(f"      tried: {str(candidate.get('question'))[:58]!r} [{candidate.get('outcome')}]")

          for entry in (batch.get("topRejected") or [])[:8]:
              reasons = entry.get("rejectReasons") or []
              print(f"rejected    : {str(entry.get('question'))[:58]!r} -> {'; '.join(str(r) for r in reasons)[:160]}")

          for attempt in (state.get("attempts") or [])[:4]:
              print(f"attempt     : {attempt.get('side')} {attempt.get('orderSize')} @ {attempt.get('orderPrice')} "
                    f"-> {attempt.get('action')} {attempt.get('responseError') or ''}")
          print("=== END RUN DIGEST ===")
          PY

      - name: Send redeem alert emails
        id: redeem_alerts
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request

          request = urllib.request.Request(
              "https://osobnizkusenosti.cz/trading/api.php?action=send-redeem-alerts",
              data=b"",
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          if not payload.get("ok") or int(payload.get("failedCount") or 0) > 0:
              sys.exit("Redeem alert email sending failed")
          PY

      - name: Report redeem alert warning
        if: always() && steps.redeem_alerts.outcome == 'failure'
        run: |
          echo "::warning::Redeem alert delivery failed after the trading decision. The order result and account synchronization were not affected."
