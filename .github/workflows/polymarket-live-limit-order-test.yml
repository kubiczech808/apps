name: Polymarket Live Limit Order Test

on:
  push:
    paths:
      - '.github/workflows/polymarket-live-limit-order-test.yml'
      - 'trading/tools/polymarket-order-poc.mjs'
      - 'trading/tools/live-order-executor.mjs'
      - 'trading/package.json'
  workflow_dispatch:
    inputs:
      live_confirm:
        description: Set true only for a real live order
        required: true
        default: false
        type: boolean
      live_min_probability:
        description: Minimum AI probability required for live execution, as decimal 0-1
        required: false
        default: "0.95"
        type: string
      live_max_order_fraction:
        description: Maximum stake per trade as fraction of total live portfolio value, decimal 0.01-0.50
        required: false
        default: "0.05"
        type: string
      live_max_resolution_days:
        description: Optional hard max resolution days
        required: false
        default: ""
        type: string
      live_selection_order:
        description: Candidate priority order
        required: false
        default: ""
        type: string
      live_min_liquidity_usdc:
        description: Minimum 24h volume or liquidity in USDC
        required: false
        default: ""
        type: string
      live_use_limit_orders:
        description: Use limit orders instead of market orders
        required: false
        default: ""
        type: string
  schedule:
    - cron: '7 * * * *'

jobs:
  live-limit-order-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[live-limit-order-test]')
    runs-on: [self-hosted, Linux, ARM64]
    env:
      POLYMARKET_HOST: https://clob.polymarket.com
      POLYMARKET_CHAIN_ID: "137"
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '1' }}
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
      LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
      MAX_ORDER_FRACTION: ${{ github.event.inputs.live_max_order_fraction || '0.05' }}
      MAX_ORDER_NOTIONAL_USDC: "50"
      LIVE_IDLE_CASH_MAX_USDC: "5"
      LIVE_IDLE_CASH_GRACE_HOURS: "24"
      LIVE_ONE_TRADE_PER_DAY: "true"
      USE_LIMIT_ORDERS: ${{ github.event.inputs.live_use_limit_orders || 'true' }}
      POLYMARKET_POST_ONLY: "true"
      LIVE_ORDER_SIZE_MODE: stake_fraction
      LIVE_MIN_PROBABILITY: ${{ github.event.inputs.live_min_probability || '0.95' }}
      LIVE_MIN_ANNUAL_RETURN: "0.05"
      LIVE_OPPORTUNITY_MIN_PROBABILITY: "0.60"
      LIVE_OPPORTUNITY_MIN_EDGE: "0.04"
      LIVE_OPPORTUNITY_MIN_ANNUAL_RETURN: "0.30"
      LIVE_MAX_SPREAD: "0.08"
      LIVE_MIN_VOLUME_24H: "100"
      LIVE_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.live_max_resolution_days || '' }}
      LIVE_SELECTION_ORDER: ${{ github.event.inputs.live_selection_order || '' }}
      LIVE_CONFIG_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.live_min_liquidity_usdc || '' }}
      LIVE_SHORT_HORIZON_DAYS: "7"
      LIVE_MEDIUM_HORIZON_DAYS: "14"
      LIVE_CANDIDATE_SCAN_LIMIT: "120"
      LIVE_EXECUTION_SOURCE: rpi-self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live order target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/polymarket-live-limit-order-test.yml trading; then
            echo "Trading live order test must not target email-campaign."
            exit 1
          fi

      - name: Load portfolio config
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              payload = json.loads(urllib.request.urlopen("https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config", timeout=20).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable: {exc}")
              raise SystemExit(0)
          live = (payload.get("config") or {}).get("live") or {}
          mapping = {
              "LIVE_MIN_PROBABILITY": live.get("minProbability"),
              "MAX_ORDER_FRACTION": live.get("maxOrderFraction"),
              "LIVE_MAX_RESOLUTION_DAYS": live.get("maxResolutionDays"),
              "LIVE_SELECTION_ORDER": live.get("selectionOrder"),
              "LIVE_CONFIG_MIN_LIQUIDITY_USDC": live.get("minLiquidityUsdc"),
              "USE_LIMIT_ORDERS": str(bool(live.get("useLimitOrders", True))).lower(),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in mapping.items():
                  if value is None or value == "":
                      continue
                  print(f"{key}={value}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Generate fresh live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Revalidate and maybe submit live order
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
        run: |
          npm run live:execute -- --confirm-live

      - name: Refresh live account snapshot after execution
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Upload live state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          LIVE_STATE_FILE: trading/data/live-state.json
          LIVE_EXECUTION_STATE_FILE: trading/data/live-execution-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          state_file = Path(os.environ["LIVE_STATE_FILE"])
          execution_file = Path(os.environ["LIVE_EXECUTION_STATE_FILE"])

          if not state_file.exists():
              raise SystemExit("live-state.json was not generated")

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(server, timeout=30) as ftp:
              ftp.login(username, password)
              enter_dir(ftp, target.split("/"))
              with state_file.open("rb") as handle:
                  ftp.storbinary("STOR live-state.json", handle)
              if execution_file.exists():
                  with execution_file.open("rb") as handle:
                      ftp.storbinary("STOR live-execution-state.json", handle)
          PY

      - name: Send redeem alert emails
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request

          request = urllib.request.Request(
              "https://osobnizkusenosti.cz/trading/api.php?action=send-redeem-alerts",
              data=b"",
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          if not payload.get("ok") or int(payload.get("failedCount") or 0) > 0:
              sys.exit("Redeem alert email sending failed")
          PY
