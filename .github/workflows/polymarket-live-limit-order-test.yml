name: Trading Live Execution

on:
  push:
    paths:
      - '.github/workflows/polymarket-live-limit-order-test.yml'
      - 'trading/tools/polymarket-order-poc.mjs'
      - 'trading/tools/live-order-executor.mjs'
      - 'trading/package.json'
  workflow_dispatch:
    inputs:
      live_confirm:
        description: Set true only for a real live order
        required: true
        default: false
        type: boolean
      live_min_probability:
        description: Minimum configured probability required for live execution, as decimal 0-1
        required: false
        default: "0.95"
        type: string
      live_max_order_fraction:
        description: Maximum stake per trade as fraction of total live portfolio value, decimal 0.01-0.50
        required: false
        default: "0.05"
        type: string
      live_stake_usdc:
        description: Fixed maximum stake per live trade in USDC
        required: false
        default: "5"
        type: string
      live_max_resolution_days:
        description: Optional hard max resolution days
        required: false
        default: ""
        type: string
      live_selection_order:
        description: Candidate priority order
        required: false
        default: ""
        type: string
      live_min_liquidity_usdc:
        description: Minimum 24h volume or liquidity in USDC
        required: false
        default: ""
        type: string
      live_min_net_yield:
        description: Minimum net profit after fees, decimal fraction
        required: false
        default: ""
        type: string
      live_use_limit_orders:
        description: Use limit orders instead of market orders
        required: false
        default: ""
        type: string
      cross_live_portfolio_risk_diversification:
        description: Block correlated exposure across live portfolios
        required: false
        default: "true"
        type: string
      live_run_source:
        description: Source of this live execution run
        required: false
        default: "AUTO"
        type: string
      live_execution_trigger:
        description: Execution trigger source
        required: false
        default: "cron"
        type: string
      live_execution_candidate_token_ids:
        description: Ordered token IDs from the browser's current live execution shortlist
        required: false
        default: ""
        type: string
      live_execution_probability_source:
        description: Deprecated and ignored. Scoring always uses the Polymarket probability.
        required: false
        default: ""
        type: string
      live_portfolio_id:
        description: Optional custom live portfolio id; blank runs the legacy Live portfolio
        required: false
        default: ""
        type: string
  schedule:
    # GitHub Actions schedules can be delayed or dropped. Poll every ten minutes
    # away from the top of the hour; every run may place a new eligible order.
    # A heartbeat, not the pace. GitHub drops a scheduled run that is still delayed
    # when the same entry comes due again, and this repository asks for ~53 scheduled
    # runs an hour across its workflows -- measured, this one was configured for six an
    # hour and delivered three in a day, while every dispatch in the same window
    # succeeded. The cadence now comes from the post-scrape dispatch, which wakes this
    # portfolio after each scan and lets its own saved cadence decide whether to act.
    # What is left here restarts that chain if it ever breaks.
    # A heartbeat, once an hour. Live execution is woken by the scan's post-scrape
    # dispatch, which honours each portfolio's saved cadence and automation switch;
    # this entry only covers the chain having stopped altogether.
    - cron: '13 * * * *'

concurrency:
  group: trading-live-execution-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  live-limit-order-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[live-limit-order-test]')
    runs-on: [self-hosted, Linux, ARM64]
    env:
      POLYMARKET_HOST: https://clob.polymarket.com
      POLYMARKET_CHAIN_ID: "137"
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS || secrets.POLYMARKET_ADDRESS || '0x3252de913d9323667f21f4d88fa1f996fc282293' }}
      # Gmail/social-login accounts use a Polymarket deposit wallet. The sync
      # also verifies the discovered proxy address, but type 3 is the safe
      # default whenever no explicit account override is configured.
      POLYMARKET_SIGNATURE_TYPE: ${{ secrets.POLYMARKET_SIGNATURE_TYPE || '3' }}
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=dashboard
      PAPER_SCRAPED_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=execution
      LIVE_STATE_PATH: data/live-state.json
      LIVE_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live
      LIVE_PORTFOLIO_CONFIG_URL: https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config
      LIVE_EXECUTION_STATE_PATH: data/live-execution-state.json
      LIVE_EXECUTION_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution
      LIVE_EXECUTION_PUBLISH_FILE: trading/data/live-execution-state.json>live-execution-state.json
      LIVE_PORTFOLIO_CONFIG_ID: ${{ github.event.inputs.live_portfolio_id || '' }}
      LIVE_PORTFOLIO_ID: live
      MAX_ORDER_FRACTION: ${{ github.event.inputs.live_max_order_fraction || '0.05' }}
      LIVE_STAKE_USDC: ${{ github.event.inputs.live_stake_usdc || '5' }}
      MAX_ORDER_NOTIONAL_USDC: "50"
      LIVE_IDLE_CASH_MAX_USDC: "5"
      LIVE_IDLE_CASH_GRACE_HOURS: "24"
      LIVE_RUN_SOURCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live_run_source || 'AUTO') || 'AUTO' }}
      LIVE_EXECUTION_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.live_execution_trigger || 'cron' }}
      LIVE_EXECUTION_CANDIDATE_TOKEN_IDS: ${{ github.event.inputs.live_execution_candidate_token_ids || '' }}
      LIVE_SKIP_SCHEDULED_EXECUTION: "false"
      USE_LIMIT_ORDERS: ${{ github.event.inputs.live_use_limit_orders || 'true' }}
      LIVE_CROSS_PORTFOLIO_RISK_DIVERSIFICATION: ${{ github.event.inputs.cross_live_portfolio_risk_diversification || 'true' }}
      POLYMARKET_POST_ONLY: "true"
      LIVE_ORDER_SIZE_MODE: stake_fraction
      LIVE_MIN_PROBABILITY: ${{ github.event.inputs.live_min_probability || '0.95' }}
      LIVE_MIN_ANNUAL_RETURN: "0.05"
      LIVE_OPPORTUNITY_MIN_PROBABILITY: "0.60"
      LIVE_OPPORTUNITY_MIN_EDGE: "0.04"
      LIVE_OPPORTUNITY_MIN_ANNUAL_RETURN: "0.30"
      LIVE_MAX_SPREAD: "0.08"
      LIVE_MIN_VOLUME_24H: "100"
      LIVE_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.live_max_resolution_days || '' }}
      LIVE_SELECTION_ORDER: ${{ github.event.inputs.live_selection_order || '' }}
      LIVE_CONFIG_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.live_min_liquidity_usdc || '' }}
      LIVE_MIN_NET_YIELD: ${{ github.event.inputs.live_min_net_yield || '' }}
      LIVE_CANDIDATE_SCAN_LIMIT: "120"
      LIVE_AUTO_ROTATE: "true"
      LIVE_EXECUTION_SOURCE: rpi-self-hosted
      # The deposited baseline is an external fact, not something to infer from P/L.
      # The saved Live portfolio config is primary. GitHub variables remain a fallback
      # for headless recovery or a temporary top-up before the UI value is updated.
      LIVE_ORIGINAL_VALUE_USDC: ${{ vars.LIVE_ORIGINAL_VALUE_USDC }}
      LIVE_ADDITIONAL_DEPOSIT_USDC: ${{ vars.LIVE_ADDITIONAL_DEPOSIT_USDC }}
      LIVE_ADDITIONAL_DEPOSIT_ID: ${{ vars.LIVE_ADDITIONAL_DEPOSIT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trading dependencies
        working-directory: trading
        run: npm install

      - name: Verify live order target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/polymarket-live-limit-order-test.yml trading; then
            echo "Trading live order test must not target email-campaign."
            exit 1
          fi

      - name: Load portfolio config
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              request = urllib.request.Request(
                  "https://www.osobnizkusenosti.cz/trading/api.php?action=portfolio-config",
                  headers={"User-Agent": "trading-live-execution/1.0"},
              )
              payload = json.loads(urllib.request.urlopen(request, timeout=20).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable: {exc}")
              raise SystemExit(1)
          config = payload.get("config") or {}
          requested_id = os.environ.get("LIVE_PORTFOLIO_CONFIG_ID", "").strip()
          if requested_id:
              if not __import__("re").fullmatch(r"[a-z][a-zA-Z0-9]{1,30}", requested_id):
                  raise SystemExit("Invalid custom live portfolio id")
              live = (config.get("livePortfolios") or {}).get(requested_id) or {}
              if not live or live.get("archived") is True:
                  raise SystemExit("Custom live portfolio is unavailable")
              execution_path = f"data/live-{requested_id}-execution-state.json"
              execution_url = f"https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-custom-{requested_id}-execution"
              execution_publish_file = f"trading/{execution_path}>live-{requested_id}-execution-state.json"
              portfolio_id = f"live-custom-{requested_id}"
          else:
              live = config.get("live") or {}
              execution_path = "data/live-execution-state.json"
              execution_url = "https://osobnizkusenosti.cz/trading/api.php?action=state&target=live-execution"
              execution_publish_file = "trading/data/live-execution-state.json>live-execution-state.json"
              portfolio_id = "live"
          system = config.get("system") or {}
          mapping = {
              "LIVE_MIN_PROBABILITY": live.get("minProbability"),
              "LIVE_MAX_PROBABILITY": live.get("maxProbability"),
              "LIVE_STAKE_USDC": live.get("stakeUsdc"),
              "MAX_ORDER_FRACTION": live.get("maxOrderFraction"),
              "LIVE_MAX_RESOLUTION_DAYS": live.get("maxResolutionDays"),
              "LIVE_SELECTION_ORDER": live.get("selectionOrder"),
              "LIVE_CONFIG_MIN_LIQUIDITY_USDC": live.get("minLiquidityUsdc"),
              "LIVE_MIN_NET_YIELD": live.get("minNetYield"),
              "LIVE_MARKET_TYPE": live.get("marketType"),
              "LIVE_EXECUTION_TRIGGER": live.get("executionTrigger"),
              "LIVE_EXECUTION_CRON_MINUTES": live.get("executionCronMinutes"),
              # Default on: a portfolio that never stored the field must keep trading.
              "LIVE_AUTOMATION_ENABLED": str(bool(live.get("automationEnabled", True))).lower(),
              # Keep the long-standing live behavior when the setting is absent.
              "LIVE_AUTO_ROTATE": str(bool(live.get("autoRotatePositions", True))).lower(),
              "LIVE_EXCLUDED_CANDIDATE_TOKEN_IDS": ",".join(str(token) for token in (live.get("excludedCandidateTokenIds") or []) if str(token).isdigit()),
              # Whole tags this portfolio refuses. Empty excludes nothing, which is what an
              # unset variable means too, so the loop skipping it clears the setting rather
              # than stranding it.
              "LIVE_EXCLUDED_MARKET_TAGS": ",".join(str(tag).strip() for tag in (live.get("excludedMarketTags") or []) if str(tag).strip()),
              "LIVE_INCLUDE_ONLY_MARKET_TAGS": ",".join(str(tag).strip() for tag in (live.get("includeOnlyMarketTags") or []) if str(tag).strip()),
              "USE_LIMIT_ORDERS": str(bool(live.get("useLimitOrders", True))).lower(),
              "LIVE_CROSS_PORTFOLIO_RISK_DIVERSIFICATION": str(bool(system.get("crossLivePortfolioRiskDiversification", True))).lower(),
              "LIVE_PORTFOLIO_ID": portfolio_id,
              "LIVE_EXECUTION_STATE_PATH": execution_path,
              "LIVE_EXECUTION_STATE_URL": execution_url,
              "LIVE_EXECUTION_PUBLISH_FILE": execution_publish_file,
          }
          if live.get("executionTrigger") == "after_scrape":
              if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
                  mapping["LIVE_SKIP_SCHEDULED_EXECUTION"] = "true"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in mapping.items():
                  if value is None or value == "":
                      continue
                  print(f"{key}={value}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Show effective live execution settings
        run: |
          echo "Live execution trigger: ${LIVE_EXECUTION_TRIGGER}"
          echo "Live selection order: ${LIVE_SELECTION_ORDER}"

      - name: Generate fresh live account snapshot
        working-directory: trading
        run: npm run live:account

      - name: Restore live execution run history
        working-directory: trading
        env:
          # The runner starts from a clean checkout. Restore the hosted log
          # before the executor appends this decision, otherwise each run
          # would replace the full history with a single row.
          LIVE_RUN_LOG_RECOVER: "false"
          LIVE_CONFIRMED_MANUAL_RUN_IDS: "30846520601,30885038395"
        run: node tools/restore-live-execution-history.mjs

      - name: Verify current market and maybe submit live order
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
          # The preceding sync has just fetched the CLOB balance and open
          # orders. Execute against that local snapshot, not a potentially
          # older copy that is still being served from the hosting.
        run: |
          LIVE_STATE_URL=data/live-state.json LIVE_EXECUTION_STATE_URL="$LIVE_EXECUTION_STATE_PATH" npm run live:execute -- --confirm-live

      - name: Refresh live account snapshot after execution
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Complete filled rotation immediately
        if: always()
        working-directory: trading
        env:
          POLYMARKET_DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live_confirm) || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-limit-order-test]'))) && 'false' || 'true' }}
          # Tells the executor this pass is the second half of a rotation, so the sell
          # and the replacement buy are recorded as one run instead of two rows.
          LIVE_ROTATION_COMPLETION: "true"
        run: |
          if node -e 'const fs = require("fs"); const path = process.env.LIVE_EXECUTION_STATE_PATH; const state = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : {}; process.exit(state.action === "ROTATION_EXIT_SUBMITTED" ? 0 : 1)'; then
            echo "Rotation exit accepted. Revalidating the synced account for an immediate replacement order."
            LIVE_STATE_URL=data/live-state.json LIVE_EXECUTION_STATE_URL="$LIVE_EXECUTION_STATE_PATH" npm run live:execute -- --confirm-live
          else
            echo "No accepted live rotation exit in this run; immediate replacement is not needed."
          fi

      - name: Refresh live account snapshot after rotation check
        if: always()
        working-directory: trading
        run: npm run live:account

      - name: Persist current live market verification into evaluation state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
        # Shared with the 5050 portfolio. It was a heredoc here and absent there, so a
        # market 5050 found gone was never closed out of its candidate list.
        run: LIVE_EXECUTION_STATE_FILE="trading/${LIVE_EXECUTION_STATE_PATH}" python3 trading/tools/persist-live-revalidation.py

      # Reads the hosted state, not the local copy the executor just wrote. The upload
      # replaces the hosted file outright, so a run that started from an empty local log
      # would publish that empty log over the real history. This makes the file about to be
      # uploaded a superset of the one it replaces.
      #
      # The URL is set on the command line rather than in an `env:` block because it is now
      # per-portfolio: it follows whichever portfolio this run is executing.
      - name: Merge published run-log history before upload
        if: always()
        working-directory: trading
        run: LIVE_EXECUTION_PUBLISHED_STATE_URL="$LIVE_EXECUTION_STATE_URL" node tools/merge-live-execution-history.mjs

      - name: Upload live state
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          # Read back over the web what was just uploaded. An FTP upload can report
          # success while the file lands where nothing serves it, which is how the 5050
          # portfolio's run log stayed missing for days with every step passing.
          PUBLISH_VERIFY_BASE_URL: https://osobnizkusenosti.cz/trading/data
          # live-state.json is what the run exists to publish, so a run that did not
          # generate it fails; the execution state is published first so the run log
          # survives even if the larger account snapshot cannot be uploaded.
          PUBLISH_REQUIRED: live-state.json
        run: PUBLISH_FILES="${LIVE_EXECUTION_PUBLISH_FILE},trading/data/live-state.json>live-state.json" python3 trading/tools/publish-execution-state.py

      # The decision is printed at the START of the execution step, so on a long run it
      # falls outside the window a log reader can fetch and the run becomes unexplainable
      # from the outside. Reprinting a compact digest as the LAST thing the job does means
      # a run can always be explained from its timestamp alone, without opening the UI.
      - name: Run digest
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("trading") / os.environ["LIVE_EXECUTION_STATE_PATH"]
          if not path.exists():
              print("RUN DIGEST: no live execution state was produced by this run.")
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding="utf-8"))
          batch = state.get("batchLog") or {}

          def money(value):
              try:
                  return f"{float(value):.4f}"
              except (TypeError, ValueError):
                  return "-"

          # The dashboard labels a run by this timestamp in local time, and it is minutes
          # later than the workflow's own start time -- so matching a reported run time
          # against when the run started finds the wrong run, or none at all. Print the
          # dashboard's own label next to the UTC value so a reported time is greppable.
          def dashboard_time(value):
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except ValueError:
                  return "-"
              return parsed.astimezone(ZoneInfo("Europe/Prague")).strftime("%d. %m. %Y %H:%M")

          print("=== RUN DIGEST ===")
          print(f"generatedAt : {state.get('generatedAt')} (dashboard {dashboard_time(state.get('generatedAt'))})")
          print(f"action      : {state.get('action')}")
          print(f"reason      : {state.get('reason')}")

          capital = batch.get("capital") or {}
          if capital:
              print("capital     : "
                    f"available {money(capital.get('availableUsdc'))} / "
                    f"required {money(capital.get('requiredStakeUsdc'))} / "
                    f"insufficient={capital.get('insufficientCapital')}")

          counts = batch.get("counts") or {}
          if counts:
              # The grouped prefilter reasons are printed on their own line rather than
              # inline: they are a dict, and folding a dict into the comma-joined counts
              # line made it unreadable exactly when it mattered.
              prefilter_reasons = counts.pop("prefilterRejectionReasons", None) or {}
              print("counts      : " + ", ".join(f"{k}={v}" for k, v in counts.items()))
              # Without this a run said a thousand candidates were dropped before
              # revalidation and nothing about which rule dropped them, so a candidate
              # sitting on the dashboard but missing from the run could not be explained.
              if prefilter_reasons:
                  ordered = sorted(prefilter_reasons.items(), key=lambda kv: -int(kv[1] or 0))
                  print("prefilter   : " + ", ".join(f"{k} x{v}" for k, v in ordered[:12]))

          # The per-position rotation reasons are the part that is otherwise invisible:
          # the outer verdict alone never says why each position was kept.
          review = state.get("rotationReview") or batch.get("rotationReview") or {}
          if review:
              print(f"rotation    : {review.get('action')} - {review.get('reason')}")
              for entry in (review.get("reviews") or [])[:12]:
                  position = entry.get("position") or {}
                  candidate = entry.get("candidate") or {}
                  print(f"  - {str(position.get('question'))[:58]!r} [{position.get('outcome')}]")
                  print(f"      {entry.get('action')}: {str(entry.get('reason'))[:200]}")
                  if candidate:
                      print(f"      tried: {str(candidate.get('question'))[:58]!r} [{candidate.get('outcome')}]")

          # Every resting order is reviewed for repricing or replacement -- cancelling one
          # frees its whole notional with no exit fee. Only a count of them was reported,
          # so a run looked like it had considered a single holding when it had considered
          # several, and there was no way to see why each order was kept.
          #
          # This line used to read "reviewed for rotation", which is the same conflation
          # the dashboard made: position rotation is a different review, gated on the
          # portfolio's rotation switch, and reporting order reviews under its name made a
          # portfolio with rotation switched off look like it was rotating positions anyway.
          order_reviews = state.get("openOrderReviews") or batch.get("openOrderReviews") or []
          if order_reviews:
              print(f"open orders : {len(order_reviews)} reviewed for repricing or replacement")
              for entry in order_reviews[:12]:
                  order = entry.get("order") or entry
                  candidate = entry.get("betterCandidate") or entry.get("candidate") or {}
                  print(f"  - {str(order.get('question'))[:58]!r} [{order.get('outcome')}]")
                  print(f"      {entry.get('action')}: {str(entry.get('reason'))[:200]}")
                  if candidate:
                      print(f"      tried: {str(candidate.get('question'))[:58]!r} [{candidate.get('outcome')}]")

          for entry in (batch.get("topRejected") or [])[:8]:
              reasons = entry.get("rejectReasons") or []
              print(f"rejected    : {str(entry.get('question'))[:58]!r} -> {'; '.join(str(r) for r in reasons)[:160]}")

          for attempt in (state.get("attempts") or [])[:4]:
              print(f"attempt     : {attempt.get('side')} {attempt.get('orderSize')} @ {attempt.get('orderPrice')} "
                    f"-> {attempt.get('action')} {attempt.get('responseError') or ''}")
              for path in (attempt.get("exitPaths") or []):
                  print(f"      via {path.get('path')}: {path.get('error') or path.get('status') or 'accepted'}")
          print("=== END RUN DIGEST ===")
          PY

      - name: Send redeem alert emails
        id: redeem_alerts
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request

          request = urllib.request.Request(
              "https://osobnizkusenosti.cz/trading/api.php?action=send-redeem-alerts",
              data=b"",
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          if not payload.get("ok") or int(payload.get("failedCount") or 0) > 0:
              sys.exit("Redeem alert email sending failed")
          PY

      - name: Report redeem alert warning
        if: always() && steps.redeem_alerts.outcome == 'failure'
        run: |
          echo "::warning::Redeem alert delivery failed after the trading decision. The order result and account synchronization were not affected."
