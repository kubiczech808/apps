name: Deploy Email Campaign

on:
  push:
    branches:
      - main
      - master
      - claude/energy-consumption-app-Nf7bh
    paths:
      - 'email-campaign/**'
      - '.github/workflows/email-campaign-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create app config from secrets
        env:
          APP_DATABASE_DRIVER: mysql
          APP_DATABASE_HOST: localhost
          APP_DATABASE_PORT: 3306
          APP_DATABASE_NAME: ${{ secrets.APP_DATABASE_NAME }}
          APP_DATABASE_USERNAME: ${{ secrets.APP_DATABASE_USERNAME }}
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD }}
          CAMPAIGN_CRON_INTERVAL_MINUTES: 5
          CAMPAIGN_SEND_DELAY_SECONDS: 2
          BTCDCA_GOOGLE_CLIENT_ID: ${{ secrets.BTCDCA_GOOGLE_CLIENT_ID }}
          BTCDCA_GOOGLE_SECRET: ${{ secrets.BTCDCA_GOOGLE_SECRET }}
          BTCDCA_AUTH_SECRET: ${{ secrets.BTCDCA_AUTH_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -z "$APP_DATABASE_NAME" ] || [ -z "$APP_DATABASE_USERNAME" ] || [ -z "$APP_DATABASE_PASSWORD" ]; then
            echo "MySQL database secrets are required for email-campaign deploy."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import os

          def s(value):
              return "'" + (value or "").replace("\\", "\\\\").replace("'", "\\'") + "'"

          port = int(os.environ.get("APP_DATABASE_PORT") or "3306")
          cron_material = "email-campaign-cron:" + os.environ.get("APP_DATABASE_NAME", "") + ":" + os.environ.get("APP_DATABASE_USERNAME", "") + ":" + os.environ.get("APP_DATABASE_PASSWORD", "")
          cron_token = hashlib.sha256(cron_material.encode("utf-8")).hexdigest()
          content = f"""<?php

          return [
              'app_password_hash' => '',
              'cron_token' => {s(cron_token)},
              'campaign_cron_interval_minutes' => {int(os.environ.get("CAMPAIGN_CRON_INTERVAL_MINUTES") or "5")},
              'campaign_send_delay_seconds' => {int(os.environ.get("CAMPAIGN_SEND_DELAY_SECONDS") or "2")},
              'from_email' => 'newsletter@osobnizkusenosti.cz',
              'from_name' => 'Osobni zkusenosti',
              'smtp' => [
                  'host' => 'smtp.example.com',
                  'port' => 587,
                  'username' => 'newsletter@osobnizkusenosti.cz',
                  'password' => 'smtp-password',
                  'encryption' => 'tls',
              ],
              'google' => [
                  'client_id' => {s(os.environ.get("BTCDCA_GOOGLE_CLIENT_ID"))},
                  'client_secret' => {s(os.environ.get("BTCDCA_GOOGLE_SECRET"))},
                  'auth_secret' => {s(os.environ.get("BTCDCA_AUTH_SECRET"))},
                  'redirect_uri' => 'https://www.btc-dca.com/app/auth/google/callback',
                  'app_url' => 'https://www.btc-dca.com',
              ],
              'stripe' => [
                  'secret_key' => {s(os.environ.get("STRIPE_SECRET_KEY"))},
                  'publishable_key' => {s(os.environ.get("STRIPE_PUBLISHABLE_KEY"))},
                  'price_id' => {s(os.environ.get("STRIPE_PRICE_ID"))},
              ],
              'ai' => [
                  'openai_api_key' => {s(os.environ.get("OPENAI_API_KEY"))},
                  'openai_model' => {s(os.environ.get("OPENAI_MODEL") or "gpt-4.1")},
              ],
              'database' => [
                  'driver' => 'mysql',
                  'host' => {s(os.environ.get("APP_DATABASE_HOST"))},
                  'port' => {port},
                  'name' => {s(os.environ.get("APP_DATABASE_NAME"))},
                  'username' => {s(os.environ.get("APP_DATABASE_USERNAME"))},
                  'password' => {s(os.environ.get("APP_DATABASE_PASSWORD"))},
                  'charset' => 'utf8mb4',
              ],
          ];
          """
          with open("email-campaign/config.php", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Lint PHP files
        run: |
          php -v
          find email-campaign -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTING_FTP_SERVER }}
          username: ${{ secrets.HOSTING_FTP_USERNAME }}
          password: ${{ secrets.HOSTING_FTP_PASSWORD }}
          local-dir: ./email-campaign/
          server-dir: /www/email-campaign/
          exclude: |
            **/.git*

      - name: Send onboarding demo invite
        env:
          APP_DATABASE_NAME: ${{ secrets.APP_DATABASE_NAME }}
          APP_DATABASE_USERNAME: ${{ secrets.APP_DATABASE_USERNAME }}
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD }}
        run: |
          python3 - <<'PY' > /tmp/email_campaign_cron_token
          import hashlib
          import os
          material = "email-campaign-cron:" + os.environ.get("APP_DATABASE_NAME", "") + ":" + os.environ.get("APP_DATABASE_USERNAME", "") + ":" + os.environ.get("APP_DATABASE_PASSWORD", "")
          print(hashlib.sha256(material.encode("utf-8")).hexdigest())
          PY
          token="$(cat /tmp/email_campaign_cron_token)"
          url="https://www.osobnizkusenosti.cz/email-campaign/?cron=${token}&send_onboarding_demo=1"
          http_code="$(curl --silent --show-error --max-time 120 --output /tmp/onboarding_demo_invite.txt --write-out "%{http_code}" "$url" || true)"
          cat /tmp/onboarding_demo_invite.txt || true
          if ! [[ "$http_code" =~ ^[0-9]+$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Onboarding demo invite endpoint returned HTTP ${http_code}."
          fi
