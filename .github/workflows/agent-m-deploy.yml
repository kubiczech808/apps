name: Agent M — Deploy Bot to RPi

on:
  push:
    branches:
      - claude/multi-platform-auto-poster-p3uBn
    paths:
      - 'medium-poster/agent_m/**'
      - 'medium-poster/pyproject.toml'
      - 'medium-poster/data/feedback.json'
      - 'scripts/agent-m-bot.sh'
      - 'scripts/agent-m-bot.service'
      - '.github/agent-m-deploy-trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/multi-platform-auto-poster-p3uBn

      - name: Copy bot script and service
        run: |
          mkdir -p /home/jakub/scripts
          cp scripts/agent-m-bot.sh /home/jakub/scripts/agent-m-bot.sh
          cp scripts/agent-m-bot.service /home/jakub/scripts/agent-m-bot.service
          chmod +x /home/jakub/scripts/agent-m-bot.sh

      - name: Sync code to deploy dir
        run: |
          mkdir -p /home/jakub/apps/medium-poster
          rsync -a --delete \
            medium-poster/ /home/jakub/apps/medium-poster/ \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'data/medium_cookies.json' \
            --exclude 'data/hashnode_cookies.json' \
            --exclude 'data/history.json'

      - name: Create .env
        run: |
          printf '%s\n' \
            "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY_M }}" \
            "TELEGRAM_BOT_TOKEN=${{ secrets.M_TELEGRAM_TOKEN }}" \
            "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.M_TELEGRAM_CHAT_ID }}" \
            "GITHUB_PAT=${{ secrets.PAT_GITHUB_MEDIUM }}" \
            "DEVTO_API_KEY=${{ secrets.DEVTO_API_KEY }}" \
            "HASHNODE_TOKEN=" \
            "HASHNODE_PUBLICATION_ID=" \
            "HASHNODE_PLAYWRIGHT=false" \
            "MEDIUM_PLAYWRIGHT=true" \
            "MEDIUM_TOKEN=" \
            "GITHUB_PAGES_REPO=kubiczech808/apps" \
            "GITHUB_PAGES_BRANCH=gh-pages" \
            "SITE_URL=https://btc-dca.com" \
            "SITE_NAME=btc-dca.com" \
            "PUBLISH_HOUR=5" \
            "PUBLISH_MINUTE=25" \
            "LOG_LEVEL=INFO" > /home/jakub/apps/medium-poster/.env

      - name: Restart bot
        id: restart
        continue-on-error: true
        run: |
          bash /home/jakub/scripts/agent-m-bot.sh 2>&1 | tee /tmp/deploy.log

      - name: Run pipeline test (draft)
        id: test_pipeline
        if: hashFiles('.github/agent-m-test-trigger.txt') != ''
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd /home/jakub/apps/medium-poster
          source .venv/bin/activate
          sudo systemctl stop agent-m-bot 2>/dev/null || true
          sleep 3
          python -u -c "
          import asyncio, logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(name)s: %(message)s')
          from agent_m.pipeline import run_pipeline
          async def main():
              result = await run_pipeline(mode='draft')
              print()
              print('=== PIPELINE TEST RESULT ===')
              print(f'Title: {result.article.title}')
              print(f'Published to: {\", \".join(result.published_to) or \"none\"}')
              for name, url in result.platform_urls.items():
                  print(f'{name}: {url}')
              if result.image_url:
                  print(f'Cover image: {result.image_url}')
              if result.image_bytes:
                  print(f'Image size: {len(result.image_bytes)} bytes')
              if result.platform_errors:
                  print('Errors:')
                  for e in result.platform_errors:
                      print(f'  - {e}')
              print('=== END ===')
          asyncio.run(main())
          " 2>&1 | tee /tmp/agent-m-test.log
          sudo systemctl start agent-m-bot

      - name: Diagnostics
        id: diag
        if: always()
        run: |
          echo "=== Systemd service ===" > /tmp/diag.log
          systemctl status agent-m-bot --no-pager >> /tmp/diag.log 2>&1 || echo "Service not installed" >> /tmp/diag.log
          echo "" >> /tmp/diag.log
          echo "=== Bot process ===" >> /tmp/diag.log
          ps aux | grep agent_m | grep -v grep >> /tmp/diag.log 2>&1 || echo "No agent_m process" >> /tmp/diag.log
          echo "" >> /tmp/diag.log
          echo "=== .env keys (masked) ===" >> /tmp/diag.log
          sed 's/=.*/=***/' /home/jakub/apps/medium-poster/.env >> /tmp/diag.log 2>&1 || echo "No .env" >> /tmp/diag.log
          echo "" >> /tmp/diag.log
          echo "=== Telegram API test ===" >> /tmp/diag.log
          RESP=$(curl -s "https://api.telegram.org/bot${{ secrets.M_TELEGRAM_TOKEN }}/getMe")
          echo "$RESP" >> /tmp/diag.log
          echo "" >> /tmp/diag.log
          echo "=== Previous bot log (last 120 lines before restart) ===" >> /tmp/diag.log
          if [ -f /tmp/agent-m-bot.log.prev ]; then
            wc -l /tmp/agent-m-bot.log.prev >> /tmp/diag.log 2>&1
            tail -120 /tmp/agent-m-bot.log.prev | cut -c1-300 | sed 's/key=[A-Za-z0-9_-]\{20,\}/key=***/g' | sed 's/bot[0-9]\{8,\}:[A-Za-z0-9_-]\{30,\}/bot***:.***/g' >> /tmp/diag.log 2>&1
          else
            echo "No previous log" >> /tmp/diag.log
          fi
          echo "" >> /tmp/diag.log
          echo "=== Current bot log (wait 10s, last 30 lines) ===" >> /tmp/diag.log
          sleep 10
          wc -l /tmp/agent-m-bot.log >> /tmp/diag.log 2>&1 || echo "No bot log" >> /tmp/diag.log
          tail -30 /tmp/agent-m-bot.log | cut -c1-300 | sed 's/key=[A-Za-z0-9_-]\{20,\}/key=***/g' | sed 's/bot[0-9]\{8,\}:[A-Za-z0-9_-]\{30,\}/bot***:.***/g' >> /tmp/diag.log 2>&1 || echo "No bot log" >> /tmp/diag.log
          echo "" >> /tmp/diag.log
          echo "=== Medium cookies ===" >> /tmp/diag.log
          if [ -f /home/jakub/apps/medium-poster/data/medium_cookies.json ]; then
            SIZE=$(wc -c < /home/jakub/apps/medium-poster/data/medium_cookies.json)
            COUNT=$(python3 -c "import json; print(len(json.load(open('/home/jakub/apps/medium-poster/data/medium_cookies.json'))))" 2>/dev/null || echo "INVALID")
            echo "medium_cookies.json: ${SIZE} bytes, ${COUNT} cookies" >> /tmp/diag.log
          else
            echo "medium_cookies.json: NOT FOUND" >> /tmp/diag.log
          fi

      - name: Write deploy result to debug issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const mask = s => s
              .replace(/key=[A-Za-z0-9_-]{20,}/g, 'key=***')
              .replace(/bot\d{8,}:[A-Za-z0-9_-]{30,}/g, 'bot***:***')
              .replace(/token=[A-Za-z0-9_-]{20,}/g, 'token=***')
              .replace(/AIzaSy[A-Za-z0-9_-]{30,}/g, '***');
            let log = 'No log';
            try { log = fs.readFileSync('/tmp/deploy.log', 'utf8'); } catch(e) {}
            let diag = '';
            try { diag = fs.readFileSync('/tmp/diag.log', 'utf8'); } catch(e) {}
            const tail = mask(log.split('\n').slice(-30).join('\n').substring(0,2000));
            let testLog = '';
            try { testLog = fs.readFileSync('/tmp/agent-m-test.log', 'utf8'); } catch(e) {}
            const testTail = testLog ? `\n\nPipeline test:\n\`\`\`\n${mask(testLog.split('\n').slice(-50).join('\n').substring(0,4000))}\n\`\`\`` : '';
            const body = `**Deploy ${new Date().toISOString()} | outcome: ${{ steps.restart.outcome }} | test: ${{ steps.test_pipeline.outcome || 'skipped' }}**\n\nLog:\n\`\`\`\n${tail}\n\`\`\`${testTail}\n\nDiagnostics:\n\`\`\`\n${mask(diag.substring(0,4000))}\n\`\`\``;
            const issues = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,labels:['agent-m-debug'],state:'open'});
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issues.data[0].number,body});
            }
