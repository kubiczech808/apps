name: Agent M — Deploy Bot to RPi

on:
  push:
    branches:
      - claude/multi-platform-auto-poster-p3uBn
    paths:
      - 'medium-poster/agent_m/**'
      - 'medium-poster/pyproject.toml'
      - 'medium-poster/data/feedback.json'
      - 'scripts/agent-m-bot.sh'
      - '.github/agent-m-deploy-trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/multi-platform-auto-poster-p3uBn

      - name: Copy bot script
        run: |
          mkdir -p /home/openclaw2/scripts
          cp scripts/agent-m-bot.sh /home/openclaw2/scripts/agent-m-bot.sh
          chmod +x /home/openclaw2/scripts/agent-m-bot.sh

      - name: Sync code to deploy dir
        run: |
          mkdir -p /home/openclaw2/apps/medium-poster
          rsync -a --delete \
            medium-poster/ /home/openclaw2/apps/medium-poster/ \
            --exclude '.venv' \
            --exclude '__pycache__'

      - name: Restart bot
        id: restart
        continue-on-error: true
        run: |
          bash /home/openclaw2/scripts/agent-m-bot.sh 2>&1 | tee /tmp/deploy.log

      - name: Write deploy result to debug issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'No log';
            try { log = fs.readFileSync('/tmp/deploy.log', 'utf8'); } catch(e) {}
            const tail = log.split('\n').slice(-30).join('\n').substring(0,2000);
            const body = `**Deploy ${new Date().toISOString()} | outcome: ${{ steps.restart.outcome }}**\n\nLog:\n\`\`\`\n${tail}\n\`\`\``;
            const issues = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,labels:['agent-m-debug'],state:'open'});
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issues.data[0].number,body});
            }
