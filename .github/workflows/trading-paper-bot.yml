name: Trading Paper Bot

on:
  push:
    paths:
      - 'trading/tools/paper-trading-bot.mjs'
      - 'trading/package.json'
      - '.github/workflows/trading-paper-bot.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - refresh
          - report
      manual_run_once:
        description: "Manual Run once request; bypasses new-trade cadence only"
        required: false
        default: "false"
        type: string
      paper_strategy_id:
        description: "Optional paper portfolio to execute for manual Run once"
        required: false
        default: ""
        type: string
      paper_max_order_fraction:
        description: "Maximum stake per paper trade as fraction of portfolio, decimal 0.01-0.50"
        required: false
        default: "0.05"
        type: string
      paper_conservative_min_probability:
        description: "Conservative AI probability threshold, decimal 0.01-0.99"
        required: false
        default: "0.95"
        type: string
      paper_high_reward_min_probability:
        description: "High reward AI probability threshold, decimal 0.01-0.99"
        required: false
        default: "0.60"
        type: string
      paper_more_probable_min_probability:
        description: "More probable AI probability threshold, decimal 0.01-0.99"
        required: false
        default: "0.60"
        type: string
      paper_conservative_max_order_fraction:
        description: "Conservative max stake fraction"
        required: false
        default: ""
        type: string
      paper_high_reward_max_order_fraction:
        description: "High reward max stake fraction"
        required: false
        default: ""
        type: string
      paper_more_probable_max_order_fraction:
        description: "More probable max stake fraction"
        required: false
        default: ""
        type: string
      paper_conservative_max_resolution_days:
        description: "Conservative max resolution days"
        required: false
        default: ""
        type: string
      paper_high_reward_max_resolution_days:
        description: "High reward max resolution days"
        required: false
        default: ""
        type: string
      paper_more_probable_max_resolution_days:
        description: "More probable max resolution days"
        required: false
        default: ""
        type: string
      paper_conservative_selection_order:
        description: "Conservative selection order"
        required: false
        default: ""
        type: string
      paper_high_reward_selection_order:
        description: "High reward selection order"
        required: false
        default: ""
        type: string
      paper_more_probable_selection_order:
        description: "More probable selection order"
        required: false
        default: ""
        type: string
      paper_conservative_min_liquidity_usdc:
        description: "Conservative min liquidity"
        required: false
        default: ""
        type: string
      paper_high_reward_min_liquidity_usdc:
        description: "High reward min liquidity"
        required: false
        default: ""
        type: string
      paper_more_probable_min_liquidity_usdc:
        description: "More probable min liquidity"
        required: false
        default: ""
        type: string
      paper_conservative_trade_cadence_hours:
        description: "Conservative new trade cadence in hours"
        required: false
        default: ""
        type: string
      paper_high_reward_trade_cadence_hours:
        description: "High reward new trade cadence in hours"
        required: false
        default: ""
        type: string
      paper_more_probable_trade_cadence_hours:
        description: "More probable new trade cadence in hours"
        required: false
        default: ""
        type: string
      paper_conservative_require_most_probable:
        description: "Conservative only multichoice events"
        required: false
        default: ""
        type: string
      paper_high_reward_require_most_probable:
        description: "High reward only multichoice events"
        required: false
        default: ""
        type: string
      paper_more_probable_require_most_probable:
        description: "More probable only multichoice events"
        required: false
        default: ""
        type: string
  schedule:
    - cron: '7 * * * *'
    - cron: '22,37,52 * * * *'
    - cron: '17 1 * * *'

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      PAPER_STATE_PATH: data/paper-state.json
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper
      PAPER_PORTFOLIO_USDC: "100"
      PAPER_MAX_FRACTION: ${{ github.event.inputs.paper_max_order_fraction || '0.05' }}
      PAPER_MIN_PROBABILITY: "0.95"
      PAPER_CONSERVATIVE_MIN_PROBABILITY: ${{ github.event.inputs.paper_conservative_min_probability || '0.95' }}
      PAPER_HIGH_REWARD_MIN_PROBABILITY: ${{ github.event.inputs.paper_high_reward_min_probability || '0.60' }}
      PAPER_MORE_PROBABLE_MIN_PROBABILITY: ${{ github.event.inputs.paper_more_probable_min_probability || '0.60' }}
      PAPER_CONSERVATIVE_MAX_FRACTION: ${{ github.event.inputs.paper_conservative_max_order_fraction || '' }}
      PAPER_HIGH_REWARD_MAX_FRACTION: ${{ github.event.inputs.paper_high_reward_max_order_fraction || '' }}
      PAPER_MORE_PROBABLE_MAX_FRACTION: ${{ github.event.inputs.paper_more_probable_max_order_fraction || '' }}
      PAPER_CONSERVATIVE_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.paper_conservative_max_resolution_days || '' }}
      PAPER_HIGH_REWARD_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.paper_high_reward_max_resolution_days || '' }}
      PAPER_MORE_PROBABLE_MAX_RESOLUTION_DAYS: ${{ github.event.inputs.paper_more_probable_max_resolution_days || '' }}
      PAPER_CONSERVATIVE_SELECTION_ORDER: ${{ github.event.inputs.paper_conservative_selection_order || '' }}
      PAPER_HIGH_REWARD_SELECTION_ORDER: ${{ github.event.inputs.paper_high_reward_selection_order || '' }}
      PAPER_MORE_PROBABLE_SELECTION_ORDER: ${{ github.event.inputs.paper_more_probable_selection_order || '' }}
      PAPER_CONSERVATIVE_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.paper_conservative_min_liquidity_usdc || '' }}
      PAPER_HIGH_REWARD_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.paper_high_reward_min_liquidity_usdc || '' }}
      PAPER_MORE_PROBABLE_MIN_LIQUIDITY_USDC: ${{ github.event.inputs.paper_more_probable_min_liquidity_usdc || '' }}
      PAPER_CONSERVATIVE_TRADE_CADENCE_HOURS: ${{ github.event.inputs.paper_conservative_trade_cadence_hours || '' }}
      PAPER_HIGH_REWARD_TRADE_CADENCE_HOURS: ${{ github.event.inputs.paper_high_reward_trade_cadence_hours || '' }}
      PAPER_MORE_PROBABLE_TRADE_CADENCE_HOURS: ${{ github.event.inputs.paper_more_probable_trade_cadence_hours || '' }}
      PAPER_CONSERVATIVE_REQUIRE_MOST_PROBABLE: ${{ github.event.inputs.paper_conservative_require_most_probable || '' }}
      PAPER_HIGH_REWARD_REQUIRE_MOST_PROBABLE: ${{ github.event.inputs.paper_high_reward_require_most_probable || '' }}
      PAPER_MORE_PROBABLE_REQUIRE_MOST_PROBABLE: ${{ github.event.inputs.paper_more_probable_require_most_probable || '' }}
      PAPER_MIN_ANNUAL_RETURN: "0.05"
      PAPER_OPPORTUNITY_MIN_PROBABILITY: "0.60"
      PAPER_OPPORTUNITY_MIN_EDGE: "0.04"
      PAPER_OPPORTUNITY_MIN_ANNUAL_RETURN: "0.30"
      PAPER_MAX_EVALUATIONS_PER_RUN: "80"
      PAPER_MAX_HISTORY: "5000"
      PAPER_MAX_SPREAD: "0.08"
      PAPER_MIN_VOLUME_24H: "100"
      PAPER_MAX_RESOLUTION_DAYS: "7"
      PAPER_AI_ANALYSIS_LIMIT: "6"
      PAPER_AI_STOP_ON_QUOTA_ERROR: "true"
      PAPER_AI_POSTMORTEM_LIMIT: "8"
      PAPER_REQUIRE_GEMINI: "true"
      PAPER_MANUAL_RUN_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_run_once == 'true' && 'true' || 'false' }}
      PAPER_STRATEGY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.paper_strategy_id || '' }}
      PAPER_REPORT_ONLY: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'report') }}
      PAPER_REFRESH_ONLY: ${{ !((github.event_name == 'schedule' && github.event.schedule == '17 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'report')) && ((github.event_name == 'schedule' && github.event.schedule != '7 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh')) }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_POLYMARKET || secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash' }}
      GEMINI_SEARCH_GROUNDING: "true"
      PAPER_PRIMARY_AI_PROVIDER: gemini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify paper bot target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-paper-bot.yml trading; then
            echo "Trading paper bot must not target email-campaign."
            exit 1
          fi

      - name: Load portfolio config
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config"
          try:
              payload = json.loads(urllib.request.urlopen(url, timeout=20).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable: {exc}")
              raise SystemExit(0)

          config = payload.get("config") or {}
          paper = config.get("paper") or {}
          mapping = {
              "conservative": "PAPER_CONSERVATIVE",
              "highReward": "PAPER_HIGH_REWARD",
              "moreProbable": "PAPER_MORE_PROBABLE",
          }
          def emit(key, value):
              if value is None or value == "":
                  return
              print(f"{key}={value}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          for strategy, prefix in mapping.items():
              row = paper.get(strategy) or {}
              emit(f"{prefix}_MIN_PROBABILITY", row.get("minProbability"))
              emit(f"{prefix}_MAX_FRACTION", row.get("maxOrderFraction"))
              emit(f"{prefix}_MAX_RESOLUTION_DAYS", row.get("maxResolutionDays"))
              emit(f"{prefix}_SELECTION_ORDER", row.get("selectionOrder"))
              emit(f"{prefix}_MIN_LIQUIDITY_USDC", row.get("minLiquidityUsdc"))
              emit(f"{prefix}_TRADE_CADENCE_HOURS", row.get("tradeCadenceHours"))
              emit(f"{prefix}_REQUIRE_MOST_PROBABLE", str(bool(row.get("requireMostProbableOutcome"))).lower())
          PY

      - name: Run paper bot
        working-directory: trading
        run: npm run paper:bot

      - name: Upload paper state
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          PAPER_STATE_FILE: trading/data/paper-state.json
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          target = os.environ["TRADING_FTP_DIR"].strip("/")
          state_file = Path(os.environ["PAPER_STATE_FILE"])

          if not state_file.exists():
              raise SystemExit("paper-state.json was not generated")

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(server, timeout=30) as ftp:
              ftp.login(username, password)
              enter_dir(ftp, target.split("/"))
              tmp_name = "paper-state.json.uploading"
              with state_file.open("rb") as handle:
                  ftp.storbinary(f"STOR {tmp_name}", handle)
              try:
                  ftp.rename(tmp_name, "paper-state.json")
              except ftplib.all_errors:
                  ftp.delete("paper-state.json")
                  ftp.rename(tmp_name, "paper-state.json")
          PY
