name: Trading Paper Bot

on:
  # Portfolio cron cadence is evaluated independently of market scans. A scan can be
  # delayed by GitHub or fail without preventing enabled cron portfolios from checking
  # their already-published shortlist. The bot itself enforces each portfolio's saved
  # executionCronMinutes, so this lightweight poll does not open trades every 10 minutes.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    paths:
      - 'trading/tools/paper-trading-bot.mjs'
      - 'trading/package.json'
      - '.github/workflows/trading-paper-bot.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - repair
          - reset
          - restore
          - adjust_capital
          - set_capital_adjustment_at
          - refresh
          - report
          - after_scan
      manual_run_once:
        description: "Manual Run once request"
        required: false
        default: "false"
        type: string
      paper_strategy_id:
        description: "Optional paper portfolio to execute for manual Run once"
        required: false
        default: ""
        type: string
      paper_target_equity_usdc:
        description: "adjust_capital mode: the equity this portfolio's baseline should be rebased to"
        required: false
        default: "100"
        type: string
      paper_capital_adjustment_at_iso:
        description: "set_capital_adjustment_at mode: ISO timestamp (UTC) the rebase actually happened at"
        required: false
        default: ""
        type: string
      paper_max_order_fraction:
        description: "Maximum stake per paper trade as fraction of portfolio, decimal 0.01-0.50"
        required: false
        default: "0.05"
        type: string
      paper_stake_usdc:
        description: "Fixed maximum stake per paper trade in USDC"
        required: false
        default: "5"
        type: string
concurrency:
  group: trading-paper-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      PAPER_STATE_PATH: data/paper-state.json
      PAPER_SCAN_HISTORY_ENTRY_PATH: data/market-scan-history-entry.ndjson
      PAPER_STATE_URL: https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=refresh
      PAPER_REFRESH_STATE_URL: "https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper&summary=refresh"
      PAPER_STATIC_STATE_URL: https://osobnizkusenosti.cz/trading/data/paper-state.json
      NODE_OPTIONS: --max-old-space-size=6144
      PAPER_PORTFOLIO_USDC: "100"
      PAPER_MAX_FRACTION: ${{ github.event.inputs.paper_max_order_fraction || '0.05' }}
      PAPER_STAKE_USDC: ${{ github.event.inputs.paper_stake_usdc || '5' }}
      PAPER_MIN_PROBABILITY: "0.95"
      # Fallbacks only. Every per-strategy value below is set from
      # portfolio-config.json by the "Load portfolio config" step, which appends to
      # GITHUB_ENV and therefore overrides this job-level env for every later step --
      # so these were already unreachable whenever the dashboard had saved a value.
      # They used to be workflow_dispatch inputs as well, which is what pushed the file
      # past GitHub's hard ceiling of 25 inputs; above that GitHub refuses to parse the
      # whole workflow, so every dispatch answered 422 and the schedule stopped firing.
      # A portfolio's settings belong in the saved config, never in a dispatch input.
      PAPER_CONSERVATIVE_MIN_PROBABILITY: "0.95"
      PAPER_HIGH_REWARD_MIN_PROBABILITY: '0.60'
      PAPER_MORE_PROBABLE_MIN_PROBABILITY: '0.60'
      PAPER_EQUAL_MIN_PROBABILITY: "0.75"
      PAPER_CONSERVATIVE_MAX_FRACTION: ""
      PAPER_HIGH_REWARD_MAX_FRACTION: ""
      PAPER_MORE_PROBABLE_MAX_FRACTION: ""
      PAPER_CONSERVATIVE_MAX_RESOLUTION_DAYS: ""
      PAPER_HIGH_REWARD_MAX_RESOLUTION_DAYS: ""
      PAPER_MORE_PROBABLE_MAX_RESOLUTION_DAYS: ""
      PAPER_CONSERVATIVE_SELECTION_ORDER: ""
      PAPER_HIGH_REWARD_SELECTION_ORDER: ""
      PAPER_MORE_PROBABLE_SELECTION_ORDER: ""
      PAPER_CONSERVATIVE_MIN_LIQUIDITY_USDC: ""
      PAPER_HIGH_REWARD_MIN_LIQUIDITY_USDC: ""
      PAPER_MORE_PROBABLE_MIN_LIQUIDITY_USDC: ""
      PAPER_CONSERVATIVE_REQUIRE_MOST_PROBABLE: ""
      PAPER_HIGH_REWARD_REQUIRE_MOST_PROBABLE: ""
      PAPER_MORE_PROBABLE_REQUIRE_MOST_PROBABLE: ""
      # The portfolios rank on Polymarket's own quoted probability; no model is consulted.
      PAPER_CONSERVATIVE_PROBABILITY_SOURCE: "polymarket"
      PAPER_HIGH_REWARD_PROBABILITY_SOURCE: "polymarket"
      PAPER_MORE_PROBABLE_PROBABILITY_SOURCE: "polymarket"
      PAPER_EQUAL_PROBABILITY_SOURCE: "polymarket"
      PAPER_MIN_ANNUAL_RETURN: "0.05"
      PAPER_OPPORTUNITY_MIN_PROBABILITY: "0.60"
      PAPER_OPPORTUNITY_MIN_EDGE: "0.04"
      PAPER_OPPORTUNITY_MIN_ANNUAL_RETURN: "0.30"
      PAPER_MAX_EVALUATIONS_PER_RUN: "80"
      PAPER_MAX_HISTORY: "5000"
      PAPER_CLOSED_TRADE_HISTORY_LIMIT: "300"
      PAPER_PORTFOLIO_RUN_LOG_LIMIT: "24"
      PAPER_EVALUATION_RUN_LOG_LIMIT: "24"
      PAPER_CALCULATION_REPORT_HISTORY_LIMIT: "6"
      PAPER_MARKET_SCAN_PAGE_SIZE: "500"
      PAPER_MARKET_SCAN_EVENT_BATCH_LIMIT: "500"
      # These were throttled to keep one monolithic state file small. The catalogue
      # is now published as separate segment files, so they are sized by what a
      # response can carry: measured at 5000 active + 3000 resolved, the heaviest
      # endpoint (scraped) peaks at 66 MB, inside a 128 MB limit.
      PAPER_MARKET_OBSERVATION_RETAIN_LIMIT: "5000"
      PAPER_MARKET_SCAN_AUDIT_ROW_LIMIT: "750"
      PAPER_MARKET_SCAN_HISTORY_LIMIT: "20"
      PAPER_MARKET_SCAN_AUDIT_HISTORY_LIMIT: "3"
      PAPER_MARKET_SCAN_DIVERSITY_LIQUIDITY_USDC: "40000"
      PAPER_MARKET_SCAN_LIQUIDITY_MIN: "0"
      PAPER_MARKET_SCAN_MAX_DAYS: "7"
      PAPER_MARKET_SCAN_MIN_PROBABILITY: "0.5"
      PAPER_MARKET_SCAN_MIN_RESOLUTION_MINUTES: "0"
      PAPER_MAX_SPREAD: "0.08"
      # How wide a bid/ask spread may be before a scraped row stops counting as a real
      # opportunity, in probability units: 0.05 is five points. Must match
      # MAX_TRADABLE_SPREAD in trading/api.php, which filters the same rows on the way out.
      PAPER_MAX_TRADABLE_SPREAD: "0.05"
      PAPER_MIN_VOLUME_24H: "100"
      PAPER_MAX_RESOLUTION_DAYS: "7"
      # Scraping runs every ten minutes. Grounded analysis, paper-trade
      # decisions and the independent calculation report run hourly.
      PAPER_AI_ANALYSIS_LIMIT: "2"
      PAPER_AI_CRITIC_ENABLED: "false"
      PAPER_AI_REQUEST_DELAY_MS: "7000"
      PAPER_AI_MIN_INTERVAL_SECONDS: "7"
      PAPER_AI_MAX_REQUESTS_PER_MINUTE: "10"
      PAPER_AI_MAX_INPUT_TOKENS_PER_MINUTE: "250000"
      PAPER_AI_MAX_REQUESTS_PER_HOUR: "600"
      PAPER_AI_MAX_REQUESTS_PER_DAY: "1500"
      PAPER_AI_EXECUTION_RESERVE_REQUESTS: "100"
      PAPER_AI_USAGE_HISTORY_LIMIT: "500"
      PAPER_AI_STOP_ON_QUOTA_ERROR: "true"
      PAPER_AI_POSTMORTEM_LIMIT: "1"
      PAPER_SCRAPED_SIMULATION_STAKE_USDC: "5"
      # Hourly result reconciliation: include stale SCRAPED rows whose stored
      # end date has passed, not only rows already labelled RESOLVED.
      PAPER_SCRAPED_SIMULATION_RESOLUTION_SYNC_LIMIT: "300"
      # Nothing may wait on a model memo that is never produced.
      PAPER_REQUIRE_GEMINI: "false"
      PAPER_EXECUTION_ONLY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'after_scan')) && 'true' || 'false' }}
      PAPER_COMPACT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'repair' && 'true' || 'false' }}
      PAPER_RESET_PORTFOLIO: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reset' && 'true' || 'false' }}
      # One-off undo for a reset dispatched by mistake. No UI surfaces this.
      PAPER_RESTORE_PORTFOLIO: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'restore' && 'true' || 'false' }}
      # One-off capital rebase: equity stays exactly what the trades compute, only the
      # baseline it is measured from is topped up. No UI surfaces this either.
      PAPER_ADJUST_CAPITAL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'adjust_capital' && 'true' || 'false' }}
      PAPER_TARGET_EQUITY_USDC: ${{ github.event_name == 'workflow_dispatch' && inputs.paper_target_equity_usdc || '100' }}
      # One-off backfill for a rebase dispatched before capitalAdjustmentAt existed. No UI
      # surfaces this either.
      PAPER_SET_CAPITAL_ADJUSTMENT_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'set_capital_adjustment_at' && 'true' || 'false' }}
      PAPER_CAPITAL_ADJUSTMENT_AT_ISO: ${{ github.event_name == 'workflow_dispatch' && inputs.paper_capital_adjustment_at_iso || '' }}
      PAPER_EXECUTION_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'after_scan' && 'after_scrape' || 'cron' }}
      PAPER_MANUAL_RUN_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_run_once == 'true' && 'true' || 'false' }}
      PAPER_STRATEGY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.paper_strategy_id || '' }}
      PAPER_REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'report' }}
      PAPER_REFRESH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh' }}
      PAPER_SCAN_ONLY: "false"
      # Market discovery has one owner: trading-market-scan.yml. It publishes a complete
      # state before dispatching this workflow in execution-only mode. A second scheduled
      # full paper pass used to repeat the scan plus the expensive resolution sync in the
      # same concurrency group, which delayed new scans by hours.
      PAPER_SCHEDULED_CADENCE: "false"
      PAPER_MARKET_SCAN_HOURLY_INTERVAL_MINUTES: "0"
      PAPER_FULL_CADENCE_MINUTES: "55"
      PAPER_REPORT_CADENCE_MINUTES: "55"
      PAPER_REFRESH_MARKET_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh' && inputs.paper_strategy_id || '' }}
      PAPER_CONTINUOUS_EVALUATION: "true"
      # Model credentials are deliberately not passed: the bot consults no model.
      PAPER_PRIMARY_AI_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify paper bot target
        run: |
          if grep -R -n -E "server-dir:.*email[-]campaign|local-dir:.*email[-]campaign|/www/email[-]campaign/" .github/workflows/trading-paper-bot.yml trading; then
            echo "Trading paper bot must not target email-campaign."
            exit 1
          fi

      - name: Load portfolio config
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = "https://osobnizkusenosti.cz/trading/api.php?action=portfolio-config"
          try:
              payload = json.loads(urllib.request.urlopen(url, timeout=20).read().decode("utf-8"))
          except Exception as exc:
              print(f"portfolio config unavailable: {exc}")
              raise SystemExit(0)

          config = payload.get("config") or {}
          paper = config.get("paper") or {}
          live = config.get("live") or {}
          mapping = {
              "conservative": "PAPER_CONSERVATIVE",
              "highReward": "PAPER_HIGH_REWARD",
              "moreProbable": "PAPER_MORE_PROBABLE",
              "equal": "PAPER_EQUAL",
          }
          def emit(key, value):
              if value is None or value == "":
                  return
              print(f"{key}={value}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          def stop_loss_multiplier(row, strategy):
              if isinstance(row, dict) and row.get("stopLossRiskMultiplier") is not None:
                  try:
                      value = float(row.get("stopLossRiskMultiplier"))
                      return max(0.0, min(3.0, round(value, 2)))
                  except (TypeError, ValueError):
                      pass
              enabled = bool(row.get("stopLossEnabled", strategy == "equal")) if isinstance(row, dict) else strategy == "equal"
              if not enabled:
                  return 0.0
              return 1.5 if strategy == "equal" else 1.0

          # Portfolios the user created. Their ids are not known when this workflow is
          # written, so they travel as one JSON variable rather than a per-portfolio set
          # of names. The bot validates every id again before it becomes a strategy.
          custom = {
              key: value for key, value in paper.items()
              if key not in mapping and isinstance(value, dict)
              and re.fullmatch(r"[a-z][a-zA-Z0-9]{1,30}", str(key))
          }
          # Always written, even when empty: an unset variable would leave whatever the
          # step wrote on a previous run in place, so deleting the last created portfolio
          # would not actually remove it.
          emit("PAPER_CUSTOM_PORTFOLIOS", json.dumps(custom, separators=(",", ":")))

          for strategy, prefix in mapping.items():
              row = paper.get(strategy) or {}
              emit(f"{prefix}_DISPLAY_NAME", row.get("displayName"))
              # Archiving takes a portfolio off the dashboard and stops it being run while
              # keeping everything it traded. Always written, for the same reason as above:
              # clearing the flag is what restores the portfolio.
              emit(f"{prefix}_ARCHIVED", str(bool(row.get("archived"))).lower())
              emit(f"{prefix}_MIN_PROBABILITY", row.get("minProbability"))
              emit(f"{prefix}_MAX_PROBABILITY", row.get("maxProbability"))
              emit(f"{prefix}_STAKE_USDC", row.get("stakeUsdc"))
              emit(f"{prefix}_MAX_FRACTION", row.get("maxOrderFraction"))
              emit(f"{prefix}_MAX_RESOLUTION_DAYS", row.get("maxResolutionDays"))
              emit(f"{prefix}_SELECTION_ORDER", row.get("selectionOrder"))
              emit(f"{prefix}_MIN_LIQUIDITY_USDC", row.get("minLiquidityUsdc"))
              emit(f"{prefix}_MIN_NET_YIELD", row.get("minNetYield"))
              emit(f"{prefix}_EXECUTION_TRIGGER", row.get("executionTrigger"))
              emit(f"{prefix}_EXECUTION_CRON_MINUTES", row.get("executionCronMinutes"))
              # Default on: a portfolio saved before this switch existed must keep trading.
              emit(f"{prefix}_AUTOMATION_ENABLED", str(bool(row.get("automationEnabled", True))).lower())
              # Rotation is independently configurable. Equal defaults off; every
              # existing paper portfolio keeps its prior automatic behavior.
              emit(f"{prefix}_AUTO_ROTATE", str(bool(row.get("autoRotatePositions", strategy != "equal"))).lower())
              # The paper synthetic stop Equal was built around, now a parameter every
              # portfolio can turn on. Equal is the only one that shipped with it on;
              # every existing portfolio keeps its prior behavior absent a saved value.
              multiplier = stop_loss_multiplier(row, strategy)
              emit(f"{prefix}_STOP_LOSS_RISK_MULTIPLIER", multiplier)
              emit(f"{prefix}_STOP_LOSS_ENABLED", str(multiplier > 0).lower())
              # A resting limit buy at the current best bid instead of a market buy at
              # the ask: cheaper on fill, but only fills if the market comes to meet it,
              # and is discarded unfilled once the event ends. Default off, unchanged
              # behavior for every portfolio that has not turned it on.
              emit(f"{prefix}_USE_LIMIT_ORDERS", str(bool(row.get("useLimitOrders"))).lower())
              emit(f"{prefix}_MARKET_TYPE", row.get("marketType"))
              emit(f"{prefix}_REQUIRE_MOST_PROBABLE", str(bool(row.get("requireMostProbableOutcome"))).lower())
              emit(f"{prefix}_PROBABILITY_SOURCE", row.get("probabilitySource"))
              excluded_tokens = [str(token) for token in (row.get("excludedCandidateTokenIds") or []) if str(token).isdigit()]
              emit(f"{prefix}_EXCLUDED_CANDIDATE_TOKEN_IDS", ",".join(excluded_tokens))
              # Whole tags the portfolio refuses. An empty list excludes nothing, which is
              # also what an unset variable means, so `emit` skipping it clears the setting
              # rather than stranding it -- no always-write case is needed here, unlike
              # 5050's allow-list where empty means the opposite of unset.
              excluded_tags = [str(tag).strip() for tag in (row.get("excludedMarketTags") or []) if str(tag).strip()]
              emit(f"{prefix}_EXCLUDED_MARKET_TAGS", ",".join(excluded_tags))
              include_only_tags = [str(tag).strip() for tag in (row.get("includeOnlyMarketTags") or []) if str(tag).strip()]
              emit(f"{prefix}_INCLUDE_ONLY_MARKET_TAGS", ",".join(include_only_tags))
          emit("PAPER_MARKET_SCAN_PREFERRED_MAX_RESOLUTION_DAYS", live.get("maxResolutionDays"))

          try:
              preference_url = "https://osobnizkusenosti.cz/trading/api.php?action=scan-preferences"
              preference_payload = json.loads(urllib.request.urlopen(preference_url, timeout=20).read().decode("utf-8"))
              preferences = preference_payload.get("preferences") or {}
              emit("PAPER_MARKET_SCAN_LIQUIDITY_MIN", preferences.get("liquidityMin"))
              max_days = preferences.get("maxDays")
              emit("PAPER_MARKET_SCAN_MAX_DAYS", -1 if max_days is None else max_days)
          except Exception as exc:
              print(f"scraping preferences unavailable: {exc}")
          PY

      - name: Run paper bot
        working-directory: trading
        run: npm run paper:bot

      - name: Report missing paper state
        # This step used to publish trading/data/paper-state.json over FTP whenever
        # the hosted state answered 404. That snapshot is a historical test fixture,
        # not a backup: it can be weeks old and can predate the multi-portfolio
        # schema, so restoring it would silently blank all three paper portfolios.
        # A missing hosted state is now reported, never overwritten. Recovery is a
        # deliberate act (see PAPER_ALLOW_SEED_BOOTSTRAP in the bot).
        if: always()
        run: |
          python3 - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          state_url = "https://osobnizkusenosti.cz/trading/api.php?action=state&target=paper"
          try:
              with urlopen(Request(state_url, headers={"User-Agent": "TradingPaperStateCheck/1.0"}), timeout=20) as response:
                  status = response.status
          except HTTPError as error:
              status = error.code
          except Exception as error:
              print(f"Could not verify hosted paper state: {error}; leaving hosted data untouched")
              raise SystemExit(0)

          if status == 404:
              print("::error::Hosted paper-state.json is missing (HTTP 404). Not restoring it automatically:")
              print("::error::the repository snapshot is a fixture and may use an obsolete schema.")
              print("::error::Run Trading Runtime Diagnostics to inspect the hosting, then restore deliberately.")
              raise SystemExit(1)

          print(f"Hosted paper state returned HTTP {status}; nothing to report")
          PY

      - name: Upload paper state
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          PAPER_STATE_FILE: trading/data/paper-state.json
          PAPER_UPLOAD_SUFFIX: bot-uploading
        # Publishes the core state and every segment its manifest names. See
        # trading/tools/publish-paper-state.py for why the order matters.
        run: python3 trading/tools/publish-paper-state.py

      - name: Append compact scraping history entry
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          PAPER_SCAN_HISTORY_ENTRY_PATH: trading/data/market-scan-history-entry.ndjson
        run: |
          python3 - <<'PY'
          import ftplib
          import json
          import os
          import re
          from pathlib import Path

          entry = Path(os.environ["PAPER_SCAN_HISTORY_ENTRY_PATH"])
          if not entry.exists() or not entry.read_text(encoding="utf-8").strip():
              print("No new scraping history entry to append")
              raise SystemExit(0)

          # split("\n"), not splitlines(): a question or AI-generated reason string can
          # contain a Unicode line-boundary character (U+2028/U+2029 and friends) that
          # JSON.stringify leaves unescaped but splitlines() still treats as a break,
          # corrupting an otherwise-valid single-line JSON record into two fragments.
          # Only "\n" is a real line boundary here -- it is the exact byte the writer
          # joined with.
          record = json.loads(entry.read_text(encoding="utf-8").split("\n")[0])
          run_at = str(record.get("runAt") or "")
          month = run_at[:7] if re.fullmatch(r"\d{4}-\d{2}", run_at[:7]) else "unknown"

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(os.environ["HOSTING_FTP_SERVER"], timeout=30) as ftp:
              ftp.login(os.environ["HOSTING_FTP_USERNAME"], os.environ["HOSTING_FTP_PASSWORD"])
              enter_dir(ftp, os.environ["TRADING_FTP_DIR"].strip("/").split("/") + ["market-scan-history"])
              with entry.open("rb") as handle:
                  ftp.storbinary(f"APPE {month}.ndjson", handle)
          print(f"Appended compact scan history entry to {month}.ndjson")
          PY

      - name: Append portfolio run-log history entries
        if: always()
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          TRADING_FTP_DIR: /www/trading/data
          PAPER_PORTFOLIO_RUN_LOG_ENTRY_PATH: trading/data/portfolio-run-log-entry.ndjson
        # A run can advance several portfolios at once (unlike the single scraping run
        # above), so this file can hold multiple lines. Each one is routed to its own
        # portfolio's monthly archive -- portfolio-run-log/<strategyId>/<month>.ndjson --
        # so the dashboard can page back through one portfolio's full history later
        # without ever reading another portfolio's.
        run: |
          python3 - <<'PY'
          import ftplib
          import json
          import os
          import re
          from collections import defaultdict
          from io import BytesIO
          from pathlib import Path

          entry = Path(os.environ["PAPER_PORTFOLIO_RUN_LOG_ENTRY_PATH"])
          if not entry.exists() or not entry.read_text(encoding="utf-8").strip():
              print("No new portfolio run-log entries to append")
              raise SystemExit(0)

          groups = defaultdict(list)
          # split("\n"), not splitlines(): a question or AI-generated reason string can
          # contain a Unicode line-boundary character (U+2028/U+2029 and friends) that
          # JSON.stringify leaves unescaped but splitlines() still treats as a break,
          # corrupting an otherwise-valid single-line JSON record into two fragments and
          # crashing json.loads on the fragment with "Unterminated string". Only "\n" is
          # a real line boundary here -- it is the exact byte the writer joined with.
          for line in entry.read_text(encoding="utf-8").split("\n"):
              line = line.strip()
              if not line:
                  continue
              record = json.loads(line)
              strategy_id = str(record.get("strategyId") or "")
              run_at = str(record.get("runAt") or "")
              if not re.fullmatch(r"[a-zA-Z0-9_-]{1,40}", strategy_id):
                  continue
              month = run_at[:7] if re.fullmatch(r"\d{4}-\d{2}", run_at[:7]) else "unknown"
              groups[(strategy_id, month)].append(line)

          if not groups:
              print("No valid portfolio run-log entries to append")
              raise SystemExit(0)

          def enter_dir(ftp, parts):
              try:
                  ftp.cwd("/")
              except ftplib.all_errors:
                  pass
              for part in parts:
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          with ftplib.FTP(os.environ["HOSTING_FTP_SERVER"], timeout=30) as ftp:
              ftp.login(os.environ["HOSTING_FTP_USERNAME"], os.environ["HOSTING_FTP_PASSWORD"])
              base = os.environ["TRADING_FTP_DIR"].strip("/").split("/") + ["portfolio-run-log"]
              for (strategy_id, month), lines in groups.items():
                  enter_dir(ftp, base + [strategy_id])
                  payload = BytesIO(("\n".join(lines) + "\n").encode("utf-8"))
                  ftp.storbinary(f"APPE {month}.ndjson", payload)
          total = sum(len(v) for v in groups.values())
          print(f"Appended {total} portfolio run-log entr{'y' if total == 1 else 'ies'} across {len(groups)} (portfolio, month) file(s)")
          PY

      # Same reason as the live workflow: the run summary is printed early and falls out
      # of the window a log reader can fetch, which makes a run unexplainable from its
      # timestamp alone. This digest is the last thing the job prints.
      - name: Run digest
        if: always()
        continue-on-error: true
        env:
          PAPER_STATE_FILE: trading/data/paper-state.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PAPER_STATE_FILE"])
          if not path.exists():
              print("RUN DIGEST: no paper state was produced by this run.")
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding="utf-8"))

          print("=== RUN DIGEST ===")
          print(f"generatedAt : {state.get('generatedAt')}")
          scan = state.get("marketScan") or {}
          print(f"scan        : scope={scan.get('lastScope')} at={scan.get('lastScanAt')} "
                f"batch={scan.get('lastBatchCount')} hourlySlot={scan.get('usedHourlyScanSlot')}")

          # Where the bot's own time went. The bot prints the same breakdown itself, but
          # that line is followed by several environment dumps, so restating it at the
          # bottom of the job is the difference between reading it and paging past it.
          timing = state.get("lastPassTiming") or {}
          if timing:
              print(f"timing      : executionPass={timing.get('executionPass')} "
                    f"total={round(float(timing.get('totalMs') or 0) / 1000, 1)}s "
                    f"(excludes the write that produced this file)")
              for name, ms in list((timing.get("phasesMs") or {}).items())[:10]:
                  print(f"  phase     : {name} {round(float(ms) / 1000, 2)}s")

          for strategy_id, portfolio in (state.get("paperPortfolios") or {}).items():
              decision = portfolio.get("lastDecision") or {}
              summary = portfolio.get("portfolio") or {}
              print(f"portfolio   : {strategy_id} action={decision.get('action')} "
                    f"free={summary.get('freeCapitalUsdc')} stake={summary.get('maxStakeUsdc')}")
              if decision.get("reason"):
                  print(f"  reason    : {str(decision.get('reason'))[:200]}")
              batch = decision.get("batchLog") or {}
              for entry in (batch.get("topRejected") or [])[:5]:
                  reasons = entry.get("rejectReasons") or []
                  print(f"  rejected  : {str(entry.get('question'))[:52]!r} -> "
                        f"{'; '.join(str(r) for r in reasons)[:150]}")
          print("=== END RUN DIGEST ===")
          PY
