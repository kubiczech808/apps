name: Hosting File Audit

on:
  workflow_dispatch:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - '.github/workflows/hosting-file-audit.yml'

concurrency:
  group: hosting-file-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find likely cleanup candidates
        env:
          HOSTING_FTP_SERVER: ${{ secrets.HOSTING_FTP_SERVER }}
          HOSTING_FTP_USERNAME: ${{ secrets.HOSTING_FTP_USERNAME }}
          HOSTING_FTP_PASSWORD: ${{ secrets.HOSTING_FTP_PASSWORD }}
          HOSTING_FTP_DIR: ${{ secrets.HOSTING_FTP_DIR }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import posixpath
          from collections import deque

          server = os.environ["HOSTING_FTP_SERVER"]
          username = os.environ["HOSTING_FTP_USERNAME"]
          password = os.environ["HOSTING_FTP_PASSWORD"]
          configured_root = (os.environ.get("HOSTING_FTP_DIR") or "").strip()
          suspicious_dirs = {
              ".git", ".github", "__pycache__", ".pytest_cache", ".cache", "cache",
              "tmp", "temp", "backup", "backups", "node_modules", "vendor",
              "tests", "test", "docs", "doc", "examples", "sample", "samples",
          }
          suspicious_suffixes = (
              ".zip", ".tar", ".gz", ".tgz", ".rar", ".7z", ".bak", ".old",
              ".orig", ".tmp", ".log", ".sqlite", ".sqlite3", ".sql",
          )

          def safe_cwd(ftp, path):
              try:
                  ftp.cwd(path)
                  return True
              except ftplib.all_errors:
                  return False

          def list_entries(ftp):
              try:
                  entries = []
                  for name, facts in ftp.mlsd():
                      if name in {".", ".."}:
                          continue
                      entries.append((name, facts.get("type", "")))
                  return entries
              except ftplib.all_errors:
                  names = []
                  try:
                      names = [name for name in ftp.nlst() if name not in {".", ".."}]
                  except ftplib.all_errors:
                      return []
                  entries = []
                  current = ftp.pwd()
                  for name in names:
                      try:
                          ftp.cwd(name)
                          ftp.cwd(current)
                          entries.append((name, "dir"))
                      except ftplib.all_errors:
                          entries.append((name, "file"))
                  return entries

          def children(ftp, path):
              if not safe_cwd(ftp, path):
                  return []
              return [(posixpath.join(path.rstrip("/") or "/", name), name, kind) for name, kind in list_entries(ftp)]

          def candidate_roots():
              roots = ["/"]
              if configured_root:
                  roots.append("/" + configured_root.strip("/"))
                  roots.append("/" + configured_root.strip("/") + "/www")
              roots.append("/www")
              seen = set()
              for root in roots:
                  root = posixpath.normpath(root)
                  if root == ".":
                      root = "/"
                  if root not in seen:
                      seen.add(root)
                      yield root

          with ftplib.FTP(server, timeout=60) as ftp:
              ftp.login(username, password)
              usable_roots = []
              for root in candidate_roots():
                  if safe_cwd(ftp, root):
                      usable_roots.append(root)
              print("Usable FTP roots:", ", ".join(usable_roots) or "-")
              if not usable_roots:
                  raise SystemExit("No configured FTP root was accessible.")

              roots = [root for root in usable_roots if root != "/"]
              if not roots:
                  roots = ["/"]
              print("Audited roots:", ", ".join(roots))
              print("")

              candidates = []
              queue = deque((root, 0) for root in roots)
              visited = set()
              max_nodes = 2500
              while queue and len(visited) < max_nodes:
                  current, depth = queue.popleft()
                  if current in visited:
                      continue
                  visited.add(current)
                  for child, name, kind in children(ftp, current):
                      low = name.lower()
                      if kind == "dir":
                          if low in suspicious_dirs or any(token in low for token in ["backup", "cache", "tmp", "temp", "old"]):
                              candidates.append((child, "dir"))
                          if depth < 5 and low not in {"mail", "logs"}:
                              queue.append((child, depth + 1))
                      else:
                          if low.endswith(suspicious_suffixes) or low in {".ftp-deploy-sync-state.json"}:
                              candidates.append((child, "file"))

              print(f"Visited directories: {len(visited)}")
              if len(visited) >= max_nodes:
                  print("Traversal stopped at safety limit; output is a sample, not a full inventory.")
              print("")
              print("Likely cleanup candidates:")
              if not candidates:
                  print("-")
              for path, kind in sorted(set(candidates))[:200]:
                  print(f"{kind:4s}  {path}")
          PY
