name: Trading Market Type Diagnosis

# Read-only diagnostic, manual only. Samples resolved market observations and prints how
# the current rule splits them into Yes/No and multi-outcome, next to what Polymarket's own
# negRisk flag says about the same markets. Writes nothing and places no orders.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Classify resolved markets
        working-directory: trading
        run: node tools/market-type-diagnosis.mjs
