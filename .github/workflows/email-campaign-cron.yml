name: Email Campaign Cron

on:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - '.github/workflows/email-campaign-cron.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Deploy Email Campaign
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: email-campaign-cron
  cancel-in-progress: true

jobs:
  cron:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call application cron endpoint
        env:
          APP_DATABASE_NAME: ${{ secrets.APP_DATABASE_NAME }}
          APP_DATABASE_USERNAME: ${{ secrets.MYSQL_EMAILING_DB_USERNAME }}
          APP_DATABASE_PASSWORD: ${{ secrets.MYSQL_EMAILING_DB_PASSWORD }}
        run: |
          if [ -z "$APP_DATABASE_NAME" ] || [ -z "$APP_DATABASE_USERNAME" ] || [ -z "$APP_DATABASE_PASSWORD" ]; then
            echo "Missing database secrets; cannot derive cron token."
            exit 1
          fi
          TOKEN=$(python3 - <<'PY'
          import hashlib
          import os

          material = "email-campaign-cron:" + os.environ["APP_DATABASE_NAME"] + ":" + os.environ["APP_DATABASE_USERNAME"] + ":" + os.environ["APP_DATABASE_PASSWORD"]
          print(hashlib.sha256(material.encode("utf-8")).hexdigest())
          PY
          )
          call_cron() {
            http_code=$(curl --show-error --silent --max-time 180 --output /tmp/email-campaign-cron-body.txt --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}")
            echo "HTTP ${http_code}"
            cat /tmp/email-campaign-cron-body.txt
            test "$http_code" -ge 200 -a "$http_code" -lt 400
          }
          call_reclaim() {
            phase="$1"
            reclaim_code=$(curl --show-error --silent --max-time 180 --output /tmp/email-campaign-reclaim-body.txt --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}&db_reclaim=1" || echo "000")
            echo "Reclaim (${phase}) HTTP ${reclaim_code}"
            cat /tmp/email-campaign-reclaim-body.txt || true
            # HTTP 202 znamena pouze cekani na dopsani retence. Chybu samotneho
            # OPTIMIZE ale neschovavame za zeleny workflow - jinak "uspech" nic
            # nevypovida o tom, zda hosting skutecne ziskal prostor.
            if [ "$reclaim_code" = "202" ]; then
              echo "::notice::Uvolneni mista ceka na retenci; dalsi krok ho dotahne."
              return 0
            fi
            if [ "$reclaim_code" -lt 200 ] || [ "$reclaim_code" -ge 300 ]; then
              echo "::error::Uvolneni mista vratilo HTTP ${reclaim_code}."
              return 1
            fi
          }
          verify_storage_reclaim() {
            report_code=$(curl --show-error --silent --max-time 60 --output /tmp/email-campaign-storage-after.json --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}&storage_report=1" || echo "000")
            if [ "$report_code" -lt 200 ] || [ "$report_code" -ge 300 ]; then
              echo "::error::Po udrzbe nelze nacist meritelny stav uloziste (HTTP ${report_code})."
              return 1
            fi
            python3 - <<'PY'
          import json
          import os
          import sys

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          def emit(line):
              print(line)
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as summary:
                      summary.write(line + '\n')

          with open('/tmp/email-campaign-storage-after.json', encoding='utf-8') as handle:
              report = json.load(handle)
          maintenance = report.get('maintenance') or {}
          cleanup = report.get('cleanup') or {}
          measurements = maintenance.get('measurements') or {}
          mib = 1024 * 1024
          def size(value):
              return f"{(int(value or 0) / mib):.1f} MB"

          emit('### Ověřený stav úložiště po údržbě')
          emit('alokováno: ' + size(report.get('allocated_bytes')) + ' | volné v tabulkách: ' + size(report.get('free_bytes')))
          emit('stav kompaktace: ' + (maintenance.get('reclaim_state') or '-') + ' | karanténa workerů: ' + (str(maintenance.get('reclaim_quiesce') or '0')))
          profile = report.get('engine_profile') or {}
          emit('InnoDB file_per_table: ' + (profile.get('innodb_file_per_table') or 'nezjištěno') + ' | server: ' + (profile.get('version') or 'nezjištěno'))
          for name in ('import_run_items', 'scraping_job_items'):
              measurement = measurements.get(name) or {}
              if measurement:
                  emit(f"{name}: {size(measurement.get('before_bytes'))} -> {size(measurement.get('after_bytes'))}; "
                       f"uvolněno {size(measurement.get('saved_bytes'))}; výsledek {measurement.get('outcome')}")
              else:
                  emit(f"{name}: chybí měření")
          pending = int(cleanup.get('scraping_items_prunable') or 0) + int(cleanup.get('import_items_prunable') or 0)
          if pending:
              print(f"::error::Po údržbě zůstává alespoň {pending} detailních logů čekajících na retenci.")
              sys.exit(1)
          if maintenance.get('reclaim_state') != 'complete' or str(maintenance.get('reclaim_quiesce') or '') == '1':
              print('::error::Kompaktace neskončila ověřeným stavem complete.')
              sys.exit(1)
          not_released = [name for name, value in measurements.items()
                          if isinstance(value, dict) and value.get('outcome') == 'not_released']
          if not_released:
              print('::warning::OPTIMIZE doběhl, ale hostingem hlášená alokace neklesla u: ' + ', '.join(not_released))
          PY
          }
          cleanup_pending() {
            report_code=$(curl --show-error --silent --max-time 60 --output /tmp/email-campaign-storage.json --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}&storage_report=1" || echo "000")
            if [ "$report_code" -lt 200 ] || [ "$report_code" -ge 300 ]; then
              echo "::warning::Stav uloziste nelze nacist (HTTP ${report_code})."
              return 1
            fi
            python3 - <<'PY'
          import json
          import sys

          with open('/tmp/email-campaign-storage.json', encoding='utf-8') as handle:
              cleanup = (json.load(handle).get('cleanup') or {})
          pending = int(cleanup.get('scraping_items_prunable') or 0) + int(cleanup.get('import_items_prunable') or 0)
          print('Detailnich radku cekajicich na retenci:', pending)
          raise SystemExit(0 if pending > 0 else 1)
          PY
          }
          run_cleanup_burst() {
            if ! cleanup_pending; then
              echo "Retencni fronta je prazdna."
              return 0
            fi
            # Jedno volani ma vlastni 100s strop a transakcni kontrolu, aby hosting
            # request neukoncil a aby nikdy nemohlo ubyvat ze skutecnych dat. Velky
            # historicky backlog vsak nemuze po dvou tichech zustat viset: dotahne
            # ho az 8 omezenych requestu (max. 20 000 detailu v jedne transakci).
            for burst in $(seq 1 8); do
              echo "Automaticky burst retence ${burst}/8"
              cleanup_code=$(curl --show-error --silent --max-time 170 --output /tmp/email-campaign-cleanup-body.txt --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}&db_cleanup=1&rounds=12&batch=20000" || echo "000")
              echo "Cleanup HTTP ${cleanup_code}"
              cat /tmp/email-campaign-cleanup-body.txt || true
              if grep -q "VRACEN ZPET" /tmp/email-campaign-cleanup-body.txt; then
                echo "::error::Automaticky uklid byl vracen zpet ochranou dat."
                exit 1
              fi
              if [ "$cleanup_code" != "200" ]; then
                echo "::error::Automaticky uklid vratil HTTP ${cleanup_code}."
                return 1
              fi
              if ! cleanup_pending; then
                echo "Retencni fronta je prazdna."
                return 0
              fi
            done
            echo "::error::Retencni fronta se nevyprazdnila ani po 8 omezenych burstech."
            return 1
          }
          # Udrzba nejdriv zklidni import/scraping, pak normalni cron muze bezpecne
          # preskocit jen tyto workery. Kampane a IMAP se pritom provadi dal.
          call_reclaim "priprava"
          # Rozesilka, IMAP, importy a scraping.
          # AI research automatika je na zadost zastavena - jeji cron trigger je pryc,
          # takze se odsud uz nevola.
          call_cron
          run_cleanup_burst
          # Jedna upravarska akce musi dotahnout oba velke logy sama. GitHub schedule
          # negarantuje presny dalsi petiminutovy tik, proto nesmime nechat druhou
          # tabulku jen cekat s desitkami MB volneho mista uvnitr InnoDB souboru.
          call_reclaim "po retenci"
          call_reclaim "druha tabulka"
          call_reclaim "dokonceni"
          verify_storage_reclaim
          # AI research tick spoustime i z petiminutoveho cron signalu. Aplikace sama hlida interval, kvotu a zamek proti duplicitam.
          ai_code=$(curl --show-error --silent --max-time 260 --output /tmp/email-campaign-ai-body.txt --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}&ai_research=1&hop=2" || echo "000")
          echo "AI research HTTP ${ai_code}"
          cat /tmp/email-campaign-ai-body.txt || true
          if [ "$ai_code" -lt 200 ] || [ "$ai_code" -ge 300 ]; then
            echo "::warning::AI research tick vratil HTTP ${ai_code}; dalsi pokus probehne v dalsim cron intervalu."
          fi
