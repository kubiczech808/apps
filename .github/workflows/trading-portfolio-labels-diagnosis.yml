name: Trading Portfolio Labels Diagnosis

# Read-only diagnostic, manual only. Lists every paper portfolio's real strategy id next
# to its current display label, so a dashboard name can be matched to the id a fix must
# actually target.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: List portfolio ids and labels
        working-directory: trading
        run: node tools/portfolio-labels-diagnosis.mjs
