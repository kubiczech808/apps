name: Retain Trading MySQL Mirror

# The published JSON segments remain Trading's active read source. MySQL is a bounded,
# queryable mirror, so old snapshots belong in gzip archives on hosting rather than in the
# shared database quota. The deploy workflow performs the first urgent pass; this workflow
# keeps the same limits on a quiet daily cadence.
on:
  workflow_dispatch:
    inputs:
      scraped_days:
        description: Keep SCRAPED snapshots this many days in MySQL.
        required: false
        default: "3"
        type: string
      resolved_days:
        description: Keep RESOLVED snapshots this many days in MySQL.
        required: false
        default: "1"
        type: string
  schedule:
    - cron: '47 2 * * *'

permissions:
  contents: read

concurrency:
  group: trading-storage-retention
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STORAGE_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=storage-admin
      STATUS_URL: https://www.osobnizkusenosti.cz/trading/api.php?action=storage-status
      TRADING_TRIGGER_KEY: ${{ secrets.POLYTRADING_DB_PASSWORD }}
      SCRAPED_RETENTION_DAYS: ${{ inputs.scraped_days || '3' }}
      RESOLVED_RETENTION_DAYS: ${{ inputs.resolved_days || '1' }}
      MIGRATE_PAGE_LIMIT: "200"
      MIGRATE_PAUSE_SECONDS: "2"
      MIGRATE_BUDGET_MINUTES: "35"
    steps:
      - uses: actions/checkout@v4
      - name: Archive obsolete observation snapshots and reclaim database pages
        run: python3 trading/tools/storage-migrate.py --operation archive-observations
