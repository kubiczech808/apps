name: Virtual Assistant secret bridge

on:
  push:
    paths:
      - .github/workflows/virtual-assistant-secret-bridge.yml
      - .virtual-assistant-secret-bridge-trigger
      - scripts/agent_virtual_assistant.py
      - scripts/update_virtual_assistant_workspace.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virtual-assistant-secret-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN: ${{ secrets.TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN }}
      TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID: "6247540911"
      MAILTO_JAKUB_GMAIL_OAUTH_TOKEN: ${{ secrets.MAILTO_JAKUB_GMAIL_OAUTH_TOKEN }}
      TELEGRAM_AGENT_G_BOT_TOKEN: ${{ secrets.TELEGRAM_AGENT_G_BOT_TOKEN }}
      TELEGRAM_AGENT_G_CHAT_ID: ${{ secrets.TELEGRAM_AGENT_G_CHAT_ID }}
      G_TELEGRAM_BOT_TOKEN: ${{ secrets.G_TELEGRAM_BOT_TOKEN }}
      G_TELEGRAM_TOKEN: ${{ secrets.G_TELEGRAM_TOKEN }}
      AGENT_G_TELEGRAM_TOKEN: ${{ secrets.AGENT_G_TELEGRAM_TOKEN }}
      G_TELEGRAM_CHAT_ID: ${{ secrets.G_TELEGRAM_CHAT_ID }}
      AGENT_G_CHAT_ID: ${{ secrets.AGENT_G_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bridge secret, deploy runtime, restart assistant
        shell: bash
        run: |
          set -euo pipefail

          token="${TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN:-}"
          chat_id="${TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID:-6247540911}"
          gmail_token="${MAILTO_JAKUB_GMAIL_OAUTH_TOKEN:-}"
          agent_g_token="${TELEGRAM_AGENT_G_BOT_TOKEN:-}"
          agent_g_chat_id="${TELEGRAM_AGENT_G_CHAT_ID:-}"
          if [ -z "$agent_g_token" ]; then agent_g_token="${G_TELEGRAM_BOT_TOKEN:-}"; fi
          if [ -z "$agent_g_token" ]; then agent_g_token="${G_TELEGRAM_TOKEN:-}"; fi
          if [ -z "$agent_g_token" ]; then agent_g_token="${AGENT_G_TELEGRAM_TOKEN:-}"; fi
          if [ -z "$agent_g_chat_id" ]; then agent_g_chat_id="${G_TELEGRAM_CHAT_ID:-}"; fi
          if [ -z "$agent_g_chat_id" ]; then agent_g_chat_id="${AGENT_G_CHAT_ID:-}"; fi

          if [ -n "$token" ]; then
            echo "::add-mask::$token"
          fi
          if [ -n "$chat_id" ]; then
            echo "::add-mask::$chat_id"
          fi
          if [ -n "$gmail_token" ]; then
            echo "::add-mask::$gmail_token"
          fi
          if [ -n "$agent_g_token" ]; then
            echo "::add-mask::$agent_g_token"
          fi
          if [ -n "$agent_g_chat_id" ]; then
            echo "::add-mask::$agent_g_chat_id"
          fi

          if [ -z "$token" ]; then
            echo "Virtual Assistant token secret missing: set TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN in kubiczech808/apps Actions secrets."
            exit 2
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN", "")
          base = f"https://api.telegram.org/bot{token}/"
          def call(method, data=None):
              payload = urllib.parse.urlencode(data or {}).encode() if data is not None else None
              req = urllib.request.Request(base + method, data=payload)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))
          try:
              me = call("getMe")
              print("telegram_getme_ok=", bool(me.get("ok")))
              webhook = call("getWebhookInfo")
              result = webhook.get("result") or {}
              print("telegram_webhook_url_set=", bool(result.get("url")))
              print("telegram_pending_update_count=", result.get("pending_update_count", ""))
              deleted = call("deleteWebhook", {"drop_pending_updates": "false"})
              print("telegram_delete_webhook_ok=", bool(deleted.get("ok")))
          except Exception as exc:
              print("telegram_api_check_failed=", type(exc).__name__)
          PY

          sudo install -d -o openclaw2 -g openclaw2 -m 0755 /home/openclaw2/.openclaw
          sudo touch /home/openclaw2/.openclaw/.env.local

          sudo env VA_TOKEN="$token" VA_CHAT_ID="$chat_id" MAILTO_JAKUB_GMAIL_OAUTH_TOKEN="$gmail_token" AGENT_G_TOKEN="$agent_g_token" AGENT_G_CHAT_ID="$agent_g_chat_id" python3 - <<'PY'
          from pathlib import Path
          import os
          import pwd

          p = Path("/home/openclaw2/.openclaw/.env.local")
          drop = {
              "TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN",
              "VIRTUAL_ASSISTANT_TELEGRAM_TOKEN",
              "VA_TELEGRAM_TOKEN",
              "M_TELEGRAM_TOKEN",
              "AGENT_VA_TELEGRAM_TOKEN",
              "TELEGRAM_AGENT_VA_BOT_TOKEN",
              "ASSISTANT_TELEGRAM_TOKEN",
              "TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID",
              "VIRTUAL_ASSISTANT_TELEGRAM_CHAT_ID",
              "VA_TELEGRAM_CHAT_ID",
              "M_TELEGRAM_CHAT_ID",
              "AGENT_VA_TELEGRAM_CHAT_ID",
              "TELEGRAM_AGENT_VA_CHAT_ID",
              "ASSISTANT_TELEGRAM_CHAT_ID",
              "MAILTO_JAKUB_GMAIL_OAUTH_TOKEN",
              "VIRTUAL_ASSISTANT_GMAIL_OAUTH_TOKEN",
              "MAILTO_JAKUB_GMAIL_ADDRESS",
              "VIRTUAL_ASSISTANT_EMAIL_ADDRESS",
              "VIRTUAL_ASSISTANT_EMAIL_TRUSTED_SENDERS",
              "VIRTUAL_ASSISTANT_EMAIL_SETUP_RECIPIENT",
              "VIRTUAL_ASSISTANT_EMAIL_POLL_SECONDS",
          }
          if os.environ.get("AGENT_G_TOKEN"):
              drop.add("TELEGRAM_AGENT_G_BOT_TOKEN")
              drop.add("G_TELEGRAM_TOKEN")
              drop.add("AGENT_G_TELEGRAM_TOKEN")
          if os.environ.get("AGENT_G_CHAT_ID"):
              drop.add("TELEGRAM_AGENT_G_CHAT_ID")
              drop.add("G_TELEGRAM_CHAT_ID")
              drop.add("AGENT_G_CHAT_ID")
          lines = []
          if p.exists():
              for raw in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  key = raw.split("=", 1)[0].strip()
                  if key and key not in drop:
                      lines.append(raw)
          lines.append(f"TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN={os.environ['VA_TOKEN']}")
          lines.append(f"TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID={os.environ['VA_CHAT_ID']}")
          if os.environ.get("MAILTO_JAKUB_GMAIL_OAUTH_TOKEN"):
              lines.append(f"MAILTO_JAKUB_GMAIL_OAUTH_TOKEN={os.environ['MAILTO_JAKUB_GMAIL_OAUTH_TOKEN']}")
          if os.environ.get("AGENT_G_TOKEN"):
              lines.append(f"TELEGRAM_AGENT_G_BOT_TOKEN={os.environ['AGENT_G_TOKEN']}")
          if os.environ.get("AGENT_G_CHAT_ID"):
              lines.append(f"TELEGRAM_AGENT_G_CHAT_ID={os.environ['AGENT_G_CHAT_ID']}")
          lines.append("MAILTO_JAKUB_GMAIL_ADDRESS=mailto.jakub.elias@gmail.com")
          lines.append("VIRTUAL_ASSISTANT_EMAIL_TRUSTED_SENDERS=jakub.elias88@gmail.com,mailto.jakub.elias@gmail.com")
          lines.append("VIRTUAL_ASSISTANT_EMAIL_SETUP_RECIPIENT=jakub.elias88@gmail.com")
          lines.append("VIRTUAL_ASSISTANT_EMAIL_POLL_SECONDS=300")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          account = pwd.getpwnam("openclaw2")
          os.chown(p, account.pw_uid, account.pw_gid)
          os.chmod(p, 0o600)
          PY

          sudo install -d -o openclaw2 -g openclaw2 -m 0755 /home/openclaw2/scripts
          sudo install -o openclaw2 -g openclaw2 -m 0755 scripts/agent_virtual_assistant.py /home/openclaw2/scripts/agent_virtual_assistant.py
          sudo install -o openclaw2 -g openclaw2 -m 0755 scripts/virtual_assistant_playwright.mjs /home/openclaw2/scripts/virtual_assistant_playwright.mjs
          sudo -u openclaw2 -H bash -lc 'set -e; mkdir -p /home/openclaw2/.openclaw/virtual-assistant-node; cd /home/openclaw2/.openclaw/virtual-assistant-node; if [ ! -d node_modules/playwright-core ]; then npm init -y >/dev/null 2>&1 || true; npm install playwright-core >/dev/null; fi' && echo "playwright_install=ok" || echo "playwright_install=failed"
          sudo -u openclaw2 -H python3 scripts/update_virtual_assistant_workspace.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/agent_virtual_assistant.py

          if grep -q 'repair-missed-oz-x-test' .virtual-assistant-secret-bridge-trigger; then
            sudo -u openclaw2 -H python3 - <<'PY'
          import importlib.util
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          task = "zarid at vznikne draft clanku na osobnizkusenosti.cz a navrh prispevku na X pro btc-dca.com , obsah muze byt cokoliv, jde o test"
          base = Path("/home/openclaw2/.openclaw")
          repair_key = "2026-06-30-missed-oz-x-test"
          repair_state_path = base / "virtual-assistant-repairs.json"
          try:
              repair_state = json.loads(repair_state_path.read_text(encoding="utf-8"))
          except Exception:
              repair_state = {}
          if repair_state.get(repair_key) != "done":
              # Stop only the misrouted btc-dca blogger process for this exact test topic, if it is still running.
              try:
                  ps = subprocess.run(["pgrep", "-af", "btc-dca-blogger.py"], capture_output=True, text=True, check=False)
                  for line in (ps.stdout or "").splitlines():
                      if "--instance btc-dca" in line and "osobnizkusenosti" in line:
                          pid = line.split(None, 1)[0]
                          subprocess.run(["kill", pid], check=False)
                          print(f"repair_killed_misrouted_pid={pid}")
              except Exception as exc:
                  print(f"repair_kill_check_failed={type(exc).__name__}")

              wrong_state = base / "btc-dca-blogger-state.json"
              if wrong_state.exists():
                  try:
                      state = json.loads(wrong_state.read_text(encoding="utf-8"))
                  except Exception:
                      state = {}
                  topic = str(state.get("topic") or state.get("keywords") or "")
                  if state.get("requested_by") == "virtual-assistant" and "osobnizkusenosti" in topic:
                      archive = base / f"btc-dca-blogger-state.misrouted-virtual-assistant-{int(time.time())}.json"
                      wrong_state.replace(archive)
                      print(f"repair_archived_misrouted_btc_dca_state={archive}")

              spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print("repair_target=", module.blogger_delegation_target(task))
              print("repair_social=", module.is_social_delegation_task(task))
              reply = module.parse_combined_delegation_request(task) or "Repair failed: combined delegation did not match."
              print("repair_reply=", reply.replace("\n", " | ")[:700])
              repair_state[repair_key] = "done"
              repair_state_path.write_text(json.dumps(repair_state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

              print("repair_telegram_send=disabled")
          else:
              print("repair_skipped=already_done")
          PY
          fi

          sudo -u openclaw2 -H python3 - <<'PY'
          import contextlib
          import importlib.util
          import io
          import json
          import re
          import subprocess
          import time
          from pathlib import Path
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("codex_cli_present=", bool(module.g.find_codex()))
          print("codex_auth_status=", module.g.codex_auth_status())
          print("ai_backend_effective=", module.g.ai_backend())
          config = module.gmail_env_config()
          print("gmail_oauth_token_present=", bool(config.get("oauth_secret")))
          print("gmail_oauth_secret_kind=", module.gmail_oauth_secret_kind(config.get("oauth_secret", "")))
          print("gmail_address=", config.get("address"))
          print("gmail_poll_seconds=", config.get("poll_seconds"))
          if config.get("oauth_secret"):
              try:
                  module.gmail_poll_once()
                  print("gmail_setup_poll=ok")
              except Exception as exc:
                  print("gmail_setup_poll=failed:", exc)
          else:
              print("gmail_setup_poll=skipped_missing_secret")
          PY

          if grep -q 'repair-oz-draft-link' .virtual-assistant-secret-bridge-trigger; then
            sudo -u openclaw2 -H python3 - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          base = Path("/home/openclaw2/.openclaw")
          repair_state_path = base / "virtual-assistant" / "REPAIR_STATE.json"
          try:
              repair_state = json.loads(repair_state_path.read_text(encoding="utf-8", errors="replace"))
          except Exception:
              repair_state = {}
          if not isinstance(repair_state, dict):
              repair_state = {}
          repair_key = "repair-oz-draft-link-2026-07-03-ai-agenti"
          if repair_state.get(repair_key) == "done":
              print("repair_oz_draft_link=skipped_already_done")
          else:
              script = Path("/home/openclaw2/scripts/btc-dca-blogger.py")
              log_path = base / "logs" / "virtual-assistant-osobnizkusenosti-cz-delegation.log"
              topic = "ai agenti"
              command = [
                  "python3",
                  str(script),
                  "--instance",
                  "osobnizkusenosti-cz",
                  "--topic",
                  topic,
                  "--phase",
                  "publish",
                  "--force",
              ]
              print("repair_oz_draft_link_command=publish")
              with log_path.open("a", encoding="utf-8") as log_handle:
                  log_handle.write(f"[virtual-assistant] repair draft link start {time.strftime('%Y-%m-%dT%H:%M:%S%z')}\n")
                  result = subprocess.run(command, stdout=log_handle, stderr=subprocess.STDOUT, cwd=str(base / "virtual-assistant"), check=False)
                  log_handle.write(f"[virtual-assistant] repair draft link exit {result.returncode} {time.strftime('%Y-%m-%dT%H:%M:%S%z')}\n")
              print(f"repair_oz_draft_link_exit={result.returncode}")
              tasks_path = base / "virtual-assistant" / "ORCHESTRATION_TASKS.json"
              try:
                  tasks = json.loads(tasks_path.read_text(encoding="utf-8", errors="replace"))
              except Exception:
                  tasks = []
              changed = False
              if isinstance(tasks, list):
                  for task in tasks:
                      if not isinstance(task, dict):
                          continue
                      if task.get("instance") != "osobnizkusenosti-cz" or task.get("kind") != "blogger-draft":
                          continue
                      if "ai agenti" not in str(task.get("topic") or "") and "podnikani na webu osobnizkusenosti" not in str(task.get("topic") or ""):
                          continue
                      proof = task.get("proof") if isinstance(task.get("proof"), dict) else {}
                      proof["requires_link"] = "True"
                      proof["site_url"] = "https://osobnizkusenosti.cz"
                      task["proof"] = proof
                      task["status"] = "VERIFYING"
                      task["last_reported_status"] = ""
                      task.pop("reported_at", None)
                      task["updated_at"] = time.strftime("%Y-%m-%dT%H:%M:%S%z")
                      changed = True
              if changed:
                  tasks_path.write_text(json.dumps(tasks, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  print("repair_oz_draft_link_tasks_reopened=True")
              else:
                  print("repair_oz_draft_link_tasks_reopened=False")
              repair_state[repair_key] = "done"
              repair_state_path.parent.mkdir(parents=True, exist_ok=True)
              repair_state_path.write_text(json.dumps(repair_state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          if grep -q 'repair-xoz-misroute' .virtual-assistant-secret-bridge-trigger; then
            sudo -u openclaw2 -H python3 - <<'PY'
          import json
          import importlib.util
          from pathlib import Path

          base = Path("/home/openclaw2/.openclaw")
          repair_state_path = base / "virtual-assistant" / "REPAIR_STATE.json"
          try:
              repair_state = json.loads(repair_state_path.read_text(encoding="utf-8", errors="replace"))
          except Exception:
              repair_state = {}
          if not isinstance(repair_state, dict):
              repair_state = {}
          repair_key = "repair-xoz-misroute-2026-07-03-v2"
          if repair_state.get(repair_key) == "done":
              print("repair_xoz_misroute=skipped_already_done")
          else:
              spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              cancel_reply = module.parse_cancel_social_assignment_request("zrus zadani agentovi D. to zadani mel dostat agent XOZ")
              delegate_reply = module.parse_social_x_delegation_request("chci navrh prispevku na X OZ ke schvaleni")
              print("repair_xoz_misroute_cancel=", str(cancel_reply or "")[:240])
              print("repair_xoz_misroute_delegate=", str(delegate_reply or "")[:240])
              repair_state[repair_key] = "done"
              repair_state_path.parent.mkdir(parents=True, exist_ok=True)
              repair_state_path.write_text(json.dumps(repair_state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          sudo -u openclaw2 -H python3 - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              changed = module.xoz_worker_once()
              print("xoz_worker_once_changed=", changed)
          except Exception as exc:
              print(f"xoz_worker_once_failed={type(exc).__name__}:{str(exc)[:180]}")
          try:
              escalated = module.escalate_reported_agent_d_blockers_once()
              print("agent_g_escalated_blockers=", escalated)
              escalated_from_log = module.escalate_recent_agent_d_blocker_log_once()
              print("agent_g_escalated_log_blockers=", escalated_from_log)
              handoffs = module.ensure_agent_g_handoffs_once()
              print("agent_g_handoffs_written=", handoffs)
          except Exception as exc:
              print(f"agent_g_escalation_failed={type(exc).__name__}:{str(exc)[:180]}")
          PY

          sudo systemctl daemon-reload
          sudo systemctl enable --now virtual-assistant.service
          sudo systemctl restart virtual-assistant.service
          sleep 3

          rm -f /tmp/xoz-comment-test-status
          if grep -q 'xoz-comment-test' .virtual-assistant-secret-bridge-trigger; then
            {
              echo "xoz_comment_test_requested=true"
              sudo -u openclaw2 -H python3 - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              before = len(module.read_jsonl(module.XOZ_ACTIVITY_LOG_FILE, 1000))
              reply = module.parse_xoz_control_request("Agent XOZ pridej 1 komentar na X pro Osobni zkusenosti jako test activity logu a zapis overitelny vysledek.")
              print("xoz_comment_test_reply=", str(reply or "")[:220])
              print("xoz_comment_test_control_inbox=", module.XOZ_CONTROL_INBOX_FILE)
              print("xoz_comment_test_activity_before=", before)
          except Exception as exc:
              print(f"xoz_comment_test_request_failed={type(exc).__name__}:{str(exc)[:180]}")
          PY
              sudo systemctl restart agent-oz-engage.service
              echo "xoz_comment_test_restart_agent_oz_engage_rc=$?"
              sleep 45
              echo "xoz_comment_test_agent_oz_engage_active=$(systemctl is-active agent-oz-engage.service || true)"
              sudo -u openclaw2 -H python3 - <<'PY'
          import importlib.util
          import json

          spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              records = module.read_jsonl(module.XOZ_ACTIVITY_LOG_FILE, 1000)
              print("xoz_comment_test_activity_after=", len(records))
              for idx, item in enumerate(records[-5:], 1):
                  print(
                      "xoz_comment_test_activity_recent_{}=created={} action={} url={} text={}".format(
                          idx,
                          str(item.get("created_at") or item.get("time") or "")[:40],
                          str(item.get("action") or item.get("kind") or "")[:40],
                          str(item.get("url") or item.get("comment_url") or item.get("target_url") or "")[:160],
                          " ".join(str(item.get("text") or item.get("summary") or "").split())[:160],
                      )
                  )
          except Exception as exc:
              print(f"xoz_comment_test_activity_read_failed={type(exc).__name__}:{str(exc)[:180]}")
          PY
              journalctl -u agent-oz-engage.service -n 50 --no-pager | grep -Ei 'comment|koment|xoz|activity|error|failed|posted|success|url' | tail -n 12 | sed 's/^/xoz_comment_test_agent_oz_engage_log=/'
            } > /tmp/xoz-comment-test-status 2>&1 || true
          fi

          echo "telegram_direct_send_status=disabled"

          echo "virtual-assistant.service: $(systemctl is-active virtual-assistant.service || true)"
          echo "virtual-assistant journal tail:"
          journalctl -u virtual-assistant.service -n 80 --no-pager || true
          echo "virtual-assistant app log tail:"
          sudo tail -80 /home/openclaw2/.openclaw/logs/virtual-assistant.log || true

          echo "Telegram smoke message skipped; deployment status is recorded only in bridge output."
          rm -f /tmp/shared-brain-intro-status

          if grep -q 'present-shared-brain-ui' .virtual-assistant-secret-bridge-trigger; then
            python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID", "6247540911")
          status_path = Path("/tmp/shared-brain-intro-status")
          text = "\n".join([
              "Predstavuji OpenClaw Shared Brain:",
              "",
              "- prehled poznamek: http://100.72.211.11:8812/",
              "- vizualizace grafu: http://100.72.211.11:8812/graph",
              "- data grafu JSON: http://100.72.211.11:8812/graph.json",
              "- co vidi agenti: http://100.72.211.11:8812/agent-view",
