name: Virtual Assistant secret bridge

on:
  push:
    paths:
      - .github/workflows/virtual-assistant-secret-bridge.yml
      - .virtual-assistant-secret-bridge-trigger
      - scripts/agent_virtual_assistant.py
      - scripts/update_virtual_assistant_workspace.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virtual-assistant-secret-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN: ${{ secrets.TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN }}
      TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID: "6247540911"
      MAILTO_JAKUB_GMAIL_OAUTH_TOKEN: ${{ secrets.MAILTO_JAKUB_GMAIL_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bridge secret, deploy runtime, restart assistant
        shell: bash
        run: |
          set -euo pipefail

          token="${TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN:-}"
          chat_id="${TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID:-6247540911}"
          gmail_token="${MAILTO_JAKUB_GMAIL_OAUTH_TOKEN:-}"

          if [ -n "$token" ]; then
            echo "::add-mask::$token"
          fi
          if [ -n "$chat_id" ]; then
            echo "::add-mask::$chat_id"
          fi
          if [ -n "$gmail_token" ]; then
            echo "::add-mask::$gmail_token"
          fi

          if [ -z "$token" ]; then
            echo "Virtual Assistant token secret missing: set TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN in kubiczech808/apps Actions secrets."
            exit 2
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN", "")
          base = f"https://api.telegram.org/bot{token}/"
          def call(method, data=None):
              payload = urllib.parse.urlencode(data or {}).encode() if data is not None else None
              req = urllib.request.Request(base + method, data=payload)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))
          try:
              me = call("getMe")
              print("telegram_getme_ok=", bool(me.get("ok")))
              webhook = call("getWebhookInfo")
              result = webhook.get("result") or {}
              print("telegram_webhook_url_set=", bool(result.get("url")))
              print("telegram_pending_update_count=", result.get("pending_update_count", ""))
              deleted = call("deleteWebhook", {"drop_pending_updates": "false"})
              print("telegram_delete_webhook_ok=", bool(deleted.get("ok")))
          except Exception as exc:
              print("telegram_api_check_failed=", type(exc).__name__)
          PY

          sudo install -d -o openclaw2 -g openclaw2 -m 0755 /home/openclaw2/.openclaw
          sudo touch /home/openclaw2/.openclaw/.env.local

          sudo env VA_TOKEN="$token" VA_CHAT_ID="$chat_id" MAILTO_JAKUB_GMAIL_OAUTH_TOKEN="$gmail_token" python3 - <<'PY'
          from pathlib import Path
          import os
          import pwd

          p = Path("/home/openclaw2/.openclaw/.env.local")
          drop = {
              "TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN",
              "VIRTUAL_ASSISTANT_TELEGRAM_TOKEN",
              "VA_TELEGRAM_TOKEN",
              "M_TELEGRAM_TOKEN",
              "AGENT_VA_TELEGRAM_TOKEN",
              "TELEGRAM_AGENT_VA_BOT_TOKEN",
              "ASSISTANT_TELEGRAM_TOKEN",
              "TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID",
              "VIRTUAL_ASSISTANT_TELEGRAM_CHAT_ID",
              "VA_TELEGRAM_CHAT_ID",
              "M_TELEGRAM_CHAT_ID",
              "AGENT_VA_TELEGRAM_CHAT_ID",
              "TELEGRAM_AGENT_VA_CHAT_ID",
              "ASSISTANT_TELEGRAM_CHAT_ID",
              "MAILTO_JAKUB_GMAIL_OAUTH_TOKEN",
              "VIRTUAL_ASSISTANT_GMAIL_OAUTH_TOKEN",
              "MAILTO_JAKUB_GMAIL_ADDRESS",
              "VIRTUAL_ASSISTANT_EMAIL_ADDRESS",
              "VIRTUAL_ASSISTANT_EMAIL_TRUSTED_SENDERS",
              "VIRTUAL_ASSISTANT_EMAIL_SETUP_RECIPIENT",
              "VIRTUAL_ASSISTANT_EMAIL_POLL_SECONDS",
          }
          lines = []
          if p.exists():
              for raw in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  key = raw.split("=", 1)[0].strip()
                  if key and key not in drop:
                      lines.append(raw)
          lines.append(f"TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN={os.environ['VA_TOKEN']}")
          lines.append(f"TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID={os.environ['VA_CHAT_ID']}")
          if os.environ.get("MAILTO_JAKUB_GMAIL_OAUTH_TOKEN"):
              lines.append(f"MAILTO_JAKUB_GMAIL_OAUTH_TOKEN={os.environ['MAILTO_JAKUB_GMAIL_OAUTH_TOKEN']}")
          lines.append("MAILTO_JAKUB_GMAIL_ADDRESS=mailto.jakub.elias@gmail.com")
          lines.append("VIRTUAL_ASSISTANT_EMAIL_TRUSTED_SENDERS=jakub.elias88@gmail.com,mailto.jakub.elias@gmail.com")
          lines.append("VIRTUAL_ASSISTANT_EMAIL_SETUP_RECIPIENT=jakub.elias88@gmail.com")
          lines.append("VIRTUAL_ASSISTANT_EMAIL_POLL_SECONDS=300")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          account = pwd.getpwnam("openclaw2")
          os.chown(p, account.pw_uid, account.pw_gid)
          os.chmod(p, 0o600)
          PY

          sudo install -d -o openclaw2 -g openclaw2 -m 0755 /home/openclaw2/scripts
          sudo install -o openclaw2 -g openclaw2 -m 0755 scripts/agent_virtual_assistant.py /home/openclaw2/scripts/agent_virtual_assistant.py
          sudo install -o openclaw2 -g openclaw2 -m 0755 scripts/virtual_assistant_playwright.mjs /home/openclaw2/scripts/virtual_assistant_playwright.mjs
          sudo -u openclaw2 -H bash -lc 'set -e; mkdir -p /home/openclaw2/.openclaw/virtual-assistant-node; cd /home/openclaw2/.openclaw/virtual-assistant-node; if [ ! -d node_modules/playwright-core ]; then npm init -y >/dev/null 2>&1 || true; npm install playwright-core >/dev/null; fi' && echo "playwright_install=ok" || echo "playwright_install=failed"
          sudo -u openclaw2 -H python3 scripts/update_virtual_assistant_workspace.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/agent_virtual_assistant.py

          sudo -u openclaw2 -H python3 - <<'PY'
          import contextlib
          import importlib.util
          import io

          spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("codex_cli_present=", bool(module.g.find_codex()))
          print("codex_auth_status=", module.g.codex_auth_status())
          print("ai_backend_effective=", module.g.ai_backend())
          config = module.gmail_env_config()
          print("gmail_oauth_token_present=", bool(config.get("oauth_secret")))
          print("gmail_oauth_secret_kind=", module.gmail_oauth_secret_kind(config.get("oauth_secret", "")))
          print("gmail_address=", config.get("address"))
          print("gmail_poll_seconds=", config.get("poll_seconds"))
          if config.get("oauth_secret"):
              try:
                  module.gmail_poll_once()
                  print("gmail_setup_poll=ok")
              except Exception as exc:
                  print("gmail_setup_poll=failed:", exc)
          else:
              print("gmail_setup_poll=skipped_missing_secret")
          PY

          sudo systemctl daemon-reload
          sudo systemctl enable --now virtual-assistant.service
          sudo systemctl restart virtual-assistant.service
          sleep 3

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID", "6247540911")
          text = "Virtualni asistentka: diagnostika probehla, sluzba byla restartovana. Pokud tohle vidis, Telegram token a chat id funguji."
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          try:
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("telegram_direct_send_status=", response.status)
          except Exception as exc:
              print("telegram_direct_send_failed=", type(exc).__name__)
          PY

          echo "virtual-assistant.service: $(systemctl is-active virtual-assistant.service || true)"
          echo "virtual-assistant journal tail:"
          journalctl -u virtual-assistant.service -n 80 --no-pager || true
          echo "virtual-assistant app log tail:"
          sudo tail -80 /home/openclaw2/.openclaw/logs/virtual-assistant.log || true

          echo "Telegram smoke message skipped; deployment status is recorded only in bridge output."

      - name: Commit sanitized bridge output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "bridge_output_format=safe-summary-v1"
            echo "checked_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "playwright_install=$(sudo -u openclaw2 -H bash -lc 'test -d /home/openclaw2/.openclaw/virtual-assistant-node/node_modules/playwright-core && echo ok || echo missing' 2>/dev/null || echo unknown)"
            python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_VIRTUAL_ASSISTANT_CHAT_ID", "6247540911")
          base = f"https://api.telegram.org/bot{token}/"
          def call(method, data=None):
              payload = urllib.parse.urlencode(data or {}).encode() if data is not None else None
              req = urllib.request.Request(base + method, data=payload)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))
          print("telegram_token_present=", bool(token))
          try:
              me = call("getMe")
              print("telegram_getme_ok=", bool(me.get("ok")))
              result = (call("getWebhookInfo").get("result") or {})
              print("telegram_webhook_url_set=", bool(result.get("url")))
              print("telegram_pending_update_count=", result.get("pending_update_count", ""))
              sent = call("sendMessage", {
                  "chat_id": chat_id,
                  "text": "Virtualni asistentka: diagnosticky ping z bridge outputu. Telegram API funguje.",
              })
              print("telegram_direct_send_ok=", bool(sent.get("ok")))
          except Exception as exc:
              print(f"telegram_api_check=failed:{type(exc).__name__}")
          PY
            sudo -u openclaw2 -H python3 - <<'PY'
          import contextlib
          import importlib.util
          import io

          spec = importlib.util.spec_from_file_location("va", "/home/openclaw2/scripts/agent_virtual_assistant.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("codex_cli_present=", bool(module.g.find_codex()))
          print("codex_auth_status=", module.g.codex_auth_status())
          print("ai_backend_effective=", module.g.ai_backend())
          config = module.gmail_env_config()
          print("gmail_oauth_token_present=", bool(config.get("oauth_secret")))
          print("gmail_oauth_secret_kind=", module.gmail_oauth_secret_kind(config.get("oauth_secret", "")))
          print("gmail_address=", config.get("address"))
          print("gmail_poll_seconds=", config.get("poll_seconds"))
          try:
              reply = module.g.call_ai([{"role": "user", "content": "SMOKE TEST: Odpovez presne textem VA_SMOKE_OK a nic dalsiho."}])
              print("ai_smoke_ok=", "VA_SMOKE_OK" in reply)
          except Exception as exc:
              print(f"ai_smoke_failed={type(exc).__name__}:{str(exc)[:180]}")
          if config.get("oauth_secret"):
              try:
                  with contextlib.redirect_stdout(io.StringIO()):
                      module.gmail_poll_once()
                  print("gmail_setup_poll=ok")
              except Exception as exc:
                  print(f"gmail_setup_poll=failed:{type(exc).__name__}")
          else:
              print("gmail_setup_poll=skipped_missing_secret")
          PY
            sudo -u openclaw2 -H python3 - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          base = Path("/home/openclaw2/.openclaw")
          state_path = base / "virtual-assistant-state.json"
          lock_path = base / "virtual-assistant.lock"
          log_path = base / "logs" / "virtual-assistant.log"
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except Exception:
              state = {}
          print("telegram_state_offset=", state.get("offset", ""))
          print("virtual_assistant_lock_exists=", lock_path.exists())
          if lock_path.exists():
              try:
                  print("virtual_assistant_lock_age_sec=", int(time.time() - lock_path.stat().st_mtime))
              except Exception:
                  print("virtual_assistant_lock_age_sec=unknown")
          print("virtual_assistant_log_exists=", log_path.exists())
          if log_path.exists():
              try:
                  print("virtual_assistant_log_mtime_utc=", time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(log_path.stat().st_mtime)))
                  lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
                  selected = [
                      line for line in lines[-200:]
                      if re.search(r"(daemon started|email worker started|poll error|error|failed|Timeout|Codex CLI|Codex backend|Model route|Email processed|Telegram bot commands)", line, re.I)
                  ][-12:]
                  for idx, line in enumerate(selected, 1):
                      clean = re.sub(r"\d{8,}:[A-Za-z0-9_-]{20,}", "<telegram-token>", line)
                      clean = clean[:240]
                      print(f"virtual_assistant_log_signal_{idx}={clean}")
              except Exception as exc:
                  print(f"virtual_assistant_log_read=failed:{type(exc).__name__}")
          PY
            echo "virtual_assistant_service=$(systemctl is-active virtual-assistant.service || true)"
          } > .virtual-assistant-bridge-output
          git config user.email "rpi-runner@openclaw"
          git config user.name "RPi Runner"
          git add .virtual-assistant-bridge-output
          git diff --cached --quiet || git commit -m "virtual-assistant: bridge output"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
