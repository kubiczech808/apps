name: Email Campaign AI Research

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: email-campaign-ai-research
  cancel-in-progress: true

jobs:
  ai-research:
    runs-on: ubuntu-latest
    steps:
      - name: Run AI research endpoint
        env:
          APP_DATABASE_NAME: ${{ secrets.APP_DATABASE_NAME }}
          APP_DATABASE_USERNAME: ${{ secrets.APP_DATABASE_USERNAME }}
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD }}
        run: |
          if [ -z "$APP_DATABASE_NAME" ] || [ -z "$APP_DATABASE_USERNAME" ] || [ -z "$APP_DATABASE_PASSWORD" ]; then
            echo "Missing database secrets; cannot derive cron token."
            exit 1
          fi
          TOKEN=$(python3 - <<'PY'
          import hashlib
          import os

          material = "email-campaign-cron:" + os.environ["APP_DATABASE_NAME"] + ":" + os.environ["APP_DATABASE_USERNAME"] + ":" + os.environ["APP_DATABASE_PASSWORD"]
          print(hashlib.sha256(material.encode("utf-8")).hexdigest())
          PY
          )
          http_code=$(curl --show-error --silent --max-time 300 --output /tmp/email-campaign-ai-research-body.txt --write-out "%{http_code}" "https://www.osobnizkusenosti.cz/email-campaign/?cron=${TOKEN}&ai_research=1")
          echo "HTTP ${http_code}"
          cat /tmp/email-campaign-ai-research-body.txt
          test "$http_code" -ge 200 -a "$http_code" -lt 400
