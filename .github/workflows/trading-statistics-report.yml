name: Trading Statistics Report

on:
  # Run separately from the ten-minute execution poll. This dispatch only rebuilds
  # the report from the complete resolved archive; it never scans or opens trades.
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-report:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch report rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/trading-paper-bot.yml/dispatches" \
            --data "{\"ref\":\"${REF}\",\"inputs\":{\"mode\":\"report\"}}"
