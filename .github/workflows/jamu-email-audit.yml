name: Audit JAMU email delivery

on:
  workflow_dispatch:
  push:
    branches: ['feat/jamu-multilingual']
    paths:
      - '.github/jamu-email-audit-trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAMU_FTP_LOGIN: ${{ secrets.JAMU_FTP_LOGIN }}
      JAMU_FTP_PWD: ${{ secrets.JAMU_FTP_PWD }}
      JAMU_TEST_EMAIL_RECIPIENT: ej.akub@seznam.cz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jamu-multilingual
      - name: Run read-only email delivery audit
        run: python scripts/jamu_email_audit.py
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jamu-content/email-delivery-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Audit JAMU email delivery configuration'
          git push origin HEAD:feat/jamu-multilingual
