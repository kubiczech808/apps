name: Agent Image Quality Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - scripts/harden_agent_image_quality.py
      - .github/workflows/agent-image-quality-bridge.yml
      - .github/agent-image-quality-trigger.txt

permissions:
  contents: read

concurrency:
  group: agent-image-quality-bridge
  cancel-in-progress: false

jobs:
  harden:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image quality hardener
        run: |
          set -euo pipefail
          sudo install -d -o openclaw2 -g openclaw2 -m 0755 /home/openclaw2/scripts
          sudo install -o openclaw2 -g openclaw2 -m 0755 scripts/harden_agent_image_quality.py /home/openclaw2/scripts/harden_agent_image_quality.py

      - name: Apply image quality hardening
        run: |
          set -euo pipefail
          sudo -u openclaw2 -H python3 /home/openclaw2/scripts/harden_agent_image_quality.py

      - name: Compile patched runtime scripts
        run: |
          set -euo pipefail
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/harden_agent_image_quality.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/x_approve.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/.openclaw/x_post.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/btc-dca-blogger.py

      - name: Restart Agent D approval daemon
        run: |
          set -euo pipefail
          if systemctl list-unit-files x-approve.service --no-legend | grep -q '^x-approve.service'; then
            sudo systemctl restart x-approve.service
            sudo systemctl is-active --quiet x-approve.service
            echo "x-approve.service restarted"
          else
            echo "x-approve.service not installed; restart skipped"
          fi
