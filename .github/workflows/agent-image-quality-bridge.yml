name: Agent Image Quality Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - scripts/harden_agent_image_quality.py
      - .github/workflows/agent-image-quality-bridge.yml
      - .github/agent-image-quality-trigger.txt

permissions:
  contents: read

concurrency:
  group: agent-image-quality-bridge
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Roll back image quality hardening
        run: |
          set -euo pipefail
          restore_if_marked() {
            target="$1"
            if ! sudo -u openclaw2 -H test -f "$target"; then
              echo "missing: $target"
              return 0
            fi
            if ! sudo -u openclaw2 -H grep -Eq '2026-07-18-no-text-clean-images-v1|IMAGE_QUALITY_POLICY_VERSION' "$target"; then
              echo "skip unchanged: $target"
              return 0
            fi
            backup="$(sudo find "$(dirname "$target")" -maxdepth 1 -name "$(basename "$target").bak-image-quality-*" -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
            if [ -z "$backup" ] || [ ! -f "$backup" ]; then
              echo "backup not found for $target" >&2
              return 1
            fi
            stamp="$(date +%Y%m%d%H%M%S)"
            sudo cp -p "$target" "${target}.pre-image-quality-rollback-${stamp}"
            sudo cp -p "$backup" "$target"
            sudo chown openclaw2:openclaw2 "$target"
            echo "restored: $target from $backup"
          }

          restore_if_marked /home/openclaw2/scripts/x_approve.py
          restore_if_marked /home/openclaw2/.openclaw/x_post.py
          restore_if_marked /home/openclaw2/scripts/btc-dca-blogger.py

          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/x_approve.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/.openclaw/x_post.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/btc-dca-blogger.py

      - name: Restart Agent D approval daemon
        run: |
          set -euo pipefail
          if systemctl list-unit-files x-approve.service --no-legend | grep -q '^x-approve.service'; then
            sudo systemctl restart x-approve.service
            sudo systemctl is-active --quiet x-approve.service
            echo "x-approve.service restarted"
          else
            echo "x-approve.service not installed; restart skipped"
          fi
