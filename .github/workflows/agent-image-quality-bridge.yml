name: Agent Image Quality Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - claude/energy-consumption-app-Nf7bh
    paths:
      - scripts/harden_agent_image_quality.py
      - .github/workflows/agent-image-quality-bridge.yml
      - .github/agent-image-quality-trigger.txt

permissions:
  contents: read

concurrency:
  group: agent-image-quality-bridge
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Roll back image quality hardening
        run: |
          set -euo pipefail
          sudo -u openclaw2 -H python3 - <<'PY'
          import datetime as dt
          import shutil
          from pathlib import Path

          markers = ("2026-07-18-no-text-clean-images-v1", "IMAGE_QUALITY_POLICY_VERSION")
          targets = [
              Path("/home/openclaw2/scripts/x_approve.py"),
              Path("/home/openclaw2/.openclaw/x_post.py"),
              Path("/home/openclaw2/scripts/btc-dca-blogger.py"),
          ]
          stamp = dt.datetime.now().strftime("%Y%m%d%H%M%S")
          changed = []
          for target in targets:
              if not target.exists():
                  print(f"missing: {target}")
                  continue
              text = target.read_text(encoding="utf-8", errors="replace")
              if not any(marker in text for marker in markers):
                  print(f"skip unchanged: {target}")
                  continue
              backups = sorted(
                  target.parent.glob(target.name + ".bak-image-quality-*"),
                  key=lambda p: p.stat().st_mtime,
              )
              if not backups:
                  raise SystemExit(f"backup not found for {target}")
              backup = backups[-1]
              pre = target.with_name(target.name + f".pre-image-quality-rollback-{stamp}")
              shutil.copy2(target, pre)
              shutil.copy2(backup, target)
              changed.append(str(target))
              print(f"restored: {target} from {backup}")
          print("changed files: " + (", ".join(changed) if changed else "none"))
          PY

          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/x_approve.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/.openclaw/x_post.py
          sudo -u openclaw2 -H python3 -m py_compile /home/openclaw2/scripts/btc-dca-blogger.py

      - name: Restart Agent D approval daemon
        run: |
          set -euo pipefail
          if systemctl list-unit-files x-approve.service --no-legend | grep -q '^x-approve.service'; then
            sudo systemctl restart x-approve.service
            sudo systemctl is-active --quiet x-approve.service
            echo "x-approve.service restarted"
          else
            echo "x-approve.service not installed; restart skipped"
          fi
