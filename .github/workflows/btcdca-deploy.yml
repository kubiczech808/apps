name: Deploy BTC-DCA Google Login

on:
  push:
    branches:
      - main
      - master
      - claude/energy-consumption-app-Nf7bh
    paths:
      - 'btcdca-auth/**'
      - '.github/workflows/btcdca-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-google-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        env:
          BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
          BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
          BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
          BTCDCA_GOOGLE_CLIENT_ID: ${{ secrets.BTCDCA_GOOGLE_CLIENT_ID }}
          BTCDCA_GOOGLE_SECRET: ${{ secrets.BTCDCA_GOOGLE_SECRET }}
        run: |
          for name in BTCDCA_DB BTCDCA_DB_USER BTCDCA_DB_PASSWORD BTCDCA_FTP_LOGIN BTCDCA_FTP_PASSWORD BTCDCA_GOOGLE_CLIENT_ID BTCDCA_GOOGLE_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required."
              exit 1
            fi
          done

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare generated config and patched login
        env:
          BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
          BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
          BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
          BTCDCA_GOOGLE_CLIENT_ID: ${{ secrets.BTCDCA_GOOGLE_CLIENT_ID }}
          BTCDCA_GOOGLE_SECRET: ${{ secrets.BTCDCA_GOOGLE_SECRET }}
          BTCDCA_AUTH_SECRET: ${{ secrets.BTCDCA_AUTH_SECRET }}
          BACKUP_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p server-current deploy-root/www deploy-root/www/app

          lftp -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$BTCDCA_FTP_LOGIN\",\"$BTCDCA_FTP_PASSWORD\" ftp.btc-dca.com;
            get -O server-current www/login-user.php;
            get www/app/.htaccess -o server-current/app.htaccess || true;
            mkdir -p .codex-backups/btcdca-auth/$BACKUP_ID;
            put -O .codex-backups/btcdca-auth/$BACKUP_ID server-current/login-user.php;
            put -O .codex-backups/btcdca-auth/$BACKUP_ID server-current/app.htaccess || true;
            bye
          "

          python3 - <<'PY'
          from pathlib import Path
          source = Path("server-current/login-user.php")
          target = Path("deploy-root/www/login-user.php")
          html = source.read_text(encoding="utf-8", errors="replace")

          css = """
    .google-oauth-btn { display:flex; align-items:center; justify-content:center; width:100%; padding:13px 14px; background:#fff; color:#202124; border:1px solid var(--border); border-radius:10px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:all .2s; text-align:center; margin-bottom:0; }
    .google-oauth-btn:hover { background:#f8fafc; color:#000; opacity:1; transform:translateY(-1px); }
    .google-oauth-btn::before { content:'G'; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-right:10px; border-radius:50%; color:#4285f4; background:#fff; border:1px solid #dfe3ea; font-weight:800; }
"""
          block = """    <?php if (!empty($_SESSION['btcdca_google_error'])): ?>
      <div class="alert alert-danger"><?= htmlspecialchars((string)$_SESSION['btcdca_google_error'], ENT_QUOTES, 'UTF-8'); unset($_SESSION['btcdca_google_error']); ?></div>
    <?php endif; ?>
    <a class="google-oauth-btn" href="btcdca-google-login.php">Continue with Google</a>
    <div class="divider">or</div>
"""

          if "google-oauth-btn" not in html:
              if "</style>" not in html:
                  raise SystemExit("Could not find </style> in login-user.php")
              html = html.replace("</style>", css + "\n  </style>", 1)
              marker = '<form action="login-user.php"'
              if marker not in html:
                  raise SystemExit("Could not find login form in login-user.php")
              html = html.replace(marker, block + "    " + marker, 1)

          target.write_text(html, encoding="utf-8")
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path

          def php_string(value):
              return "'" + (value or "").replace("\\", "\\\\").replace("'", "\\'") + "'"

          auth_secret = os.environ.get("BTCDCA_AUTH_SECRET") or "/X9BpAxcKC7bHTvy5u16nJUhG4nUEjTQMkbOR0ikyACR/ubE6cbZnmZhEKw2bnUA"
          content = f"""<?php

          return [
              'db_host' => 'LOCALHOST',
              'db_port' => 3306,
              'db_name' => {php_string(os.environ.get("BTCDCA_DB"))},
              'db_user' => {php_string(os.environ.get("BTCDCA_DB_USER"))},
              'db_password' => {php_string(os.environ.get("BTCDCA_DB_PASSWORD"))},
              'google_client_id' => {php_string(os.environ.get("BTCDCA_GOOGLE_CLIENT_ID"))},
              'google_client_secret' => {php_string(os.environ.get("BTCDCA_GOOGLE_SECRET"))},
              'google_redirect_uri' => 'https://www.btc-dca.com/app/auth/google/callback',
              'auth_secret' => {php_string(auth_secret)},
          ];
          """
          Path("deploy-root/btcdca-google-config.php").write_text(content, encoding="utf-8")
          PY

          cp btcdca-auth/btcdca-google-login.php deploy-root/www/btcdca-google-login.php
          cp btcdca-auth/btcdca-google-callback.php deploy-root/www/btcdca-google-callback.php
          cp btcdca-auth/app.htaccess deploy-root/www/app/.htaccess

      - name: Lint generated PHP
        run: |
          php -v
          find deploy-root -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload backed-up and patched auth files
        env:
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 5;
            set net:timeout 30;
            open -u \"$BTCDCA_FTP_LOGIN\",\"$BTCDCA_FTP_PASSWORD\" ftp.btc-dca.com;
            put -O . deploy-root/btcdca-google-config.php;
            put -O www deploy-root/www/login-user.php;
            put -O www deploy-root/www/btcdca-google-login.php;
            put -O www deploy-root/www/btcdca-google-callback.php;
            mkdir -p www/app;
            put deploy-root/www/app/.htaccess -o www/app/.htaccess;
            bye
          "
