name: Deploy BTC-DCA Google Login

# Deploys only the BTC-DCA auth files and backs up the current login page first.
on:
  push:
    branches:
      - main
      - master
      - claude/energy-consumption-app-Nf7bh
    paths:
      - 'btcdca-auth/**'
      - '.github/workflows/btcdca-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-google-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        env:
          BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
          BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
          BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
          BTCDCA_GOOGLE_CLIENT_ID: ${{ secrets.BTCDCA_GOOGLE_CLIENT_ID }}
          BTCDCA_GOOGLE_SECRET: ${{ secrets.BTCDCA_GOOGLE_SECRET }}
        run: |
          if [ -z "$BTCDCA_DB" ]; then echo "BTCDCA_DB secret is required."; exit 1; fi
          if [ -z "$BTCDCA_DB_USER" ]; then echo "BTCDCA_DB_USER secret is required."; exit 1; fi
          if [ -z "$BTCDCA_DB_PASSWORD" ]; then echo "BTCDCA_DB_PASSWORD secret is required."; exit 1; fi
          if [ -z "$BTCDCA_FTP_LOGIN" ]; then echo "BTCDCA_FTP_LOGIN secret is required."; exit 1; fi
          if [ -z "$BTCDCA_FTP_PASSWORD" ]; then echo "BTCDCA_FTP_PASSWORD secret is required."; exit 1; fi
          if [ -z "$BTCDCA_GOOGLE_CLIENT_ID" ]; then echo "BTCDCA_GOOGLE_CLIENT_ID secret is required."; exit 1; fi
          if [ -z "$BTCDCA_GOOGLE_SECRET" ]; then echo "BTCDCA_GOOGLE_SECRET secret is required."; exit 1; fi

      - name: Check Python
        run: |
          python3 --version

      - name: Prepare generated config and patched login
        env:
          BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
          BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
          BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
          BTCDCA_GOOGLE_CLIENT_ID: ${{ secrets.BTCDCA_GOOGLE_CLIENT_ID }}
          BTCDCA_GOOGLE_SECRET: ${{ secrets.BTCDCA_GOOGLE_SECRET }}
          BTCDCA_AUTH_SECRET: ${{ secrets.BTCDCA_AUTH_SECRET }}
          BACKUP_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BTCDCA_FTP_MODE: prepare
        run: |
          set -euo pipefail
          mkdir -p server-current deploy-root/www deploy-root/www/app/auth/google

          python3 btcdca-auth/ftp_transfer.py

          python3 btcdca-auth/patch_login.py
          python3 btcdca-auth/patch_signup.py
          python3 btcdca-auth/patch_app_htaccess.py
          python3 btcdca-auth/generate_config.py

          cp btcdca-auth/btcdca-google-login.php deploy-root/www/btcdca-google-login.php
          cp btcdca-auth/btcdca-google-callback.php deploy-root/www/btcdca-google-callback.php
          cp btcdca-auth/google-index.php deploy-root/www/app/auth/google/index.php

      - name: Lint generated PHP
        run: |
          php -v
          find deploy-root -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload backed-up and patched auth files
        env:
          BTCDCA_FTP_LOGIN: ${{ secrets.BTCDCA_FTP_LOGIN }}
          BTCDCA_FTP_PASSWORD: ${{ secrets.BTCDCA_FTP_PASSWORD }}
          BTCDCA_FTP_MODE: upload
        run: |
          set -euo pipefail
          python3 btcdca-auth/ftp_transfer.py
