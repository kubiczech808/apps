name: Trading Execution Scope Diagnosis

# READ-ONLY, manual only. Public GETs against the published API, no writes, and it flips no
# switch -- activating database reads stays a separate, deliberate act.
#
# The gate on the second cutover attempt. The first was activated and rolled back inside
# five minutes: the hosting answered in 58 seconds and reset connections, because every
# request decoded the whole active catalogue. The replacement is a query bounded by each
# portfolio's own rules, and this measures whether that query returns the same markets --
# missedByQuery must be 0 before anything is switched.
on:
  workflow_dispatch:
    inputs:
      strategy_ids:
        description: "Comma separated paper portfolio ids to probe"
        required: false
        default: "esports,counterstrike2,leagueoflegends,conservative,highReward"
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Scoped query against the whole-catalogue read
        env:
          TRADING_HOST: https://osobnizkusenosti.cz/trading
          STRATEGY_IDS: ${{ inputs.strategy_ids || 'esports,counterstrike2,leagueoflegends,conservative,highReward' }}
        run: python3 trading/tools/execution-scope-probe.py
