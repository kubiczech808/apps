name: JAMU FTP file count audit

on:
  workflow_dispatch:
  push:
    branches: ['feat/jamu-multilingual']
    paths:
      - '.github/jamu-file-audit-trigger'
      - '.github/workflows/jamu-file-audit.yml'
      - 'scripts/jamu_ftp_file_audit.py'

permissions:
  contents: write

concurrency:
  group: jamu-ftp-file-audit
  cancel-in-progress: true

jobs:
  file-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAMU_FTP_LOGIN: ${{ secrets.JAMU_FTP_LOGIN }}
      JAMU_FTP_PWD: ${{ secrets.JAMU_FTP_PWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jamu-multilingual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate secrets
        run: |
          test -n "$JAMU_FTP_LOGIN" || { echo 'Missing JAMU_FTP_LOGIN'; exit 1; }
          test -n "$JAMU_FTP_PWD" || { echo 'Missing JAMU_FTP_PWD'; exit 1; }
          test -f scripts/jamu_ftp_file_audit.py
          test -f scripts/templates/jamu_file_audit_bridge.php
      - name: Install Python dependencies
        run: python -m pip install requests
      - name: Run read-only FTP file count audit
        run: |
          set +e
          python --version
          python scripts/jamu_ftp_file_audit.py > jamu-content/file-audit-stdout.txt 2> jamu-content/file-audit-stderr.txt
          code=$?
          if [ "$code" -ne 0 ] && [ ! -f jamu-content/file-audit-error.json ]; then
            mkdir -p jamu-content
            printf '{\n  "error": "audit command exited with code %s before Python error report was written"\n}\n' "$code" > jamu-content/file-audit-error.json
          fi
          if [ "$code" -eq 0 ]; then
            rm -f jamu-content/file-audit-error.json jamu-content/file-audit-stderr.txt
          fi
          exit "$code"
      - name: Commit audit report to working branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A jamu-content/file-audit.json 2>/dev/null || true
          git add -A jamu-content/file-audit-error.json 2>/dev/null || true
          git add -A jamu-content/file-audit-stdout.txt 2>/dev/null || true
          git add -A jamu-content/file-audit-stderr.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Capture JAMU FTP file count audit'
          git push origin HEAD:feat/jamu-multilingual
