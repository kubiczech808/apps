name: Agent M — Update Links

on:
  push:
    branches:
      - claude/multi-platform-auto-poster-p3uBn
    paths:
      - '.github/agent-m-update-trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/multi-platform-auto-poster-p3uBn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: medium-poster
        run: pip install .

      - name: Create .env
        working-directory: medium-poster
        run: |
          printf '%s\n' \
            "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY_M }}" \
            "TELEGRAM_BOT_TOKEN=${{ secrets.M_TELEGRAM_TOKEN }}" \
            "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.M_TELEGRAM_CHAT_ID }}" \
            "GITHUB_PAT=${{ secrets.PAT_GITHUB_MEDIUM }}" \
            "DEVTO_API_KEY=${{ secrets.DEVTO_API_KEY }}" \
            "SITE_URL=https://btc-dca.com" \
            "SITE_NAME=btc-dca.com" \
            "LOG_LEVEL=INFO" > .env

      - name: Run update-links
        id: update
        working-directory: medium-poster
        continue-on-error: true
        run: |
          python -m agent_m.cli update-links 2>&1 | tee /tmp/update_raw.log

      - name: Write result to debug issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'No log';
            try { log = fs.readFileSync('/tmp/update_raw.log', 'utf8'); } catch(e) {}
            const tail = log.split('\n').slice(-60).join('\n').substring(0,3000);
            const body = `**Update-links ${new Date().toISOString()} | outcome: ${{ steps.update.outcome }}**\n\nLog:\n\`\`\`\n${tail}\n\`\`\``;
            const issues = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,labels:['agent-m-debug'],state:'open'});
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issues.data[0].number,body});
            }
