name: Audit BTC-DCA Database Storage

on:
  workflow_dispatch:
    inputs:
      database_host:
        description: "Public database host to try; no hosting files are uploaded"
        required: false
        default: neuron.blueboard.cz
        type: string
      database_port:
        description: "MySQL TCP port"
        required: false
        default: "3306"
        type: string

permissions:
  contents: read

concurrency:
  group: btcdca-db-storage-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BTCDCA_DB: ${{ secrets.BTCDCA_DB }}
      BTCDCA_DB_USER: ${{ secrets.BTCDCA_DB_USER }}
      BTCDCA_DB_PASSWORD: ${{ secrets.BTCDCA_DB_PASSWORD }}
      REQUESTED_DB_HOST: ${{ inputs.database_host }}
      REQUESTED_DB_PORT: ${{ inputs.database_port }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate audit prerequisites
        run: |
          set -euo pipefail
          for name in BTCDCA_DB BTCDCA_DB_USER BTCDCA_DB_PASSWORD REQUESTED_DB_HOST REQUESTED_DB_PORT; do
            test -n "${!name}" || { echo "$name is required."; exit 1; }
          done
          [[ "$REQUESTED_DB_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Database port must be numeric."; exit 1; }

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Connect directly to the database without modifying hosting files
        run: |
          set -euo pipefail
          candidates=("$REQUESTED_DB_HOST" "neuron.blueboard.cz" "ftp.btc-dca.com" "217.11.249.141")
          seen='|'
          for host in "${candidates[@]}"; do
            [ -n "$host" ] || continue
            case "$seen" in *"|$host|"*) continue ;; esac
            seen="${seen}${host}|"
            echo "Trying direct MySQL connection to $host:$REQUESTED_DB_PORT"
            if MYSQL_PWD="$BTCDCA_DB_PASSWORD" mysql \
              --batch --raw --skip-column-names --connect-timeout=12 \
              --host="$host" --port="$REQUESTED_DB_PORT" --user="$BTCDCA_DB_USER" "$BTCDCA_DB" \
              --execute='SELECT 1' > /dev/null 2> db-connection-error.log; then
              echo "BTCDCA_CONNECTED_DB_HOST=$host" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No direct MySQL connection was accepted. The hosting may limit this database user to LOCALHOST."
          exit 1

      - name: Read table allocation metadata
        run: |
          set -euo pipefail
          export MYSQL_PWD="$BTCDCA_DB_PASSWORD"
          mysql --batch --raw --skip-column-names \
            --host="$BTCDCA_CONNECTED_DB_HOST" --port="$REQUESTED_DB_PORT" --user="$BTCDCA_DB_USER" "$BTCDCA_DB" \
            --execute="SELECT TABLE_NAME, COALESCE(ENGINE,''), COALESCE(TABLE_ROWS,0), COALESCE(DATA_LENGTH,0), COALESCE(INDEX_LENGTH,0), COALESCE(DATA_FREE,0), COALESCE(DATA_LENGTH,0)+COALESCE(INDEX_LENGTH,0) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() ORDER BY 7 DESC, 1 ASC" \
            > tables.tsv
          mysql --batch --raw --skip-column-names \
            --host="$BTCDCA_CONNECTED_DB_HOST" --port="$REQUESTED_DB_PORT" --user="$BTCDCA_DB_USER" "$BTCDCA_DB" \
            --execute="SELECT TABLE_NAME, COLUMN_NAME, DATA_TYPE, COALESCE(CHARACTER_MAXIMUM_LENGTH,'') FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND DATA_TYPE IN ('tinyblob','blob','mediumblob','longblob','tinytext','text','mediumtext','longtext','json') ORDER BY TABLE_NAME, ORDINAL_POSITION" \
            > large-columns.tsv
          python3 - <<'PY'
          import os
          from pathlib import Path

          def rows(path, columns):
              values = []
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  fields = line.split('\t')
                  if len(fields) != columns:
                      raise RuntimeError(f'Unexpected row in {path}: {line!r}')
                  values.append(fields)
              return values

          tables = rows('tables.tsv', 7)
          columns = rows('large-columns.tsv', 4)
          total = sum(int(row[6]) for row in tables)
          fmt = lambda value: f'{value / 1024 / 1024:.2f} MB'
          wordpress = [row[0] for row in tables if row[0].startswith('wp_dca_')]
          isolated = [row[0] for row in tables if row[0].startswith('btcdca_isolated_wp_')]
          report = [
              '# BTC-DCA Database Storage Audit',
              '',
              'Direct, read-only MySQL audit. No PHP endpoint or hosting file was uploaded.',
              '',
              '## Summary',
              '',
              f"- Connected host: `{os.environ['BTCDCA_CONNECTED_DB_HOST']}`",
              f'- Tables: {len(tables)}',
              f'- Allocated table space: {fmt(total)}',
              f'- Active WordPress tables (`wp_dca_*`): {len(wordpress)}',
              f'- Isolated WordPress tables (`btcdca_isolated_wp_*`): {len(isolated)}',
              '',
              '## Tables By Allocated Size',
              '',
              '| Table | Engine | Estimated rows | Data | Indexes | Free | Allocated | Share |',
              '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |',
          ]
          for name, engine, count, data, indexes, free, allocated in tables:
              allocated_int = int(allocated)
              share = allocated_int / total * 100 if total else 0
              report.append(
                  f'| `{name}` | {engine or "-"} | {int(count):,} | {fmt(int(data))} | '
                  f'{fmt(int(indexes))} | {fmt(int(free))} | {fmt(allocated_int)} | {share:.1f}% |'
              )
          report.extend(['', '## Large-Value Columns', ''])
          if columns:
              report.extend(['| Table | Column | Type | Maximum length |', '| --- | --- | --- | ---: |'])
              for table, column, data_type, maximum in columns:
                  report.append(f'| `{table}` | `{column}` | {data_type} | {maximum or "-"} |')
          else:
              report.append('No text, blob, or JSON columns were reported.')
          report.extend(['', '## WordPress Verification', ''])
          if wordpress or isolated:
              report.append('WordPress-prefixed tables still exist:')
              report.extend(f'- `{name}`' for name in wordpress + isolated)
          else:
              report.append('No active or isolated WordPress table prefixes remain.')
          Path('btcdca-db-storage-audit.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(Path('btcdca-db-storage-audit.md').read_text(encoding='utf-8'))
          PY

      - name: Upload database storage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btcdca-db-storage-audit-${{ github.run_id }}
          path: |
            tables.tsv
            large-columns.tsv
            btcdca-db-storage-audit.md
          retention-days: 90
          if-no-files-found: error
